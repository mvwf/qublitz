name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # qutip 4.7.6 has no cp312 wheel, so it builds from source and needs a
      # BLAS/LAPACK development library available on the runner.
      - name: Install BLAS for the qutip source build
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Smoke tests (pytest)
        run: pytest -q

      # The embedded game (C02-T4) vendors quantum_chess.html + its physics
      # regression test under pages/_assets/. Run it when present.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Game physics regression test
        if: ${{ hashFiles('pages/_assets/tests/qphysics.test.js') != '' }}
        run: node pages/_assets/tests/qphysics.test.js pages/_assets/quantum_chess.html

      # The browser Qubit Simulator's engine must keep matching the Python
      # implementation; reference data comes from scripts/make_qubit_reference.py.
      - name: Qubit engine regression test
        run: node web/qublitz/tests/qubit-engine.test.js

      - name: Fridge noise engine regression test
        run: node web/qublitz/tests/fridge-engine.test.js

      - name: EP/TPD engine regression test
        run: node web/qublitz/tests/ep-engine.test.js

      - name: Sonify engine regression test
        run: node web/qublitz/tests/sonify-engine.test.js

      # Rabi Rider: rotation sense, the watched-T1 trajectories against e^{-t/T1}, and course fairness.
      - name: Rabi Rider engine test
        run: node web/qublitz/tests/rabi-engine.test.js

      # BE-7 — pages/_assets/quantum_chess.html is a hand-synced copy of the
      # game repo's canonical file; nothing enforced that until now. Fails
      # the build if it drifts from the committed pages/_assets/VENDOR_SHA
      # (written by the game repo's scripts/sync_vendor.sh).
      - name: Vendor hash check
        run: bash scripts/check_vendor.sh

      # Qubit Copter: on-resonance rotations, the steering rule, and that every target can be reached in time.
      - name: Qubit Copter engine test
        run: node web/qublitz/tests/copter-engine.test.js
