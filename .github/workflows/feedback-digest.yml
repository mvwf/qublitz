name: feedback-digest

# Weekly feedback digest: open issues, 'Was this page useful?' votes, script errors and the dashboard's flags (hard
# questions, levels people stop at, low ratings), ranked by what to fix first (scripts/feedback_digest.js,
# docs/FEEDBACK_LOOP.md). It keeps ONE open issue labelled feedback-digest and rewrites its body each week.
on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays 12:00 UTC
  workflow_dispatch:
    inputs:
      days:
        description: How many days back to look
        default: "7"

permissions:
  contents: read
  issues: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DAYS: ${{ inputs.days || '7' }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Write the digest
        run: node scripts/feedback_digest.js --days "$DAYS" --out digest.md --json flags.json
      - name: Post it as the one feedback-digest issue
        run: |
          gh label create feedback-digest --color 0E8A16 --description "Weekly feedback digest (one open issue, rewritten each week)" 2>/dev/null || true
          gh label create feedback --color D4C5F9 --description "Comments, ideas and problems from players" 2>/dev/null || true
          n=$(gh issue list --label feedback-digest --state open --json number --jq '.[0].number')
          if [ -n "$n" ]; then
            gh issue edit "$n" --body-file digest.md
            echo "Updated #$n"
          else
            gh issue create --title "Feedback digest" --label feedback-digest --body-file digest.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: feedback-digest
          path: |
            digest.md
            flags.json
          retention-days: 90
