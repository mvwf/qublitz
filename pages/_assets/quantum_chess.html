/* FE-5 — self-hosted, subsetted fonts (2026-07-08). Previously loaded via a
   render-blocking Google Fonts @import — a CDN dependency that made the
   project's "single self-contained file, no network deps" claim false and
   broke offline classroom loads (fallback monospace at sizes tuned for the
   pixel font). Both fonts are now embedded as base64 WOFF2 @font-face rules:
   zero requests, works fully offline (verified via tests/offline_check.js).

   Press Start 2P: subsetted to the glyphs actually used anywhere in this
   file (all printable ASCII 0x20-007E, plus the handful of extra symbols
   this font's Latin face actually has glyphs for and that appear in-file:
   en/em dash, ellipsis, times/plus-minus/degree/middle-dot/minus signs).
   A few Greek letters and math symbols also appear in-file (e.g. ψ, ⟩ in
   #sel-eq) but this pixel font's hosted Latin face never had glyphs for
   them in the CDN version either — they already silently fall back to a
   system font today; self-hosting doesn't change that, so they're not
   included here (pulling in the font's separate Greek subface for two
   characters wasn't worth the added complexity/size for a display already
   falling back on the bracket character regardless).

   Space Grotesk: Google serves this family as a single variable font (wght
   axis 300-700) — the SAME physical file backs the 400/500/600/700
   @font-face rules in the original CDN CSS. So only one file is embedded
   here, subsetted to the Latin unicode range (matching Google's own
   "latin" subset for this family), with one @font-face spanning the full
   weight range instead of four separate weight-specific files.

   TY-2 (2026-07-26) — Rajdhani SemiBold, the HUD-numerals face (P4):
   subsetted to digits + the timer/odds punctuation this UI draws
   (pyftsubset rajdhani-600-latin.woff2
     --unicodes="U+0020,U+0025,U+002B-003A,U+00B0,U+00BC-00BE,U+03C0"
     --flavor=woff2), 1.5KB raw / ~2.1KB base64. Rajdhani has NO glyphs for
   π or the vulgar fractions (¼½¾) — those code points subset to nothing and
   fall back to Space Grotesk (next in the --font-num stack), which is why
   the charge-bar tick labels render mixed-face by design. */

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  /* Oravec-inspired dark, living pixel-world palette — vibrant neon on deep night */
  --bg:        #070a16;
  --bg-2:      #0b1024;
  --bg-3:      #11183a;
  --panel:     rgba(18,24,52,0.60);
  --panel-2:   rgba(30,40,80,0.42);
  --glass-brd: rgba(124,140,230,0.22);
  --border:    rgba(124,140,230,0.22);
  --border-hi: rgba(124,140,230,0.46);
  --ink:       #eaf0ff;   /* primary high-contrast text */
  --ink-2:     #aeb8e6;   /* secondary text */
  --ink-3:     #9aa3cf;   /* muted text — lightened to meet WCAG AA 4.5:1 on dark bg (QB-8) */
  --gold:      #f5b73c;
  --teal:      #2fe0d0;   /* WHITE controller neon (cyan) */
  --indigo:    #8b7dff;
  --green:     #3fe08a;
  --red:       #ff5a72;
  --amber:     #ffa83c;
  --rose:      #ff4d9d;   /* BLACK controller neon (magenta) */
  --warm:      #eaf0ff;   /* legacy alias → light ink */
  --parchment: #aeb8e6;
  --dim:       #9aa3cf;   /* QB-8 — AA-contrast muted text on dark bg */
  --wood:      #9aa3cf;   /* QB-8 — AA-contrast muted text on dark bg */
  --pixel:     'Press Start 2P', monospace;
  --body:      'Space Grotesk', system-ui, -apple-system, sans-serif;
  /* TY-1 — the type system. Four sizes only; every font-size in this file
     must resolve to one of these (supersedes FE-6's per-rule literals, per
     David 2026-07-26). Pixel face is display-only: ≥ --fs-2, never body. */
  --font-pixel: 'Press Start 2P', monospace;
  --font-body:  'Space Grotesk', system-ui, -apple-system, sans-serif;
  --font-num:   'Rajdhani', 'Space Grotesk', system-ui, sans-serif;
  --fs-0:      13px;   /* dense: values, log lines, captions */
  --fs-1:      15px;   /* default prose / interactive */
  --fs-2:      18px;   /* section titles — pixel face floor */
  --fs-3:      28px;   /* display banners */
  --lh-prose:  1.4;
  --ls-pixel:  0.5px;
  /* FE-6 — sage-bar grew from 82px to fit ≥13px readable text (was 11px
     Press Start 2P) without shrinking it back down on phones; every layout
     value derived from the old fixed 82px height now reads from this var
     instead of repeating the number. */
  --sage-bar-h: 108px;
  --ease:      cubic-bezier(.22,.61,.36,1);
}

/* TY-1 — dark scrim so HUD text stays ≥4.5:1 over bright art (P4 rule) */


/* QB-8 — calm board for users who ask for reduced motion: drop CSS animations
   and transitions (particles, shake and flashes are gated in JS via
   REDUCE_MOTION). */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

html, body {
  background:
    radial-gradient(1200px 800px at 15% -10%, #16203f 0%, transparent 55%),
    radial-gradient(1100px 900px at 110% 8%, #1c1448 0%, transparent 55%),
    linear-gradient(160deg, #070a16 0%, #0b1024 55%, #070a16 100%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--body);
  width: 100%;
  overflow-x: hidden;
}
/* FE-10 — this used to carry `min-height: 100vh`. On any viewport taller
   than the page's own content (title bar + board/panels row + log — around
   1130-1160px tall regardless of viewport height, since the board's own
   height-based growth caps out well before most tall viewports do), that
   rule forced the page to be at least viewport-tall anyway — a "phantom
   spacer" with nothing in it, painted below the log for however much
   viewport was left over (measured: 1172px of pure background at a
   1440x2304 viewport). Dropping it lets the page be exactly its content's
   height. The gradient background doesn't need it either: `html`'s
   background paints the canvas (the area behind the whole viewport, not
   just html's own box) per the CSS painting-order spec regardless of box
   height, and background-attachment:fixed anchors it to the viewport, not
   to html's box — confirmed visually, no seam or color mismatch below a
   shorter page at any tested viewport. */
::selection { background: var(--indigo); color:#fff; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--border-hi); border-radius: 6px; }
::-webkit-scrollbar-track { background: transparent; }

/* ── Boot Screen ───────────────────────────────────── */
#boot {

  background:
    radial-gradient(900px 600px at 30% 20%, #16203f 0%, transparent 60%),

    linear-gradient(160deg, #070a16, #0b1024);

}

#boot-logo {

  background: linear-gradient(135deg, var(--indigo), var(--teal) 60%, var(--gold));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 6px 18px rgba(91,84,230,0.28));
  letter-spacing: 10px;
  min-height: 48px;

}
#boot-sub {
  font-family: var(--body); font-weight: 500;

}
#boot-lines {

@keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
@keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }

/* ── FE-9 — phones-unsupported interstitial ──────────
   USER RULING 2026-07-07: phones are out of scope, so rather than ship a
   game built for an 800px logical board onto a ~390px screen, show this
   instead — same boot-screen art direction (gradient bg, pixel-font logo),
   gated purely by CSS (`display:none` unless the media query below is
   active) so it needs no JS to appear. The `.dismissed` class (set by
   "try anyway", see the script's FE-9 block) always wins over the media
   query regardless of viewport width, because `#id.class` (0,2,0) beats a
   bare `#id` rule (0,1,0) on specificity no matter which one is declared
   later — so dismissal can never be fought by a resize. ~600px matches
   tests/capture_responsive.js's phone/supported split. */
#phone-gate {
  display: none;
  position: fixed; inset: 0; z-index: 9500;
  background:
    radial-gradient(900px 600px at 30% 20%, #16203f 0%, transparent 60%),
    radial-gradient(700px 500px at 80% 90%, #1c1448 0%, transparent 60%),
    linear-gradient(160deg, #070a16, #0b1024);
  flex-direction: column; align-items: center; justify-content: center;
  gap: 20px; padding: 32px; text-align: center;
}
@media (max-width: 599px) {
  #phone-gate { display: flex; }
}
#phone-gate.dismissed { display: none; }
#phone-gate-logo {
  font-family: var(--font-pixel); font-size: var(--fs-3);
  background: linear-gradient(135deg, var(--indigo), var(--teal) 60%, var(--gold));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  letter-spacing: 5px;
}
#phone-gate-msg {
  font-family: var(--body); font-weight: 500; font-size: var(--fs-1);
  color: var(--ink-2); line-height: 1.6; max-width: 300px;
}
#phone-gate-anyway {
  font-family: var(--font-body); font-weight: 600; font-size: var(--fs-1);
  color: var(--indigo); letter-spacing: 1px;
  text-decoration: none; border-bottom: 1px solid rgba(139,125,255,0.45);
  padding-bottom: 2px; cursor: pointer;
}
#phone-gate-anyway:hover { color: var(--teal); border-color: var(--teal); }

/* ── Background canvas ─────────────────────────────── */
#bg-canvas {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none;
  opacity: 0.95;
  image-rendering: pixelated; image-rendering: crisp-edges;
}

/* ── Root container ────────────────────────────────── */
#root {
  position: relative; z-index: 1;
  width: 100%;
  display: flex; flex-direction: column;
  align-items: center;
}

/* ── Title bar ─────────────────────────────────────── */
#title-bar {
  width: 100%; max-width: 1350px;
  margin-top: 4px; /* UX-5 — trim vertical chrome so more fits in a fixed-height iframe */
  padding: 7px 18px;
  display: flex; align-items: center; justify-content: space-between;
  border-radius: 4px;
  border: 2px solid rgba(90,80,204,0.55);
  background: rgba(4,6,20,0.97);
  box-shadow: 0 4px 20px rgba(0,0,0,0.55), inset 0 1px 0 rgba(139,125,255,0.08);
}
#title-bar h1 {
  font-family: var(--font-pixel); font-size: var(--fs-2);
  background: linear-gradient(120deg, var(--indigo), var(--teal));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 6px rgba(91,84,230,0.25));
  letter-spacing: 4px;
}
#title-bar .sub { font-size: var(--fs-0); font-family: var(--body); font-weight: 600; color: var(--ink-2); letter-spacing: 1px; }

/* ── Layout ────────────────────────────────────────── */
#ui {
  width: 100%; max-width: 1350px;
  display: flex; gap: 12px; padding: 10px 10px 0;
  align-items: flex-start;
}

/* Canvas wrapper — relative container for sage-bar overlay */
#canvas-wrap {
  position: relative;
  flex-shrink: 0;
  line-height: 0;
  border: 2px solid rgba(90,80,204,0.45);
  border-radius: 4px;
  box-shadow: 0 0 32px rgba(90,80,204,0.14), 0 8px 32px rgba(0,0,0,0.60);
  /* Push sage bar and timer elements into the padding zone below the canvas
     so they never overlap pieces. --sage-bar-h + 8px clears the sage bar +
     5px timer bar + a small buffer. */
  padding-bottom: calc(var(--sage-bar-h) + 8px);
}

canvas { display: block; cursor: pointer; }

/* QB-4 — responsive layout. Below a wide laptop the board + side panels stack
   instead of demanding ~1200px of width; the canvas stays square and fluid. */
@media (max-width: 1100px) {
  #ui { flex-direction: column; align-items: center; max-width: 820px; }
  #canvas-wrap { flex-shrink: 1; min-width: 0; width: 100%; max-width: 800px; }
  .panel { max-width: 800px; width: 100%; order: 2; }
  #canvas-wrap { order: 1; }
}
/* UX-3 — sage-bar footer row (hotkey legend + EXPLAIN + TEACH + MORE) could
   overlap into garbled text (e.g. "EXPLAIN JEACH"). A viewport max-width media
   query is the wrong tool here: #game-canvas is sized by
   `width: min(800px, calc(100vh - 250px))` (see #game-canvas above), so the
   sage-bar's actual width is driven by viewport HEIGHT, not width — on any
   normal-height laptop screen the canvas (and this footer) is already well
   under 900px wide even at a 1440px-wide viewport, so a width-gated rule never
   fires when it needs to. Made unconditional instead: flex-wrap only engages
   when content doesn't fit, so this is a no-op at any width wide enough for a
   single line, and safely wraps otherwise, regardless of what's constraining
   the width. */

@media (max-width: 560px) {
  #ui { padding: 6px 6px 0; gap: 8px; }
  /* --sage-bar-h + 2px clears the sage bar (a bit tighter than desktop's
     +8px — 72px let the bar cover the board's bottom row on phones before). */
  #canvas-wrap { padding-bottom: calc(var(--sage-bar-h) + 2px); }
  .panel { min-width: 0; padding: 8px; }
  /* FE-6 — this used to shrink the sage bar's type down to 9px to squeeze
     the name, two message lines and a footer row into the old fixed 82px
     box; that's exactly the sub-10px violation FE-6 exists to remove. The
     box got taller (--sage-bar-h, 82px -> 108px) instead, so phone width
     only needs the portrait to shrink for room, not the text. */
  
  /* The floating crowd-vote badge is viewport-fixed; on a scrolling phone
     layout it hovers over whatever panel is at the bottom of the screen.
     Crowd Vote is a projector/classroom feature — keep it reachable via the
     Settings menu, drop the badge. */
  
}

#game-canvas {
  border-radius: 2px;
  border: none;
  /* FE-8 — removed 2026-07-08. A full-canvas CSS filter re-processes every
     pixel every frame (a GPU pass with no logic behind it) and silently
     shifts every measured sprite/text color away from its literal fillStyle
     value — every contrast ratio computed against the raw hex values in
     this file (FE-7, tests/contrast_check.js) was actually being rendered
     ~10% higher-contrast/~12% more saturated than that math assumed. Colors
     are already tuned to their intended values directly; no filter needed
     to "fix" them further. */
  display: block;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  /* QB-4 — display-scale to the viewport without touching the internal 800px
     resolution (kept crisp). The click handler scales via getBoundingClientRect,
     so input math still lands on the right cells at any size.
     Cap by viewport HEIGHT too (not just width) so the whole board + sage bar +
     title + log fit on one screen: ~210px reserves the title bar, sage-bar
     padding and the event log.
     FE-10 — the flat cap here used to be 800px, well below what the
     height-based term would otherwise allow on any viewport taller than
     ~1050px (a common case: a half-screen-snapped browser window on a large
     display, a vertical secondary monitor, or simply a tall aspect ratio) —
     the board stopped growing well short of the available room, which is
     the actual mechanism behind the measured "60% void" at 1440px. Raised
     to 900px — NOT to some larger "no practical cap" number: #canvas-wrap
     is flex-shrink:0 (never yields), so on the 3-column row (two .panel's,
     min-width:188px each, inside #ui's own max-width:1350px) any canvas
     width past `1350 - 2*188 - 2*12(gap) = 950px` forces the panels below
     their own min-width floor and off the visible row instead of the
     canvas politely stopping — measured this the hard way (first tried
     1050px, which clipped the right panel in a live screenshot). 900px
     leaves both panels ~213px of comfortable room, not pinned to their
     bare minimum. This is purely the CSS *display* size — the canvas's
     internal BOARD=800 logical coordinate space (FE-2) is untouched, so no
     game-logic, DPR, click-mapping, or menuDims()/canvasFontPx() math needs
     to change: all of it already derives from the rendered CSS size, not a
     hardcoded 800. */
  width: min(900px, calc(100vh - 250px));
  height: auto;
  max-width: 100%;
  aspect-ratio: 1 / 1;
}

/* Animated DOM overlay used to smoothly move a sprite on top of the canvas */


@keyframes walk {
  0% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
  100% { transform: translateY(0); }
}



/* ── Glass Panels — defined below with game-HUD styling ─── */

/* FE-6 — stat values are read for game-state understanding, not headline
   flavor; moved from the pixel font to the readable body font (was 11px
   Press Start 2P, under both the old and new floor). */
.srow .val { font-family: var(--font-num); font-weight: 600; font-size:var(--fs-0); color: var(--green); }
/* UX-1 — X-basis row: label + two value fields (x= and GUARD%) that must
   never visually collide. Wraps to a second line at narrow widths instead
   of overlapping; each field keeps its own nowrap run so digits never split. */

.srow-xbasis .val {
  display: flex; flex-wrap: wrap; justify-content: flex-end;
  gap: 2px 10px; flex: 1 1 auto; min-width: 0;
}
.srow-xbasis .val span { white-space: nowrap; }

/* Coherence bar */

/* FE-6 — gate-use counts are values a student reads, not flavor; body font. */

.gcnt.hidden { display: none; }  /* SM-4 — counters default-collapsed */

.btn {
  display: block; width: 100%;
  background: rgba(14,18,48,0.85);
  border: 1px solid rgba(90,80,204,0.45);
  border-radius: 4px;
  color: var(--ink-2);
  font-family: var(--font-body); font-weight: 700; font-size:var(--fs-1);
  padding: 10px 6px; cursor: pointer;
  text-align: center; letter-spacing: 1px;

}
.btn:hover {
  color: #fff;
  background: rgba(90,80,204,0.30);
  border-color: var(--indigo);
  box-shadow: 0 0 12px rgba(139,125,255,0.35);
}
.btn:active { background: rgba(90,80,204,0.50); }

/* C02-T2 — two-mode product hub. Play choices get the visual weight;
   learning/export utilities remain available without reading as games. */
.mode-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; margin:14px 0; }
.mode-card {
  min-height:132px; padding:16px; border-radius:10px; cursor:pointer;
  border:1px solid rgba(139,125,255,.55); color:var(--ink-2); text-align:left;
  background:linear-gradient(145deg,rgba(19,27,62,.98),rgba(10,15,36,.98));
  box-shadow:0 8px 24px rgba(0,0,0,.32); transition:transform .15s,border-color .15s,box-shadow .15s;
}
.mode-card:hover { transform:translateY(-2px); border-color:var(--teal); box-shadow:0 12px 30px rgba(47,224,208,.14); }
.mode-card.training:hover { border-color:var(--gold); box-shadow:0 12px 30px rgba(245,183,60,.13); }
.mode-card .mode-kicker { display:block; color:var(--dim); font:700 var(--fs-0) var(--font-body); letter-spacing:1.5px; }
.mode-card strong { display:block; margin:8px 0 7px; color:var(--teal); font:700 var(--fs-2) var(--font-display); letter-spacing:1px; }
.mode-card.training strong { color:var(--gold); }
.mode-card .mode-copy { display:block; color:var(--ink-2); font:500 var(--fs-0) var(--font-body); line-height:1.5; }
.mode-card .mode-status { display:block; margin-top:10px; color:var(--green); font:700 var(--fs-0) var(--font-body); }
.support-actions { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:7px; margin:10px 0 14px; }
.support-actions .btn { padding:8px 5px; font-size:var(--fs-0); letter-spacing:.4px; }
.training-progress { height:8px; overflow:hidden; background:rgba(255,255,255,.08); border-radius:99px; margin:8px 0 16px; }
.training-progress > span { display:block; height:100%; background:linear-gradient(90deg,var(--indigo),var(--gold)); }
.mission-card.is-next { border-color:var(--gold); box-shadow:0 0 18px rgba(245,183,60,.12); }
.mission-next { color:var(--gold); font:700 var(--fs-0) var(--font-body); letter-spacing:1px; }
@media (max-width:700px) {
  .mode-grid { grid-template-columns:1fr; }
  .mode-card { min-height:112px; }
  .support-actions { grid-template-columns:1fr; }
}
@media (prefers-reduced-motion: reduce) {
  .mode-card { transition:none; }
  .mode-card:hover { transform:none; }
}

/* FE-13 — progressive disclosure: this ~60-word explainer (Charge = strike
   chance, why |1⟩ is fragile, etc. — UX-7's own honest copy, good copy in
   the wrong place by default) used to always render, pushing the panel's
   actually-actionable state (HP/charge/coherence/Bloch) below a wall of
   prose every single selection. Hidden by default; #sel-hint-toggle reveals
   it. min-height stays on the toggle line (not the hidden prose) so the
   panel doesn't visibly jump when nothing is selected. */

#sel-hint.show { display: block; }
/* SM-5 — the GD-5 coherence-budget sentence rides the same disclosure as the
   hint prose: actionable numbers stay (HP/coherence/X-basis/Bloch), sentences
   are one tap away. */

#sel-budget.show { display: block; }

/* ── Retro Sage Dialogue Bar ──────────────────────── */
/* Portrait canvas inside the dialogue bar */

/* Retro inner line */

#sage-bar-more.show { display: block; }

/* UX-5 — Sage panel collapse toggle. Shrinks the message area (name + text)
   while keeping the footer controls (EXPLAIN / TEACH / MORE / this toggle)
   visible and reachable, so a fixed-height embed (e.g. an 860px iframe) can
   reclaim vertical space without losing access to the Sage controls. */

#sage-bar.collapsed {
  min-height: 34px; max-height: 34px;
}
#sage-bar.collapsed #sage-portrait { height: 34px; }
#sage-bar.collapsed #sage-bar-name,
#sage-bar.collapsed #sage-bar-text { display: none; }
#sage-bar.collapsed #sage-bar-body { padding: 6px 14px; justify-content: center; }
/* Canvas-wrap reserves --sage-bar-h + 8px of padding for the expanded sage
   bar + 5px timer bar (see #canvas-wrap comment); collapsed only needs ~34px. */
#canvas-wrap.sage-collapsed { padding-bottom: 42px; }
#canvas-wrap.sage-collapsed #sage-tips { bottom: 34px; }
#canvas-wrap.sage-collapsed #timer-bar { bottom: 37px; }
#canvas-wrap.sage-collapsed #timer-chip { bottom: 38px; }

/* Expanded tips panel — sits directly above the sage bar in the padding zone.
   max-height keeps it from ever reaching the canvas area. */

#sage-tips.show { display: flex; }
@keyframes tipPanelIn { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:none} }
.sage-tip-ic.quantum { color: var(--teal);   }
.sage-tip-ic.gate    { color: var(--indigo); }
.sage-tip-ic.info    { color: var(--ink-3);  }

/* PD-1 — duel chrome: the story panels, event log, sage bar and badges are
   hidden while MODE==='duel'. One class on <body>, no per-element JS. */
body.duel-mode .panel,
body.duel-mode #log,
body.duel-mode #log-toggle,
body.duel-mode #kb-hint,
body.duel-mode #notation-chip,
body.duel-mode #vote-mode-badge,
body.duel-mode #sage-bar,
body.duel-mode #sage-tips,
body.duel-mode #title-bar .sub { display: none !important; }
body.duel-mode #canvas-wrap { padding-bottom: 0 !important; }
body.duel-mode #ui { gap: 0; justify-content: center; }
/* The story rule reserves ~250px of viewport height for the title bar,
   sage bar and event log — none of which exist in duel mode, so the arena
   gets that room back. `width` (not max-width) because that is what the
   story rule sets. */
body.duel-mode #game-canvas { width: min(1100px, calc(100vh - 80px)); }

/* ── Log ───────────────────────────────────────────── */
#log {
  width: 100%; max-width: 1350px;
  margin-top: 4px; /* UX-5 — trim vertical chrome so more fits in a fixed-height iframe */
  background: rgba(4,6,20,0.95);
  border: 1px solid rgba(90,80,204,0.40);
  border-radius: 4px;
  padding: 5px 14px;
  font-size: var(--fs-0); color: var(--ink-2);
  height: 54px; overflow-y: auto;
  font-family: var(--body); font-weight: 500; line-height: 1.75;
}
#log.hidden { display: none; }  /* SM-6 — default-collapsed (P3.5) */

#log span { display: block; animation: logIn .35s var(--ease); }
@keyframes logIn { from{opacity:0; transform:translateX(-6px)} to{opacity:1; transform:none} }
#log .ev-gate     { color: var(--green);  }
#log .ev-decohere { color: var(--red);    }
#log .ev-measure  { color: var(--gold);   }
#log .ev-capture  { color: var(--rose);   }
#log .ev-info     { color: var(--ink-3);  }
#log .ev-quantum  { color: var(--teal); font-style: italic; }
#log .ev-check    { color: var(--amber);  }
#log .ev-system   { color: var(--ink-3); }

/* IN-3 — iframe focus affordance: hotkeys silently do nothing until the
   embedding iframe/document actually has keyboard focus. Shown proactively
   on load, hidden the moment a real keydown reaches us (proof focus is
   fine) or the user dismisses it. Mouse/touch play is completely unaffected
   either way, so this is purely informational. */

#kb-hint.show { display: block; }

/* PED-3 — notation-ramp chip: a one-line, dismissible explainer shown the
   FIRST time a given symbol (|0⟩, |ψ⟩, ρ, T1...) is encountered in-session.
   Same visual family as #kb-hint (small, dismissible, non-blocking) but teal
   to read as "concept" rather than "control hint," and bottom-anchored so it
   never covers the board or the panel it's explaining. */
#notation-chip {
  display: none;
  position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
  z-index: 61; max-width: 92%;
  background: rgba(47,224,208,0.12); border: 1px solid rgba(47,224,208,0.45);
  color: var(--teal); font-size: var(--fs-0); line-height: 1.5; padding: 8px 30px 8px 12px;
  border-radius: 6px; box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  pointer-events: auto;
}
#notation-chip.show { display: block; }
#notation-chip button {
  position: absolute; right: 4px; top: 8px;
  background: none; border: none; color: var(--teal); font-size: var(--fs-0);
  cursor: pointer; line-height: 1; padding: 4px 6px;
}

/* ── RPG Modal ─────────────────────────────────────── */
#modal-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(5,8,20,0.62); z-index: 100;
  align-items: center; justify-content: center;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
#modal-overlay.show { display: flex; animation: fadeIn .3s var(--ease); }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
#modal {
  background: linear-gradient(165deg, rgba(20,27,58,0.96), rgba(12,17,38,0.97));
  border: 1px solid var(--glass-brd);

<body>

<!-- Boot screen -->
<div id="boot">

</div>

<!-- FE-9 — phones-unsupported interstitial (see the CSS block's note above
     for why display is CSS-gated, not JS-gated). Sits above #boot (z-index
     9500 vs 9000) so it pre-empts the boot screen too on a phone-width load. -->
<div id="phone-gate">
  <div id="phone-gate-logo">◈ QUBLITZ</div>
  <p id="phone-gate-msg">QuBlitz is built for laptop/tablet screens — the
    quantum battlefield needs the room. Open this page on a bigger screen

<!-- Background particle canvas -->
