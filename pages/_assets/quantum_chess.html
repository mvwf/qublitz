<div id="root">
  <!-- Title bar -->
  <div id="title-bar">
    <h1>◈ QUBLITZ</h1>
    <span class="sub">PHOTON DUEL · CHARGE · STRIKE · COLLAPSE</span>
  </div>

  <div id="ui">
    <div id="canvas-wrap">
      <canvas id="game-canvas" width="800" height="800"
              role="application"
              aria-label="QuBlitz Photon Duel arena. WASD moves; arrow keys or pointer aim; Shift charges an attack; F charges a self-pulse; Space measures. Standard gamepads are supported."
              tabindex="0"></canvas>
      <!-- Screen-reader announcements (QB-8 / GOV-4): status is polite,
           events are assertive. Both survive the board's retirement because
           the duel narrates rounds, locks and collapses through them. -->
      <div id="a11y-status" aria-live="polite" role="status"
           style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap"></div>
      <div id="a11y-event" aria-live="assertive" role="alert"
           style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap"></div>
    </div>
  </div>

  <div id="notation-chip"></div>
</div>

<!-- Modal overlay -->
<div id="modal-overlay">
  <div id="modal">
    <div id="modal-content"></div>
    <button class="close-btn" onclick="closeModal()">[ CLOSE ]</button>
  </div>
</div>

<script>
'use strict';

const QB_VERSION = 'v1.1';   // physics-engine release: exact Lindblad T₁/T₂ decoherence

// FE-9 — phones-unsupported interstitial: "try anyway" dismisses it for
// this browser tab's session only (sessionStorage, not localStorage — never
// permanent, and a closed/reopened tab sees the gate again), and never
// bricks the page: worst case sessionStorage is unavailable (private mode)
// and the click handler just no-ops, leaving the CSS media query as the
// only thing gating visibility either way.
try {
  if (sessionStorage.getItem('qb_phone_gate_dismissed') === '1') {
    document.getElementById('phone-gate')?.classList.add('dismissed');
  }
} catch (e) {}
document.getElementById('phone-gate-anyway')?.addEventListener('click', e => {
  e.preventDefault();
  document.getElementById('phone-gate')?.classList.add('dismissed');
  try { sessionStorage.setItem('qb_phone_gate_dismissed', '1'); } catch (e) {}
});

// ═══════════════════════════════════════════════════════
// AUDIO ENGINE  (Web Audio API, lazy-init on first click)
// ═══════════════════════════════════════════════════════
let _ac = null;
function ac() {
  if (!_ac) {
    try { _ac = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(e) { return null; }
  }
  if (_ac.state === 'suspended') _ac.resume();
  return _ac;
}

function beep(freq, type='square', dur=0.09, vol=0.18) {
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.connect(g); g.connect(c.destination);
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
  o.start(); o.stop(c.currentTime + dur);
}

// Frequency sweep + noise burst, on the same WebAudio path as beep(). Shared
// Shared procedural effects; DUEL keeps richer private copies in its closure.
function _sweep(f0, f1, dur, type, vol) {
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.connect(g); g.connect(c.destination);
  o.type = type; o.frequency.setValueAtTime(f0, c.currentTime);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), c.currentTime + dur);
  g.gain.setValueAtTime(vol, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
  o.start(); o.stop(c.currentTime + dur);
}

// Shared "collapse" sting, built on the same WebAudio path as beep().
function sfxCollapse() {
  const c = ac(); if (!c) return;
  const buf = c.createBuffer(1, Math.max(1, (c.sampleRate * 0.3) | 0), c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) * 0.3;
  const s = c.createBufferSource(); s.buffer = buf; s.connect(c.destination); s.start();
  const o = c.createOscillator(), g = c.createGain();
  o.connect(g); g.connect(c.destination);
  o.type = 'sawtooth'; o.frequency.setValueAtTime(400, c.currentTime);
  o.frequency.exponentialRampToValueAtTime(60, c.currentTime + 0.5);
  g.gain.setValueAtTime(0.2, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.5);
  o.start(); o.stop(c.currentTime + 0.5);
}

function sfxDecohere() {
  const c = ac(); if (!c) return;
  const buf = c.createBuffer(1, c.sampleRate * 0.22, c.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1)*0.35;
  const s = c.createBufferSource(), g = c.createGain();
  s.buffer = buf; s.connect(g); g.connect(c.destination);
  g.gain.setValueAtTime(0.10, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.22);
  s.start(); s.stop(c.currentTime + 0.22);
}
function sfxBootBeep(f) { beep(f,'triangle',0.04,0.07); }

// ═══════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════
const π          = Math.PI;
const BOARD       = 800;   // canvas size px — bigger for visibility
let   GRID        = 8;
let   CELL        = BOARD / GRID;
// Walk-tween lerp factor at a 60Hz-equivalent tick (lower = slower walk,
// 0.14 ≈ 0.7s cross-board). Frame-rate independent: see _frameDt/_frameTicks
// in loop() (FE-1) — accumulators advance by real elapsed ms, not a frame count.
const MS_PER_TICK = 1000/60; // one 60Hz-equivalent "tick" in real ms

// Selectable board / army presets (chosen in the menu).

// Expose cell size as a CSS variable so overlay DOM sprites match canvas pixels.
function syncCellCSS() {
  document.documentElement.style.setProperty('--cell', `${CELL}px`);
}
syncCellCSS();



// ═══════════════════════════════════════════════════════
// EMBEDDED ART — grassland scene, used only as the boot-screen backdrop below.
// Terrain cells: row*GRID+col → 'tree' (blocking) | 'well' (bonus charge)

function stateToBloch(s) {
  const nA = C.norm(s.alpha);
  const theta = 2*Math.acos(Math.min(1,nA));
  let phi = 0;
  if (C.norm(s.beta)>1e-6) phi = Math.atan2(s.beta.i,s.beta.r)-Math.atan2(s.alpha.i,s.alpha.r);
  return {theta,phi};
}

// ═══════════════════════════════════════════════════════
// QUBIT BATTLE — Bloch vector + "charge" (excited-state amplitude)
// ═══════════════════════════════════════════════════════
// "Charge" = P(|1⟩) = how likely/strong a unit's strike is (Born rule).
function charge(unit) { return C.norm2(unit.state.beta); }
// Faction palette (used everywhere a unit's side needs a color).

// ═══════════════════════════════════════════════════════
// QUANTUM GATES
// ═══════════════════════════════════════════════════════
// COMPLEX NUMBER HELPERS
// ═══════════════════════════════════════════════════════
const C = {
  add:      (a,b) => ({ r:a.r+b.r, i:a.i+b.i }),
  sub:      (a,b) => ({ r:a.r-b.r, i:a.i-b.i }),
  mul:      (a,b) => ({ r:a.r*b.r-a.i*b.i, i:a.r*b.i+a.i*b.r }),
  scale:    (a,s) => ({ r:a.r*s, i:a.i*s }),
  norm2:    (a)   => a.r*a.r+a.i*a.i,
  norm:     (a)   => Math.sqrt(a.r*a.r+a.i*a.i),
  fromPolar:(r,φ) => ({ r:r*Math.cos(φ), i:r*Math.sin(φ) }),
};

// ═══════════════════════════════════════════════════════
const GATES = {
  X: s => ({alpha:s.beta, beta:s.alpha}),
  H: s => ({
    alpha:C.scale(C.add(s.alpha,s.beta),1/Math.SQRT2),
    beta: C.scale(C.sub(s.alpha,s.beta),1/Math.SQRT2),
  }),
  Y: s => ({alpha:C.mul({r:0,i:-1},s.beta), beta:C.mul({r:0,i:1},s.alpha)}),
  Z: s => ({alpha:s.alpha, beta:C.scale(s.beta,-1)}),
  S: s => ({alpha:s.alpha, beta:C.mul(s.beta,{r:0,i:1})}),
  T: s => ({alpha:s.alpha, beta:C.mul(s.beta,C.fromPolar(1,π/4))}),
  Rx: s => {
    const [c,si]=[Math.cos(π/8),Math.sin(π/8)];
    return {
      alpha:C.add(C.scale(s.alpha,c),C.mul({r:0,i:-si},s.beta)),
      beta: C.add(C.mul({r:0,i:-si},s.alpha),C.scale(s.beta,c)),
    };
  },
  Ry: s => {
    const [c,si]=[Math.cos(π/8),Math.sin(π/8)];
    return {
      alpha:C.add(C.scale(s.alpha,c),C.scale(s.beta,-si)),
      beta: C.add(C.scale(s.alpha,si),C.scale(s.beta,c)),
    };
  },
};

// FE-12 — added `effect`: a plain-English, verb-first phrase ("what does
// this DO for me right now") separate from `short` (the notation-heavy
// gate description, e.g. "|0⟩↔|1⟩ bit-flip NOT") — the gate menu now shows
// `effect` as the primary line and demotes `short`+the hotkey/name to the
// secondary line, per the task's own examples ("Flip to full charge — [X]
// Pauli-X", "Half-charge gamble — [H] Hadamard"). `label`/`short`/`ctrl`
// are unchanged and still feed the side detail card + (for X and H, the
// only two gates the TOME's own charging table gives a dedicated row to,
// not a grouped one) the in-game TOME, so those two don't drift from this
// object independently — see openTutorial()'s charging table.
const GATE_INFO = {
  H: {label:'Hadamard',short:'|0⟩↔|+⟩ superposition',effect:'Half-charge gamble',ctrl:'π rotation around (X+Z)/√2. Creates maximum superposition — equal |0⟩/|1⟩ amplitude. Drives qubit to Bloch equator.'},
  X: {label:'Pauli-X',short:'|0⟩↔|1⟩ bit-flip NOT',effect:'Flip to full charge',ctrl:'π rotation around X-axis. Full population inversion. The quantum NOT gate — foundational to error correction. In-game this is "full charge," but |1⟩ is the excited state — in a real lab it\'s fragile, which is exactly why it decays.'},
  Y: {label:'Pauli-Y',short:'bit-flip + phase flip',effect:'Flip bit and phase',ctrl:'π rotation around Y-axis. Applies both bit-flip and phase-flip: α↦−iβ, β↦iα.'},
  Z: {label:'Pauli-Z',short:'phase flip |+⟩↔|−⟩',effect:'Flip GUARD odds',ctrl:'π rotation around Z-axis. Flips the sign of the |1⟩ amplitude (φ→φ+π), which swaps |+⟩↔|−⟩. Phase is invisible to charge and a Z-basis strike, but flips a safe X-basis GUARD into an exposed one.'},
  S: {label:'S Phase',short:'+π/2 relative phase',effect:'90° phase shift',ctrl:'90° Z-axis rotation. Multiplies |1⟩ by i (φ→φ+π/2). Chain two S gates to get Z. Sets up the relative phase that decides a GUARD\'s X-basis crit odds.'},
  T: {label:'T Gate',short:'+π/4 relative phase',effect:'45° phase shift',ctrl:'45° Z-axis rotation (φ→φ+π/4). Non-Clifford — essential for universal computation. Like S/Z, it only changes outcomes through X-basis interference (GUARD).'},
  Rx:{label:'Rx(π/4)',short:'π/4 X-axis tilt',effect:'Tilt charge & phase',ctrl:'π/4 X-axis rotation, modelling Larmor spin precession. Tilts the qubit toward the equator, adjusting both charge and the X-basis phase.'},
  Ry:{label:'Ry(π/4)',short:'π/4 Y-axis tilt',effect:'Small charge boost',ctrl:'π/4 Y-axis rotation, modelling Rabi oscillation — the cleanest coherent qubit drive. Nudges charge without adding a complex phase.'},
  CNOT:   {label:'CNOT',short:'entangle two qubits',effect:'Entangle a neighbor',ctrl:'Conditional X: flips the target if the control is |1⟩, does nothing if it is |0⟩. With the control in superposition it makes an entangled pair: |+⟩|0⟩ → |Φ+⟩. Pulsing one half cannot change the other half\'s odds (no faster-than-light signalling), but it can change whether the two outcomes match.'},
  MEASURE:{label:'Measure',short:'collapse to eigenstate',effect:'Discharge & reset',ctrl:'Projective Z-basis measurement. Collapses |ψ⟩ to |0⟩ or |1⟩ and stabilizes the unit (coherence +12). "Discharging" to |0⟩ is a game-mechanic reward, not a physical one — |0⟩ is simply the low-energy ground state a real qubit relaxes to anyway; |1⟩ is high-energy and short-lived by nature.'},
};

// PED-2 — Gate Log legend: each of the 10 counters gets a hover/tap tooltip
// built from GATE_INFO's own `label`/`effect`/`short` fields (single source —
// no separate copy of these strings exists anywhere else; the TOME and gate
// menu already read the same object). Applied once at load, since these are
// static gate descriptions, not per-game state. PED-4 — the same rows are
// also the Gate Log's tap-to-glossary entry point (see openGlossaryIndex()).
function applyGateLogTooltips() {
  Object.keys(GATE_INFO).forEach(gate => {
    const span = document.getElementById(`cnt-${gate}`);
    const row = span && span.parentElement;
    if (!row) return;
    const info = GATE_INFO[gate];
    row.title = `${info.label} — ${info.effect}: ${info.short}`;
    row.style.cursor = 'pointer';
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');
    row.onclick = () => showGlossary(gate);
    row.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showGlossary(gate); } };
  });
}

// PED-4 — in-game glossary. Reuses GATE_INFO (the same single source as the
// gate menu, the Gate Log tooltips above, and — for X/H — the TOME) rather
// than a second copy of the physics prose. Cross-references GATE_MISSION so
// a player can jump straight to the one training mission that's built around
// a given gate (DuelCore's mission gates hard-gate those on the concept,
// per GD-3 — this is the honest subset, not every gate has a dedicated one).
const GATE_MISSION = {
  X: 0,        // MISSION 1 — THE BORN RULE (charge = hit chance)
  H: 3,        // MISSION 4 — SUPERPOSITION GAMBIT (phase-shield needs H first)
  Z: 4,        // MISSION 5 — PHASE GAMBIT (relative phase, |+⟩ vs |−⟩)
  CNOT: 2,     // MISSION 3 — BELL PAIR TRAP (entanglement)
  MEASURE: 2,  // MISSION 3 — BELL PAIR TRAP (collapse)
};

function openGlossaryIndex() {
  document.getElementById('modal-content').innerHTML = `
<h2>◈ GLOSSARY ◈</h2>
<p style="text-align:center;color:var(--dim);font-size:var(--fs-0);margin-bottom:14px">Every gate in one place — tap any row for the full physics.</p>
${Object.keys(GATE_INFO).map(gate => {
  const info = GATE_INFO[gate];
  return `<div class="mission-card" style="cursor:pointer" onclick="showGlossary('${gate}')">
    <h4>${info.label} <span style="color:var(--dim);font-weight:normal;font-size:var(--fs-0)">— ${info.effect}</span></h4>
    <p style="margin:0">${info.short}</p>
  </div>`;
}).join('')}
<button class="btn" onclick="openMenu()">◂ BACK</button>`;
  document.getElementById('modal-overlay').classList.add('show');
}

function showGlossary(gate) {
  const info = GATE_INFO[gate];
  if (!info) return;
  const missionIdx = GATE_MISSION[gate];
  const missionHtml = (missionIdx !== undefined)
    ? `<button class="btn" onclick="closeModal();startDuel(undefined,${missionIdx})">▶ Fly ${DuelCore.DUEL_MISSIONS[missionIdx].title}</button>`
    : `<p style="color:var(--dim);font-size:var(--fs-0)">Used throughout the game — no single dedicated training mission yet.</p>`;
  document.getElementById('modal-content').innerHTML = `
<h2>◈ ${info.label} ◈</h2>
<p style="color:var(--teal);font-size:var(--fs-1);margin:-8px 0 12px">${info.effect} — ${info.short}</p>
<p style="line-height:1.6">${info.ctrl}</p>
<h3>TAUGHT IN</h3>
${missionHtml}
<button class="btn" onclick="openGlossaryIndex()">◂ ALL GATES</button>`;
  document.getElementById('modal-overlay').classList.add('show');
}

// ═══════════════════════════════════════════════════════
// QPhysics — open-quantum-system engine (Lindblad T1 / T2)
// ═══════════════════════════════════════════════════════
// A standalone, unit-tested physics core, separable from the game UI (per the
// QuBlitz critique: replace the ad-hoc decoherence with a physically-motivated,
// verifiable model — recs #1, #2, #6). It models a single qubit as a 2×2 density
// matrix ρ and evolves it under the EXACT analytical solution of the Lindblad
// master equation for amplitude damping (T1 relaxation toward the ground state
// |0⟩) plus pure dephasing (T2). No HTML dependencies — callable + testable on
// its own (window.QPhysics / runDecoherenceDiagnostic()).
//
// Bloch convention (matches blochToState/stateToBloch and the Bloch renderer):
//   r=(x,y,z), z=+1 ↔ |0⟩ (north), z=−1 ↔ |1⟩ (south).
//   ρ = ½[[1+z, x−iy],[x+iy, 1−z]]  ⇒  ρ00=(1+z)/2, ρ11=(1−z)/2.
//   x = 2·Re(ρ01),  y = −2·Im(ρ01),  z = ρ00−ρ11,  with ρ01 = α·conj(β).
//   charge ≡ P(|1⟩) = ρ11 = (1−z)/2.
//
// Exact Lindblad solution over one step dt (relaxation toward |0⟩):
//   x(t)=x₀·e^(−dt/T2),  y(t)=y₀·e^(−dt/T2),  z(t)=1+(z₀−1)·e^(−dt/T1).
// The physical constraint T2 ≤ 2·T1 is enforced.
const QPhysics = (() => {
  const cConj = a => ({ r:a.r, i:-a.i });

  // pure spinor {alpha,beta} → Bloch vector {x,y,z}
  function blochFromPure(s) {
    const r01 = C.mul(s.alpha, cConj(s.beta));     // ρ01 = α·β*
    return { x: 2*r01.r, y: -2*r01.i, z: C.norm2(s.alpha) - C.norm2(s.beta) };
  }

  // Bloch vector → a pure spinor on the same z & azimuth. Charge (=(1−z)/2) and
  // direction are preserved exactly; this feeds the game's pure-state code paths.
  function pureFromBloch(r) {
    const theta = Math.acos(Math.max(-1, Math.min(1, r.z)));   // cosθ = z
    const phi = Math.atan2(r.y, r.x);
    return { alpha:{r:Math.cos(theta/2), i:0}, beta:C.fromPolar(Math.sin(theta/2), phi) };
  }

  const charge      = r => Math.max(0, Math.min(1, (1 - r.z) / 2));   // P(|1⟩)=ρ11
  // QB-5 — defensive interference. A GUARDing unit is measured in the X-basis,
  // so its chance of being caught excited (a CRITICAL) is P(|−⟩) = (1 − x)/2,
  // where x is the Bloch x-component set by the relative phase φ (Z/S/T) and θ.
  // This makes phase mechanically real: |+⟩ (x=+1) is crit-immune, |−⟩ (x=−1)
  // is fully exposed, |0⟩/|1⟩ (x=0) are a coin flip.
  const guardCritProb = pureOrBloch => {
    const r = ('z' in pureOrBloch) ? pureOrBloch : blochFromPure(pureOrBloch);
    return Math.max(0, Math.min(1, (1 - r.x) / 2));
  };

  // BR-3 — Pulse Forge. A resonant Rabi drive rotates the qubit around the
  // X-axis by θ = Ω_R · t (amplitude × duration, in units where θ=π is a
  // perfect flip — this is the SAME t_π = 1/(2·Ω_R/2π) relation the Qubit
  // Simulator page's own Ramsey tab already shows). rabiPopulation is the
  // textbook closed-form result for the population actually transferred to
  // |1⟩ by that rotation, independent of any starting state — it's what a
  // pulse calibrated to exactly θ=π gives 100% charge, and any other θ gives
  // a partial, testable, physically real "why did my X only charge to 87%"
  // answer instead of a made-up minigame number.
  const rabiPopulation = theta => Math.sin(theta / 2) ** 2;
  // Rotates a PURE state by θ around the Bloch X-axis — the same rotation
  // GATES.Rx/Ry already perform at their own fixed angles (π/4), generalized
  // to an arbitrary θ so Pulse Forge's slider-chosen amplitude×duration maps
  // to a real state transformation, not just the scalar population above.
  const rabiRotateState = (state, theta) => {
    const c = Math.cos(theta / 2), si = Math.sin(theta / 2);
    return {
      alpha: C.add(C.scale(state.alpha, c), C.mul({ r: 0, i: -si }, state.beta)),
      beta:  C.add(C.mul({ r: 0, i: -si }, state.alpha), C.scale(state.beta, c)),
    };
  };
  const radius      = r => Math.sqrt(r.x*r.x + r.y*r.y + r.z*r.z);    // |r|: 1 pure, 0 mixed
  const purity      = r => (1 + Math.min(1, radius(r)**2)) / 2;       // Tr(ρ²) ∈ [½,1]
  const coherenceL1 = r => Math.sqrt(r.x*r.x + r.y*r.y);              // 2|ρ01| transverse coherence

  // One exact Lindblad step toward the ground state |0⟩.
  function lindbladStep(r, { T1, T2, dt = 1 }) {
    T1 = Math.max(1e-6, T1);
    T2 = Math.max(1e-6, Math.min(T2, 2 * T1));     // enforce T2 ≤ 2·T1
    const eT2 = Math.exp(-dt / T2), eT1 = Math.exp(-dt / T1);
    return { x: r.x * eT2, y: r.y * eT2, z: 1 + (r.z - 1) * eT1 };
  }

  // ── density-matrix layer (unitary gates + self-tests) ──
  const rhoFromBloch = r =>
    [[{r:(1+r.z)/2,i:0}, {r:r.x/2,i:-r.y/2}],
     [{r:r.x/2,i:r.y/2}, {r:(1-r.z)/2,i:0}]];
  const blochFromRho = rho =>
    ({ x: 2*rho[0][1].r, y: -2*rho[0][1].i, z: rho[0][0].r - rho[1][1].r });
  // ── 2-qubit Bell pair (QB-6) ──────────────────────────────────────────────
  // A shared 4-amplitude state [c00,c01,c10,c11] for an entangled pair. This is
  // the physically-correct model: measuring one half collapses both with
  // correlated outcomes, and a LOCAL single-qubit gate on one half leaves the
  // partner's marginal statistics unchanged (no-communication theorem). The old
  // game code applied a gate to the partner directly — the #1 entanglement
  // misconception — which this replaces.
  const Bell = (() => {
    const inv2 = 1 / Math.SQRT2;
    // |Φ+⟩ = (|00⟩ + |11⟩)/√2 — the pair CNOT produces from |+⟩⊗|0⟩.
    const phiPlus = () => [ {r:inv2,i:0}, {r:0,i:0}, {r:0,i:0}, {r:inv2,i:0} ];

    // P(qubit `which` = |1⟩), marginalising over the partner.
    const marginalP1 = (a, which) =>
      which === 0 ? C.norm2(a[2]) + C.norm2(a[3])   // |10⟩,|11⟩
                  : C.norm2(a[1]) + C.norm2(a[3]);   // |01⟩,|11⟩

    // Apply a 2×2 unitary to one qubit (tensor with identity on the other).
    function applyLocal(a, which, U) {
      const [[u00,u01],[u10,u11]] = U;
      const out = a.slice();
      if (which === 0) {
        out[0] = C.add(C.mul(u00,a[0]), C.mul(u01,a[2]));
        out[2] = C.add(C.mul(u10,a[0]), C.mul(u11,a[2]));
        out[1] = C.add(C.mul(u00,a[1]), C.mul(u01,a[3]));
        out[3] = C.add(C.mul(u10,a[1]), C.mul(u11,a[3]));
      } else {
        out[0] = C.add(C.mul(u00,a[0]), C.mul(u01,a[1]));
        out[1] = C.add(C.mul(u10,a[0]), C.mul(u11,a[1]));
        out[2] = C.add(C.mul(u00,a[2]), C.mul(u01,a[3]));
        out[3] = C.add(C.mul(u10,a[2]), C.mul(u11,a[3]));
      }
      return out;
    }

    // Measure qubit `which`; return {outcome, partnerOutcome, amps} where amps is
    // the renormalised post-measurement state. `rand` is injectable for tests.
    function measure(a, which, rand = Math.random) {
      const p1 = marginalP1(a, which);
      const outcome = rand() < p1 ? 1 : 0;
      const keep = i => {
        const bit = which === 0 ? (i >> 1) & 1 : i & 1;   // i: 0..3 → bits b0 b1
        return bit === outcome;
      };
      let norm = 0;
      const out = a.map((amp, i) => keep(i) ? amp : {r:0,i:0});
      out.forEach(amp => { norm += C.norm2(amp); });
      const s = norm > 1e-12 ? 1/Math.sqrt(norm) : 0;
      const amps = out.map(amp => C.scale(amp, s));
      // Partner outcome is whatever the collapsed state now assigns it.
      const partnerOutcome = marginalP1(amps, which === 0 ? 1 : 0) > 0.5 ? 1 : 0;
      return { outcome, partnerOutcome, amps };
    }

    return { phiPlus, marginalP1, applyLocal, measure };
  })();

  // 2×2 unitary of a named game gate, derived from GATES (single source of truth):
  // U = [ GATE(|0⟩) | GATE(|1⟩) ] as columns.
  function gateMatrix(name) {
    const g = GATES[name]; if (!g) return null;
    const c0 = g({alpha:{r:1,i:0}, beta:{r:0,i:0}});
    const c1 = g({alpha:{r:0,i:0}, beta:{r:1,i:0}});
    return [[c0.alpha, c1.alpha], [c0.beta, c1.beta]];
  }
  const matMul = (A,B) => {
    const o = [[null,null],[null,null]];
    for (let i=0;i<2;i++) for (let j=0;j<2;j++)
      o[i][j] = C.add(C.mul(A[i][0],B[0][j]), C.mul(A[i][1],B[1][j]));
    return o;
  };
  const dagger = U => [[cConj(U[0][0]), cConj(U[1][0])],
                       [cConj(U[0][1]), cConj(U[1][1])]];
  // Apply a unitary gate to a Bloch vector via ρ → UρU† (valid for mixed states).
  function gateBloch(r, name) {
    const U = gateMatrix(name); if (!U) return r;
    return blochFromRho(matMul(matMul(U, rhoFromBloch(r)), dagger(U)));
  }
  // Born-rule projective measurement in the Z basis.
  const measure = r => Math.random() < charge(r)
    ? { outcome:1, bloch:{x:0,y:0,z:-1} } : { outcome:0, bloch:{x:0,y:0,z:1} };

  // Map the game's coarse decoherence rate to physical T1/T2 (in turns).
  function timesFromRate(decoRate) {
    const dr = Math.max(0.25, decoRate || 1);
    const T1 = 10 / dr;          // amplitude damping: charge relaxes ~e^(−t/T1)
    const T2 = 0.75 * T1;        // dephasing slightly faster (T2 ≤ 2·T1 ✓)
    return { T1, T2 };
  }

  // ── falsifiability harness (critique rec #2) ──
  // Prepare a unit in |1⟩, evolve N turns, fit charge-vs-turns to an exponential
  // and to a line. A physical model ⇒ R²_exp ≈ 1 ≫ R²_lin, and the fitted T1
  // recovers the input T1.
  function linregR2(xs, ys) {
    const n = xs.length;
    const mx = xs.reduce((a,b)=>a+b,0)/n, my = ys.reduce((a,b)=>a+b,0)/n;
    let sxy=0, sxx=0, syy=0;
    for (let i=0;i<n;i++){ const dx=xs[i]-mx, dy=ys[i]-my; sxy+=dx*dy; sxx+=dx*dx; syy+=dy*dy; }
    const slope = sxx ? sxy/sxx : 0;
    let ssRes=0; for (let i=0;i<n;i++){ const f=slope*xs[i]+(my-slope*mx); ssRes+=(ys[i]-f)**2; }
    return { slope, r2: syy ? 1 - ssRes/syy : 1 };
  }
  function diagnose({ decoRate = 2, turns = 20 } = {}) {
    const { T1, T2 } = timesFromRate(decoRate);
    let r = { x:0, y:0, z:-1 };                  // start fully excited |1⟩
    const t=[], q=[], lnq=[];
    for (let k=0;k<=turns;k++){
      const c = charge(r); t.push(k); q.push(c);
      if (c > 1e-9) lnq.push(Math.log(c));
      r = lindbladStep(r, { T1, T2, dt:1 });
    }
    const expFit = linregR2(t.slice(0, lnq.length), lnq);   // ln(q) vs t
    const linFit = linregR2(t, q);                          // q vs t
    const report = {
      model:'Lindblad amplitude damping', decoRate, T1, T2,
      R2_exponential:+expFit.r2.toFixed(5), R2_linear:+linFit.r2.toFixed(5),
      T1_input:+T1.toFixed(3), T1_recovered:+(expFit.slope?-1/expFit.slope:Infinity).toFixed(3),
      verdict: expFit.r2 > linFit.r2 ? 'EXPONENTIAL (physical) ✓' : 'LINEAR (non-physical) ✗',
      charge_by_turn: q.map(v=>+v.toFixed(4)),
    };
    if (typeof console!=='undefined' && console.table)
      console.table({ R2_exp:report.R2_exponential, R2_lin:report.R2_linear,
                      T1_in:report.T1_input, T1_fit:report.T1_recovered, verdict:report.verdict });
    return report;
  }

  function selfTest() {
    const approx=(a,b,e=1e-9)=>Math.abs(a-b)<=e;
    const Z0={x:0,y:0,z:1};
    const hp=gateBloch(Z0,'H');
    const T1=5,T2=3;
    const r1=lindbladStep({x:0,y:0,z:-1},{T1,T2,dt:1});   // |1⟩ → one step
    const rp=lindbladStep({x:1,y:0,z:0},{T1,T2,dt:1});    // |+⟩ → one step
    const clamp=lindbladStep({x:1,y:0,z:0},{T1:2,T2:99,dt:1});
    const tests=[
      ['H|0⟩→|+⟩ (z=0,x=1)', approx(hp.z,0)&&approx(hp.x,1)],
      ['X|0⟩→|1⟩ (z=−1)',     approx(gateBloch(Z0,'X').z,-1)],
      ['Z preserves z',        approx(gateBloch(Z0,'Z').z,1)],
      ['charge(|1⟩)=1',        approx(charge({x:0,y:0,z:-1}),1)],
      ['charge(|+⟩)=½',        approx(charge(hp),0.5)],
      ['charge relaxes e^(−1/T1)', approx(charge(r1),Math.exp(-1/T1))],
      ['transverse decays e^(−1/T2)', approx(coherenceL1(rp),Math.exp(-1/T2))],
      ['T2 clamped to 2·T1',   clamp.x<=Math.exp(-1/(2*2))+1e-9],
    ];
    const passed=tests.filter(([,v])=>v).length;
    const fails=tests.filter(([,v])=>!v).map(([n])=>n);
    (passed===tests.length?console.log:console.error)
      (`QPhysics self-test: ${passed}/${tests.length} passed`+(fails.length?` — FAILED: ${fails.join('; ')}`:' ✓'));
    return { pass:passed===tests.length, tests };
  }

  return { blochFromPure, pureFromBloch, charge, guardCritProb, radius, purity, coherenceL1,
           lindbladStep, gateBloch, gateMatrix, rhoFromBloch, blochFromRho, Bell,
           measure, timesFromRate, diagnose, selfTest, rabiPopulation, rabiRotateState };
})();
if (typeof window !== 'undefined') {
  window.QPhysics = QPhysics;
  window.runDecoherenceDiagnostic = o => QPhysics.diagnose(o);
  try { QPhysics.selfTest(); } catch (e) { console.error('QPhysics self-test threw', e); }
}

// ═══════════════════════════════════════════════════════
// DuelCore — pure, DOM-free rules engine for Photon Duel (PD-2).
// ═══════════════════════════════════════════════════════
// Photon Duel's premise: a ship's health bar IS its qubit's Bloch vector.
// Beams are gate rotations, MEASURE is a Born-rule collapse, and idling
// decoheres you. So every number below has to come from the SAME engine the
// campaign uses — this module is the bridge, not a second physics.
//
// The one thing that is NOT a direct QPhysics call is rotateBloch(). QPhysics
// rotates pure spinors (rabiRotateState); a duel qubit is an OPEN system that
// decoheres mid-round, so its state is a Bloch vector with |r| < 1 that no
// spinor can represent. rotateBloch is the same unitary generalized to that
// vector — a right-handed Rodrigues rotation about the axis — and
// tests/duel_harness.test.js case 1b asserts it agrees with
// QPhysics.rabiRotateState to ~1e-16 on pure states, i.e. it is the engine's
// own rotation, extended to mixed states, not a hand-rolled approximation.
//
// Times are in SECONDS here (real-time duel), unlike the campaign's per-turn
// steps — decayStep converts before calling QPhysics.lindbladStep.
const DuelCore = (() => {
  // §3 tuning constants. "v1 tuning starts, not law" per the design doc.
  const K = {
    CHARGE_FULL_S: 1.2,       // hold time that reaches θ=π
    BEAM_SPEED:    700,       // world units / s
    BEAM_W:        6,
    BEAM_CD_S:     0.45,
    MEASURE_SPEED: 420,
    MEASURE_CD_S:  6,
    MEASURE_WIND_S: 1,        // telegraph before it launches
    SHIP_MAX_SPD:  260,
    SHIP_ACCEL:    900,
    SHIP_FRICTION: 0.92,      // per 60Hz frame
    CHARGE_SLOW:   0.6,       // move-speed multiplier while charging
    T1_S:          90,
    T2_S:          30,
    EIGEN_TOL_DEG: 10,        // beam is a no-op within this of ±axis
    ARC_MS:        250,       // sphere animation for a landed hit
    WORLD_W:       1280,
    WORLD_H:       800,
    SHIP_R:        22,
  };

  const AXES = { X:{x:1,y:0,z:0}, Y:{x:0,y:1,z:0}, Z:{x:0,y:0,z:1} };

  // ── Beam catalogue (D1 mechanics) ───────────────────────────────────
  // Two families, and the split is the real Clifford / non-Clifford one:
  //
  //   X, Y  — continuous-θ ATTACK beams. They tilt the vector toward or away
  //           from |1⟩, so they move MEASURE odds. Both are blocked when the
  //           target is parked at an eigenstate of that beam's own axis.
  //   T     — a FIXED π/4 phase rotation about z, and the scarce resource.
  //           It changes P(|1⟩) by exactly zero, so it can never win a round
  //           on its own. What it does is break camping — see below.
  //
  // Why T is the anti-turtle tool, and why Z is not: a camper sits at an
  // eigenstate of your attack axis (|±⟩ for X) where your beam is a no-op.
  // Z is Clifford, and a π rotation about z maps the X-eigenstate SET to
  // itself (|+⟩ ↔ |−⟩) — the camper is still camped. T is non-Clifford;
  // Rz(π/4) lands them at 45°, off every cardinal axis, where nothing
  // shields them. That is Gottesman–Knill showing up as a tactic: the gate
  // that buys you real quantum power is the gate that breaks the turtle.
  // (Asserted in duel_harness cases t1/t2 — it is a claim, so it is tested.)
  const BEAMS = {
    X: { axis:'X', kind:'attack', color:'#ff5a72', label:'X-BEAM',  clifford:true  },
    Y: { axis:'Y', kind:'attack', color:'#3fe08a', label:'Y-BEAM',  clifford:true  },
    T: { axis:'Z', kind:'phase',  color:'#f5b73c', label:'T-PHASE', clifford:false,
         fixedTheta: Math.PI/4, scarce:true },
  };

  // Zones — a "decoherence hotspot" is a patch of chip with brutal local T1/T2.
  // Flee into one and your own charge bleeds toward |0⟩ in seconds. That makes
  // it a genuine sanctuary (a discharged qubit is a terrible MEASURE target)
  // bought with your entire offence: you cannot hold a charge in there either.
  const ZONE = { HOT_T1: 4, HOT_T2: 2 };
  function zoneAt(x, y, zones) {
    if (!zones) return null;
    for (const z of zones)
      if ((x-z.x)*(x-z.x) + (y-z.y)*(y-z.y) <= z.r*z.r) return z;
    return null;
  }

  // Pulse fidelity: a real drive is never perfectly calibrated, so the angle
  // you actually deliver is θ ± error. fidelity 1 = textbook pulse; lower =
  // sloppier. Calibration pickups buy fidelity back. σ is in radians.
  const FIDELITY_SIGMA0 = 0.42;                     // σ at fidelity 0
  const sigmaFor = fid => FIDELITY_SIGMA0 * (1 - Math.max(0, Math.min(1, fid)));
  function gauss(rand) {                            // Box–Muller, seeded
    let u = 0, v = 0;
    while (u === 0) u = rand();
    while (v === 0) v = rand();
    return Math.sqrt(-2*Math.log(u)) * Math.cos(2*Math.PI*v);
  }
  const applyFidelity = (theta, fid, rand) =>
    theta + gauss(rand) * sigmaFor(fid);

  // Is the vector parked on a cardinal axis (an eigenstate of SOME axis)?
  // Used to tell a camper from a live target, and to prove T knocks them off.
  function isCardinal(r, tolDeg = K.EIGEN_TOL_DEG) {
    return ['X','Y','Z'].some(a => eigenstateAngleDeg(r, a) <= tolDeg);
  }

  // Seeded RNG so harness runs (and any future replay) are deterministic —
  // same generator the bot harnesses already use.
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Hold time → rotation angle. Linear in time and capped at π, so a full
  // hold is exactly a π-pulse (|0⟩→|1⟩) and a tap is a small nudge. The
  // charge bar is labelled in π-fractions so the player reads pulse AREA.
  const chargeToTheta = tHoldSec =>
    Math.PI * Math.min(Math.max(tHoldSec, 0) / K.CHARGE_FULL_S, 1);
  // DRIVE ×2: θ = Ω·t, so doubling the drive amplitude (Ω) doubles the angle
  // a given hold delivers. Still capped at π: a full hold is a π-pulse.
  const driveTheta = (tHoldSec, rabiMult) => chargeToTheta(tHoldSec * (rabiMult || 1));

  const norm = n => { const m = Math.hypot(n.x, n.y, n.z) || 1;
                      return { x:n.x/m, y:n.y/m, z:n.z/m }; };

  // Right-handed rotation of a Bloch vector about a unit axis (Rodrigues).
  // See the module header: equivalent to QPhysics.rabiRotateState on pure
  // states, valid for mixed ones too. Preserves |r| exactly (unitary).
  function rotateBloch(r, axis, theta) {
    const n = norm(axis);
    const c = Math.cos(theta), s = Math.sin(theta);
    const dot = n.x*r.x + n.y*r.y + n.z*r.z;
    const cr = { x: n.y*r.z - n.z*r.y,
                 y: n.z*r.x - n.x*r.z,
                 z: n.x*r.y - n.y*r.x };
    return {
      x: r.x*c + cr.x*s + n.x*dot*(1-c),
      y: r.y*c + cr.y*s + n.y*dot*(1-c),
      z: r.z*c + cr.z*s + n.z*dot*(1-c),
    };
  }

  // Angle between the state vector and a beam axis, in degrees, folded to
  // [0,90] — parking at EITHER pole of an axis makes that axis a no-op.
  function eigenstateAngleDeg(r, axisName) {
    const n = AXES[axisName]; if (!n) return 90;
    const m = Math.hypot(r.x, r.y, r.z);
    if (m < 1e-9) return 90;                       // fully mixed: no eigen-parking
    const cosA = Math.abs((r.x*n.x + r.y*n.y + r.z*n.z) / m);
    return Math.acos(Math.min(1, cosA)) * 180 / Math.PI;
  }
  const isEigenstate = (r, axisName, tolDeg = K.EIGEN_TOL_DEG) =>
    eigenstateAngleDeg(r, axisName) <= tolDeg;

  // Best shot: the attack-beam angle θ ∈ [0, π] (what a charge can deliver)
  // that leaves the target most likely to read |1⟩. For an X or Y axis n,
  // z(θ) = z·cosθ + w·sinθ with w = (n × r)_z, so the unconstrained best is
  // θ* = atan2(−w, −z); if that needs more than π, the best reachable angle
  // is an endpoint. This is why a full π-pulse is right from |0⟩ but does
  // nothing useful from the equator (there you want π/2).
  function bestPulse(r, beamKey) {
    const b = BEAMS[beamKey];
    if (!b || b.kind !== 'attack') return null;
    const n = AXES[b.axis], w = n.x * r.y - n.y * r.x;
    const zAt = th => r.z * Math.cos(th) + w * Math.sin(th);
    let th = Math.atan2(-w, -r.z);
    if (th < 0) th += 2 * Math.PI;
    if (th > Math.PI) th = zAt(Math.PI) < zAt(0) ? Math.PI : 0;
    return { beam: beamKey, theta: th, p1: (1 - zAt(th)) / 2 };
  }
  function bestAttack(r, prefer) {
    const a = bestPulse(r, 'X'), b = bestPulse(r, 'Y');
    const first = prefer === 'Y' ? b : a, second = prefer === 'Y' ? a : b;
    return second.p1 > first.p1 + 0.03 ? second : first;   // stick with the selected beam unless clearly worse
  }

  // Off-resonant drive (FLUX DETUNE power-up). A qubit detuned by Δ from a
  // drive of Rabi rate Ω turns about the tilted axis (Ω·n̂ + Δ·ẑ)/Ω′ at the
  // generalised Rabi rate Ω′ = √(Ω² + Δ²). A pulse that would have been θ on
  // resonance lasts θ/Ω, so it turns the vector by θ·Ω′/Ω about that axis.
  // From |0⟩ the most it can reach is P(|1⟩) = Ω²/Ω′² = 1/(1 + (Δ/Ω)²), the
  // Rabi formula's ceiling. dOverO = Δ/Ω; 0 is the resonant rotation.
  function detunedRotate(r, axis, theta, dOverO) {
    const d = dOverO || 0;
    const n = norm({ x: axis.x, y: axis.y, z: axis.z + d });
    return rotateBloch(r, n, theta * Math.sqrt(1 + d * d));
  }

  // Bloch vector of one qubit of a two-qubit pure state (partial trace).
  // amps index = 2·b0 + b1. Same convention as the 1-qubit engine: z = +1 is
  // |0⟩, so z = ρ00 − ρ11 and ρ01 = (x − i·y)/2.
  function reducedBloch(amps, which) {
    const idx = (b, k) => which === 0 ? b * 2 + k : k * 2 + b;
    let r00 = 0, r11 = 0, re01 = 0, im01 = 0;
    for (let k = 0; k < 2; k++) {
      const a0 = amps[idx(0, k)], a1 = amps[idx(1, k)];
      r00 += a0.r * a0.r + a0.i * a0.i;
      r11 += a1.r * a1.r + a1.i * a1.i;
      re01 += a0.r * a1.r + a0.i * a1.i;          // Re(a0·conj a1)
      im01 += a0.i * a1.r - a0.r * a1.i;          // Im(a0·conj a1)
    }
    return { x: 2 * re01, y: -2 * im01, z: r00 - r11 };
  }

  // A beam landing: rotate about its axis by θ, unless the target is parked
  // at an eigenstate of that axis (rotation would be a no-op anyway — the
  // shield mechanic makes that physical fact visible as a refraction).
  function applyBeamHit(r, axisName, theta) {
    if (isEigenstate(r, axisName)) return { bloch: r, shielded: true };
    return { bloch: rotateBloch(r, AXES[axisName], theta), shielded: false };
  }

  // Open-system decay, straight through the campaign's exact Lindblad step.
  // zone lets a biome (D2 nebula) shorten T2 locally.
  function decayStep(r, dtSec, zone) {
    const T1 = (zone && zone.t1) || K.T1_S;
    const T2 = (zone && zone.t2) || K.T2_S;
    return QPhysics.lindbladStep(r, { T1, T2, dt: dtSec });
  }

  const odds = r => QPhysics.charge(r);            // P(|1⟩) — the win chance

  // MEASURE: project onto the Z basis with the Born rule. Outcome 1 wins the
  // round; outcome 0 is a dud that leaves the target in |0⟩ — it must be
  // re-rotated from scratch, which is the real cost of a mistimed shot.
  // `draw` is the uniform number the Born rule was decided by (outcome 1 iff
  // draw < p); the measurement reveal shows it on the P(0)/P(1) bar.
  function measureRoll(r, rand = Math.random) {
    const p = odds(r);
    const draw = rand();
    const outcome = draw < p ? 1 : 0;
    return {
      outcome, p, draw,
      bloch: outcome === 1 ? { x:0, y:0, z:-1 } : { x:0, y:0, z:1 },
    };
  }

  // Which self-pulse moves me toward parking on ±targetAxis?
  //
  // Two traps live here, both found by the harness rather than by reasoning:
  //
  //  1. You CANNOT reach an X-eigenstate with an X-pulse. A rotation leaves
  //     its own axis's component untouched, so the obvious "pulse the axis you
  //     want" is the one move guaranteed not to work (case p1).
  //  2. A single perpendicular pulse is not always enough either. Parking on X
  //     with the Y-beam can only ever reach |x| = √(x²+z²), because a
  //     Y-rotation cannot touch y — so from (0, 0.6, 0.8) it stalls at 36.9°
  //     off-axis, forever (case p2-X).
  //
  // So this is a two-phase controller, and the duel only offers continuous-θ
  // pulses about X and Y (Z is the fixed-π/4 T):
  //     park on X → clear y with an X-pulse, then fold z into x with a Y-pulse
  //     park on Y → clear x with a Y-pulse, then fold z into y with an X-pulse
  // Conventions below are read off rotateBloch's own Rodrigues form.
  function parkPulse(r, targetAxis) {
    const TOL = 1e-3;
    if (targetAxis === 'X') {
      // Phase 1: a Y-rotation can never change y, so clear it first (X-pulse).
      if (Math.abs(r.y) > TOL) return { beam: 'X', theta: Math.atan2(r.y, r.z) };
      // Phase 2: fold z into x (Y-pulse); x' = x·cosθ + z·sinθ.
      return { beam: 'Y', theta: Math.atan2(r.z, r.x) };
    }
    // targetAxis === 'Y'
    if (Math.abs(r.x) > TOL) return { beam: 'Y', theta: Math.atan2(-r.x, r.z) };
    return { beam: 'X', theta: Math.atan2(-r.z, r.y) };
  }

  // ── Bell trap (entangle beam) ────────────────────────────────────────
  // Landing an entangle beam puts both duellists into |Φ+⟩. From that moment
  // NEITHER qubit has its own charge: each reads 50%, and a MEASURE on either
  // collapses BOTH to the same outcome. That makes it the comeback move —
  // if you are at 5% and they are at 95%, entangling resets the round to an
  // honest coin flip. It is also the no-signalling lesson in mechanical form:
  // you cannot use the link to DO anything to them, only to share a fate.
  // Runs on QPhysics.Bell, the campaign's own 2-qubit machinery.
  function bellPair() { return QPhysics.Bell.phiPlus(); }
  function bellOdds(amps, which) { return QPhysics.Bell.marginalP1(amps, which); }
  function bellMeasure(amps, which, rand = Math.random) {
    const res = QPhysics.Bell.measure(amps, which, rand);
    const toBloch = bit => ({ x:0, y:0, z: bit === 1 ? -1 : 1 });
    return {
      outcome: res.outcome,
      partnerOutcome: res.partnerOutcome,
      p: bellOdds(amps, which),
      blochSelf: toBloch(res.outcome),
      blochPartner: toBloch(res.partnerOutcome),
    };
  }

  // ── Quantum Zeno lock ────────────────────────────────────────────────
  // Measure the same target twice inside ZENO_WINDOW and it freezes: further
  // rotations do nothing to it for ZENO_HOLD seconds. This is the real Zeno
  // effect (a watched qubit cannot evolve), used as denial — you pin them at
  // |0⟩ so they cannot charge up to threaten you. Expensive: MEASURE is on a
  // 6s cooldown, so a lock costs you two of them.
  const ZENO = { WINDOW: 4, HOLD: 2.5, NEEDED: 2 };

  // The full beam-landing rule, with every D1 mechanic folded in. Pure:
  // callers hand in the target's state and the shooter's fidelity/RNG.
  //   returns { bloch, shielded, zenoBlocked, theta, deltaOdds }
  function resolveBeam(targetBloch, beamKey, thetaNominal, opts) {
    const o = opts || {};
    const beam = BEAMS[beamKey] || BEAMS.X;
    const before = targetBloch;
    if (o.zenoUntil && o.now != null && o.now < o.zenoUntil)
      return { bloch: before, shielded: false, zenoBlocked: true,
               theta: 0, deltaOdds: 0 };
    // Detuned target: X/Y drive is off-resonant, so it turns the vector about
    // a tilted axis. No eigenstate shield here: |±⟩ is not an eigenstate of
    // the tilted axis. The T-phase is a frame change and stays exact.
    if (o.detune && beam.kind === 'attack') {
      const theta = applyFidelity(thetaNominal, o.fidelity == null ? 1 : o.fidelity,
                                  o.rand || Math.random);
      const after = detunedRotate(before, AXES[beam.axis], theta, o.detune);
      return { bloch: after, shielded: false, zenoBlocked: false, detuned: true,
               theta, deltaOdds: odds(after) - odds(before) };
    }
    const theta = beam.fixedTheta != null
      ? beam.fixedTheta
      : applyFidelity(thetaNominal, o.fidelity == null ? 1 : o.fidelity,
                      o.rand || Math.random);
    if (isEigenstate(before, beam.axis))
      return { bloch: before, shielded: true, zenoBlocked: false,
               theta, deltaOdds: 0 };
    const after = rotateBloch(before, AXES[beam.axis], theta);
    return { bloch: after, shielded: false, zenoBlocked: false, theta,
             deltaOdds: odds(after) - odds(before) };
  }

  // ── Entangled pair: an exact two-qubit density matrix ────────────────
  // While linked, the two duellists are ONE 4×4 density matrix ρ, not two
  // Bloch vectors. Basis index i = 2·bA + bB (A = qubit 0). Every operation is
  // the textbook one: a local pulse is (R ⊗ I) ρ (R ⊗ I)†, decay is each
  // qubit's own amplitude-damping + dephasing Kraus channel (identical to
  // QPhysics.lindbladStep on a product state), the coupler is a CNOT, and a
  // MEASURE is a Z projection on one half. Each ship's displayed Bloch vector
  // is its reduced state Tr_other(ρ), so odds, spheres and the bot read the
  // real marginals. Entanglement is quantified by the negativity of the
  // partial transpose (0 for separable, ½ for a Bell state).
  const Pair = (() => {
    const N = 4;
    const mk = () => ({ re: new Float64Array(16), im: new Float64Array(16) });
    const bit = (i, q) => q === 0 ? (i >> 1) & 1 : i & 1;

    function fromBloch(rA, rB) {
      const one = r => ({ re: [(1+r.z)/2, r.x/2, r.x/2, (1-r.z)/2],
                          im: [0, -r.y/2, r.y/2, 0] });           // [[00,01],[10,11]]
      const A = one(rA), B = one(rB), P = mk();
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
        const ai = (i>>1)*2 + (j>>1), bi = (i&1)*2 + (j&1);
        P.re[i*4+j] = A.re[ai]*B.re[bi] - A.im[ai]*B.im[bi];
        P.im[i*4+j] = A.re[ai]*B.im[bi] + A.im[ai]*B.re[bi];
      }
      return P;
    }

    // U ρ U† for a 4×4 complex U given as {re,im}.
    function conj(P, U) {
      const T = mk(), O = mk();
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
        let r = 0, m = 0;
        for (let k = 0; k < N; k++) {
          const ur = U.re[i*4+k], ui = U.im[i*4+k], pr = P.re[k*4+j], pi = P.im[k*4+j];
          r += ur*pr - ui*pi; m += ur*pi + ui*pr;
        }
        T.re[i*4+j] = r; T.im[i*4+j] = m;
      }
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
        let r = 0, m = 0;
        for (let k = 0; k < N; k++) {       // T · U†, U†[k][j] = conj(U[j][k])
          const tr = T.re[i*4+k], ti = T.im[i*4+k], ur = U.re[j*4+k], ui = -U.im[j*4+k];
          r += tr*ur - ti*ui; m += tr*ui + ti*ur;
        }
        O.re[i*4+j] = r; O.im[i*4+j] = m;
      }
      return O;
    }

    // Embed a 2×2 operator {re:[a,b,c,d], im:[...]} on qubit q.
    function embed(K, q) {
      const U = mk();
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
        const o = 1 - q;                                   // the other qubit
        if (bit(i, o) !== bit(j, o)) continue;
        const k = bit(i, q) * 2 + bit(j, q);
        U.re[i*4+j] = K.re[k]; U.im[i*4+j] = K.im[k];
      }
      return U;
    }

    // Right-handed rotation by θ about unit axis n: R = cos(θ/2) I − i sin(θ/2) n·σ.
    // Same convention as rotateBloch (asserted in the harness).
    function rot(n, theta) {
      const c = Math.cos(theta/2), s = Math.sin(theta/2);
      return { re: [c, -s*n.y, s*n.y, c], im: [-s*n.z, -s*n.x, -s*n.x, s*n.z] };
    }
    const rotate = (P, q, axis, theta) => conj(P, embed(rot(norm(axis), theta), q));

    function cnot(P, control) {
      const t = 1 - control, perm = i => bit(i, control) ? i ^ (t === 0 ? 2 : 1) : i;
      const O = mk();
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
        O.re[perm(i)*4+perm(j)] = P.re[i*4+j];
        O.im[perm(i)*4+perm(j)] = P.im[i*4+j];
      }
      return O;
    }

    // One qubit's T₁ amplitude damping, then pure dephasing so coherences
    // decay as e^{−dt/T₂} overall (needs T₂ ≤ 2T₁, enforced as in lindbladStep).
    function decay(P, q, { T1, T2, dt }) {
      T1 = Math.max(1e-6, T1); T2 = Math.max(1e-6, Math.min(T2, 2 * T1));
      const g = 1 - Math.exp(-dt / T1);
      const f = Math.exp(-dt * (1 / T2 - 1 / (2 * T1)));
      const Ks = [
        { re: [1, 0, 0, Math.sqrt(1 - g)], im: [0, 0, 0, 0] },
        { re: [0, Math.sqrt(g), 0, 0],     im: [0, 0, 0, 0] },
      ];
      const add = (A, B) => { for (let k = 0; k < 16; k++) { A.re[k] += B.re[k]; A.im[k] += B.im[k]; } return A; };
      let O = mk();
      for (const K of Ks) O = add(O, conj(P, embed(K, q)));
      const D = mk();
      const d0 = Math.sqrt((1 + f) / 2), d1 = Math.sqrt((1 - f) / 2);
      for (const K of [{ re: [d0, 0, 0, d0], im: [0,0,0,0] }, { re: [d1, 0, 0, -d1], im: [0,0,0,0] }])
        add(D, conj(O, embed(K, q)));
      return D;
    }

    function reduced(P, q) {
      let r00 = 0, r11 = 0, re01 = 0, im01 = 0;
      for (let k = 0; k < 2; k++) {
        const i0 = q === 0 ? k : k * 2, i1 = q === 0 ? 2 + k : k * 2 + 1;
        r00 += P.re[i0*4+i0]; r11 += P.re[i1*4+i1];
        re01 += P.re[i0*4+i1]; im01 += P.im[i0*4+i1];
      }
      return { x: 2 * re01, y: -2 * im01, z: r00 - r11 };
    }
    const p1 = (P, q) => { let s = 0; for (let i = 0; i < N; i++) if (bit(i, q)) s += P.re[i*4+i]; return s; };
    // ⟨Z⊗Z⟩: +1 when the two Z outcomes always match, −1 when always opposite.
    const zz = P => { let s = 0; for (let i = 0; i < N; i++) s += P.re[i*4+i] * ((bit(i,0) ^ bit(i,1)) ? -1 : 1); return s; };

    // Z measurement on qubit q with the Born rule; returns both outcomes and
    // the two post-measurement Bloch vectors (the pair is a product state
    // afterwards, so the link ends).
    function measure(P, q, rand = Math.random) {
      const p = p1(P, q), draw = rand(), outcome = draw < p ? 1 : 0;
      const pm = outcome ? p : 1 - p;
      const O = mk();
      if (pm > 1e-12) for (let i = 0; i < N; i++) for (let j = 0; j < N; j++)
        if (bit(i, q) === outcome && bit(j, q) === outcome) {
          O.re[i*4+j] = P.re[i*4+j] / pm; O.im[i*4+j] = P.im[i*4+j] / pm;
        }
      const self = reduced(O, q), partner = reduced(O, 1 - q);
      return { outcome, p, draw, self, partner,
               partnerP1: (1 - partner.z) / 2 };
    }

    // Smallest eigenvalue of a Hermitian 4×4, via its real 8×8 embedding
    // [[A, −B], [B, A]] (each eigenvalue appears twice) and cyclic Jacobi.
    function minEig(H) {
      const n = 8, M = Array.from({ length: n }, () => new Float64Array(n));
      for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
        const a = H.re[i*4+j], b = H.im[i*4+j];
        M[i][j] = a; M[i+4][j+4] = a; M[i][j+4] = -b; M[i+4][j] = b;
      }
      for (let sweep = 0; sweep < 30; sweep++) {
        let off = 0;
        for (let p = 0; p < n; p++) for (let q = p + 1; q < n; q++) off += M[p][q] * M[p][q];
        if (off < 1e-22) break;
        for (let p = 0; p < n; p++) for (let q = p + 1; q < n; q++) {
          if (Math.abs(M[p][q]) < 1e-15) continue;
          const th = (M[q][q] - M[p][p]) / (2 * M[p][q]);
          const t = Math.sign(th || 1) / (Math.abs(th) + Math.sqrt(th * th + 1));
          const c = 1 / Math.sqrt(t * t + 1), s = t * c;
          for (let k = 0; k < n; k++) {
            const mkp = M[k][p], mkq = M[k][q];
            M[k][p] = c * mkp - s * mkq; M[k][q] = s * mkp + c * mkq;
          }
          for (let k = 0; k < n; k++) {
            const mpk = M[p][k], mqk = M[q][k];
            M[p][k] = c * mpk - s * mqk; M[q][k] = s * mpk + c * mqk;
          }
        }
      }
      let m = Infinity; for (let i = 0; i < n; i++) m = Math.min(m, M[i][i]);
      return m;
    }
    // Negativity of ρ^{T_B}: Σ|negative eigenvalues|. For two qubits at most
    // one is negative, so N = max(0, −λmin). 0 = separable, ½ = Bell state.
    function negativity(P) {
      const T = mk();
      for (let i = 0; i < N; i++) for (let j = 0; j < N; j++) {
        const a = i >> 1, b = i & 1, a2 = j >> 1, b2 = j & 1;
        const src = (a * 2 + b2) * 4 + (a2 * 2 + b);       // swap B indices
        T.re[i*4+j] = P.re[src]; T.im[i*4+j] = P.im[src];
      }
      return Math.max(0, -minEig(T));
    }
    // How far ρ is from the product of its marginals (max entry difference).
    function productGap(P) {
      const Q = fromBloch(reduced(P, 0), reduced(P, 1));
      let g = 0;
      for (let k = 0; k < 16; k++) g = Math.max(g, Math.abs(P.re[k] - Q.re[k]), Math.abs(P.im[k] - Q.im[k]));
      return g;
    }
    return { fromBloch, rotate, cnot, decay, reduced, p1, zz, measure, negativity, productGap };
  })();

  // ── Pickups ──────────────────────────────────────────────────────────
  // calib and tgate are the originals (and the only ones in Duel Training,
  // whose missions are tuned around them). The free duel adds four more, each
  // a real control-hardware technique, on a fixed rotation so you can plan
  // for them (no random rewards). Each one helps the ship that collects it:
  // in this game decay drains the charge an opponent put on you, so longer
  // T₁/T₂ would protect THEIR work. That is why there is no coherence boost.
  const PICKUPS = {
    calib:   { glyph:'⌖', color:'#3fe08a', name:'CALIBRATION',
               effect:'+15% pulse fidelity: your beams land closer to the angle you charged.' },
    tgate:   { glyph:'T', color:'#f5b73c', name:'T-CHARGE',
               effect:'+1 T-phase (a π/4 turn about z) to knock a camper off its eigenstate.' },
    readout: { glyph:'M', color:'#7fd0ff', name:'FAST READOUT', windS:0.35,
               effect:'Your MEASURE is ready now, and its wind-up drops from 1 s to 0.35 s.',
               physics:'A Purcell filter lets the readout resonator couple strongly to the qubit without shortening T₁, so a measurement finishes faster.' },
    reset:   { glyph:'0', color:'#e8ecff', name:'ACTIVE RESET',
               effect:'Your qubit snaps to |0⟩, so a MEASURE on you is a sure dud. It also breaks an entangled link.',
               physics:'Hardware reset pulses pump the excitation out through a lossy mode, leaving the qubit in |0⟩ in well under a microsecond.' },
    drive:   { glyph:'Ω', color:'#ff9f43', name:'DRIVE ×2', durS:10, rabiMult:2,
               effect:'For 10 s your Rabi rate doubles: a full π-pulse charges in 0.6 s instead of 1.2 s.',
               physics:'The rotation angle is θ = Ω·t, and Ω grows with drive amplitude, so twice the amplitude turns the qubit twice as far in the same time.' },
    detune:  { glyph:'Δ', color:'#b18cff', name:'FLUX DETUNE', durS:8, dOverO:2,
               effect:'For 8 s you are tuned away from their drive (Δ = 2Ω): their X/Y beams turn you about a tilted axis, and from |0⟩ they can lift you to 20% at most. Best grabbed while you are near |0⟩.',
               physics:'Off resonance the drive turns the qubit about a tilted axis, so starting from |0⟩ the highest P(|1⟩) it can reach is Ω²/(Ω² + Δ²).' },
  };
  const PICKUP_CYCLE = ['readout', 'calib', 'reset', 'tgate', 'drive', 'detune'];

  // ── Duel missions: the campaign's concept gating, reborn ─────────────
  // The 7-mission campaign's real value was never the chess board — it was
  // the campaign's shield rule: a target you CANNOT beat unless you use the
  // concept. Ported here verbatim in spirit. Each mission names a concept and
  // a gate; the gate inspects EVIDENCE collected during the round and refuses
  // a win that didn't use it. Pure and data-only so duel_harness can prove

// C03-T1/T2 — durable, local-only duel mastery. The pure updater is shared
// by production and the deterministic harness so record comparison and badge
// predicates cannot quietly drift apart.
const DUEL_PROFILE_KEY = 'qublitz_duel_profile_v1';
const DuelProgress = (() => {
  const BADGES = Object.freeze([
    { id:'bell-collapse', title:'CORRELATED FINISH',
      requirement:'Win through a Bell-pair MEASURE so both qubits collapse together.' },
    { id:'phase-breaker', title:'PHASE BREAKER',
      requirement:'Break an eigenstate camp with a landed T-phase, then win the duel.' },
    { id:'hotspot-guard', title:'HOTSPOT GUARD',
      requirement:'Discharge in a hotspot for at least 0.5s while exposed, then win.' },
  ]);

  const finite = (v, min, max) => Number.isFinite(v) && v >= min && v <= max ? v : null;
  const whole = (v, min, max) => Number.isInteger(v) && v >= min && v <= max ? v : null;
  const blank = () => ({ version:1, missions:{}, free:{ wins:0, losses:0, streak:0, bestStreak:0 }, badges:[] });

  function sanitize(raw) {
    const out = blank();
    if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
    const srcMissions = raw.missions && typeof raw.missions === 'object' ? raw.missions : {};
    for (let i = 0; i < DuelCore.DUEL_MISSIONS.length; i++) {
      const src = srcMissions[i];
      if (!src || typeof src !== 'object' || Array.isArray(src)) continue;
      const rec = {};
      const bestTimeS = finite(src.bestTimeS, 0, 86400);
      const fewestShots = whole(src.fewestShots, 0, 100000);
      const bestMeasureP = finite(src.bestMeasureP, 0, 1);
      const bestStars = whole(src.bestStars, 1, 3);
      if (bestStars != null) rec.bestStars = bestStars;
      if (bestTimeS != null) rec.bestTimeS = +bestTimeS.toFixed(2);
      if (fewestShots != null) rec.fewestShots = fewestShots;
      if (bestMeasureP != null) rec.bestMeasureP = +bestMeasureP.toFixed(4);
      if (Object.keys(rec).length) out.missions[i] = rec;
    }
    const free = raw.free && typeof raw.free === 'object' ? raw.free : {};
    out.free.wins = whole(free.wins, 0, 1000000) || 0;
    out.free.losses = whole(free.losses, 0, 1000000) || 0;
    out.free.streak = whole(free.streak, 0, 1000000) || 0;
    out.free.bestStreak = Math.max(out.free.streak, whole(free.bestStreak, 0, 1000000) || 0);
    const allowed = new Set(BADGES.map(b => b.id));
    if (Array.isArray(raw.badges))
      out.badges = [...new Set(raw.badges.filter(id => typeof id === 'string' && allowed.has(id)))];
    return out;
  }

  function earnedBadgeIds(result) {
    if (!result || result.won !== true) return [];
    const ev = result.evidence || {};
    const ids = [];
    if (result.method === 'bell-measure' && ev.bellCollapse === true) ids.push('bell-collapse');
    if (ev.tCampBroken === true) ids.push('phase-breaker');
    if (finite(ev.hotspotDefenseTime, 0.5, 86400) != null) ids.push('hotspot-guard');
    return ids;
  }

  function update(profile, result) {
    const next = sanitize(profile);
    const newRecords = [];
    const mission = result && whole(result.mission, -1, DuelCore.DUEL_MISSIONS.length - 1);
    if (result && result.won === true && mission != null && mission >= 0) {
      const rec = Object.assign({}, next.missions[mission] || {});
      const seconds = finite(result.seconds, 0, 86400);
      const shots = whole(result.shots, 0, 100000);
      const p = finite(result.p, 0, 1);
      if (seconds != null && (rec.bestTimeS == null || seconds < rec.bestTimeS)) {
        rec.bestTimeS = +seconds.toFixed(2); newRecords.push(`MISSION ${mission + 1} FASTEST TIME`);
      }
      if (shots != null && (rec.fewestShots == null || shots < rec.fewestShots)) {
        rec.fewestShots = shots; newRecords.push(`MISSION ${mission + 1} FEWEST SHOTS`);
      }
      if (p != null && (rec.bestMeasureP == null || p > rec.bestMeasureP)) {
        rec.bestMeasureP = +p.toFixed(4); newRecords.push(`MISSION ${mission + 1} BEST MEASURE`);
      }
      const stars = whole(result.stars, 1, 3);
      if (stars != null && (rec.bestStars == null || stars > rec.bestStars)) {
        rec.bestStars = stars; newRecords.push(`MISSION ${mission + 1} ${DuelCore.starText(stars)}`);
      }
      next.missions[mission] = rec;
    }
    if (result && mission === -1 && result.matchFinished === true) {
      if (result.matchWon === true) {
        next.free.wins++;
        next.free.streak++;
        if (next.free.streak > next.free.bestStreak) {
          next.free.bestStreak = next.free.streak;
          newRecords.push('FREE DUEL BEST STREAK');
        }
      } else {
        next.free.losses++;
        next.free.streak = 0;
      }
    }
    const have = new Set(next.badges);
    const earnedBadges = earnedBadgeIds(result).filter(id => !have.has(id));
    next.badges.push(...earnedBadges);
    return { profile:next, newRecords, earnedBadges };
  }

  const nextBadge = profile => {
    const have = new Set(sanitize(profile).badges);
    return BADGES.find(b => !have.has(b.id)) || null;
  };

  return { BADGES, blank, sanitize, update, earnedBadgeIds, nextBadge };
})();

  }

    const rise = i => buttons[i] > 0.5 && (prev[i] || 0) <= 0.5;

      id:typeof pad.id === 'string' ? pad.id.slice(0, 80) : 'Standard gamepad',

      aim:stick((pad.axes || [])[2], (pad.axes || [])[3]),
      attackHeld, selfHeld,

      attackReleased:fall(B.attack),
      selfPressed:selfHeld && (prev[B.selfPulse] || 0) <= 0.25,
      selfReleased:fall(B.selfPulse),
      measurePressed:rise(B.measure), entanglePressed:rise(B.entangle), pausePressed:rise(B.pause),
      replayPressed:rise(B.entangle), confirmPressed:rise(B.measure), quitPressed:rise(1),

// ═══════════════════════════════════════════════════════
// DuelBot — pure, DOM-free opponent for Photon Duel (PD-24).
// ═══════════════════════════════════════════════════════
// Deliberately NOT the old BotAI (which went with the board): that one played
// a turn-based grid. This one plays the real-time duel and, unlike the D0
// stand-in drone, actually knows the mechanics exist — it parks on
// eigenstates, spends T-charges to break YOUR camp, runs to a decoherence
// hotspot to dump a dangerous charge, and entangles when it is losing.
//
// Pure: decide() takes a snapshot and returns an intent. No DOM, no canvas,
// no timers — so tests/duel_harness.test.js can run it headless for a full
// 60s of simulated play and assert it never stalls and never NaNs (§9.6).
//
// Levels are the design doc's §3.7 table. The three knobs that matter are
// aim error, decision cadence, and how much of the mechanic set is unlocked;
// a Cadet is not a Duelist with worse aim, it is a Duelist that has not
// learned to park, phase or entangle.
const DuelBot = (() => {
  const D = Math.PI / 180;
  const LEVELS = [
    { key:0, name:'CADET',   sigma:14*D, tick:0.90, park:'never',
      measureAt:0.75, useT:false, useBell:false, useZeno:false, useHotspot:false },
    { key:1, name:'DUELIST', sigma: 8*D, tick:0.60, park:'threatened',
      measureAt:0.85, useT:true,  useBell:true,  useZeno:false, useHotspot:true },
    { key:2, name:'MENACE',  sigma: 4*D, tick:0.35, park:'proactive',
      measureAt:null, useT:true,  useBell:true,  useZeno:true,  useHotspot:true },
  ];
  const levelOf = i => LEVELS[Math.max(0, Math.min(LEVELS.length-1, i|0))];

  const dist = (a, b) => Math.hypot(a.x-b.x, a.y-b.y);
  const gauss = rand => {
    let u=0,v=0; while(u===0)u=rand(); while(v===0)v=rand();
    return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);
  };

  // Which axis has the opponent been hitting us with? That is the axis worth
  // parking on. Falls back to X (the workhorse beam).
  function threatAxis(view) {
    const h = view.foeAxisCounts || {};
    let best = 'X', n = -1;
    for (const k of ['X','Y']) if ((h[k]||0) > n) { n = h[k]||0; best = k; }
    return best;
  }

  // Optimal-EV measure timing (Menace): a MEASURE that fails costs a 6s
  // lockout during which their charge keeps decaying, so it is worth waiting
  // for a high P — but not past the peak, because T1 only takes it away.
  function shouldMeasure(view, L) {
    const p = view.foeOdds;
    if (L.measureAt != null) return p >= L.measureAt;
    if (p >= 0.88) return true;
    return p >= 0.65 && view.foeOddsFalling;      // past the peak — take it
  }

  // The one assist, and it is DISCLOSED in the UI, never silent: three losses
  // in a row widen the bot's aim by 15%. Students talk; discovered fake
  // difficulty destroys trust in the physics (OVERHAUL_PLAN P6.4).
  const assistedSigma = (L, lossStreak) =>
    L.sigma * (lossStreak >= 3 ? 1.15 : 1);

  function decide(view, levelIdx, rand, lossStreak) {
    const L = levelOf(levelIdx);
    const me = view.me, foe = view.foe;
    const out = { moveX:0, moveY:0, aim:0, beam:'X', fire:false, hold:0,
                  selfPulse:false, measure:false, entangle:false, reason:'' };

    const d = dist(me, foe);
    const toFoe = Math.atan2(foe.y-me.y, foe.x-me.x);
    out.aim = toFoe + gauss(rand) * assistedSigma(L, lossStreak||0);

    // ── Defensive reads first ──────────────────────────────────────────
    const myOdds = view.myOdds;                    // how measurable I am
    const inDanger = myOdds > 0.6 && foe.measReady;

    // Sanctuary: a hotspot dumps my charge fast, so it is the answer to being
    // dangerously charged — at the price of my own offence.
    if (L.useHotspot && inDanger && view.nearestZone && !me.inHot) {
      const z = view.nearestZone;
      out.moveX = z.x - me.x; out.moveY = z.y - me.y;
      out.reason = 'running to a decoherence hotspot to dump my charge';
      return out;
    }

    // Park on an eigenstate of the axis they keep using: their beam becomes a
    // no-op against me. Proactive levels do it pre-emptively.
    const axis = threatAxis(view);
    const parked = view.myEigen[axis];
    // Only worth parking if I am actually worth shooting at. Near |0> I am
    // already a poor MEASURE target, so parking there would just starve my
    // own offence — which is exactly what an unconditioned 'proactive' rule
    // did: 41 self-pulses and zero attacks across a 60s sim (harness case 6).
    // Parking takes up to two pulses (see DuelCore.parkPulse). Phase 1 dumps
    // charge toward a pole, which drops myOdds below the threshold — so a
    // purely odds-driven trigger ABANDONS every park half-finished and never
    // actually shields anything (harness case 6h caught exactly that). Once
    // committed, finish: view.parkingAxis is the shell's commitment flag.
    const committed = view.parkingAxis === axis;
    const worthParking = myOdds > 0.3;
    const wantPark = (committed || worthParking) && (L.park === 'proactive'
      || (L.park === 'threatened' && (inDanger || committed)));
    if (wantPark && !parked && me.beamReady) {
      const pp = DuelCore.parkPulse(view.myBloch, axis);
      out.selfPulse = true; out.beam = pp.beam; out.theta = pp.theta;
      out.hold = Math.min(1.2, Math.abs(pp.theta) / Math.PI * 1.2);
      out.parkingAxis = axis;   // shell keeps this until isEigenstate(axis)
      out.reason = `parking on the ${axis}-axis so your ${axis}-beam does nothing`;
      return out;
    }

    // Comeback: if I am far behind on odds, entangling resets us both to 50/50.
    if (L.useBell && !view.bell && me.entReady && view.foeOdds < 0.25 && myOdds > 0.7) {
      out.entangle = true;
      out.reason = 'entangling — a coin flip beats the fight I am losing';
      return out;
    }

    // ── Offence ────────────────────────────────────────────────────────
    if (shouldMeasure(view, L) && me.measReady) {
      out.measure = true;
      out.reason = `measuring at P=${(view.foeOdds*100).toFixed(0)}%`;
      return out;
    }
    // Zeno denial: pin them at |0> so they cannot build a threat.
    if (L.useZeno && me.measReady && view.foeOdds < 0.15 && view.myMeasStreak >= 1) {
      out.measure = true;
      out.reason = 'measuring again to Zeno-pin you';
      return out;
    }
    // They are camped: only a non-Clifford T knocks them off.
    if (L.useT && me.tCharges > 0 && view.foeEigen[axisForAttack(view)] && me.beamReady) {
      out.fire = true; out.beam = 'T'; out.hold = 0.1;
      out.reason = 'spending a T-phase to break your eigenstate camp';
      return out;
    }
    // Otherwise: close to a workable range and charge a real pulse.
    if (d > 420) { out.moveX = foe.x-me.x; out.moveY = foe.y-me.y; }
    else if (d < 150) { out.moveX = me.x-foe.x; out.moveY = me.y-foe.y; }
    else { out.moveX = -(foe.y-me.y); out.moveY = (foe.x-me.x); }   // strafe

    if (me.beamReady) {
      out.fire = true;
      out.beam = axisForAttack(view);
      // Aim for the angle that maximises their charge: a full pi from |0>,
      // less if they are already part-way up. Capped at 0.9s — always charging
      // the full 1.2s pi made the bots fire roughly once every eleven seconds,
      // which is not a duel. (Tuning, not law: the design doc gates these
      // numbers on a playtest, so treat this as a liveness floor.)
      out.hold = Math.min(0.9, 1.2 * (1 - view.foeOdds * 0.6));
      out.reason = `charging a ${out.beam}-beam`;
    }
    return out;
  }

  // Attack on an axis they are NOT parked on, when we have a choice.
  function axisForAttack(view) {
    if (view.foeEigen && view.foeEigen.X && !view.foeEigen.Y) return 'Y';
    return 'X';
  }

  return { LEVELS, levelOf, decide, threatAxis, shouldMeasure, assistedSigma,
           axisForAttack };
})();
if (typeof window !== 'undefined') window.DuelBot = DuelBot;

// MOTION PREFERENCE
// ═══════════════════════════════════════════════════════
// QB-8 — honour prefers-reduced-motion. The duel gates its own particle
// bursts and shake on this; the old board particle pool went with the board.
const REDUCE_MOTION = (typeof window!=='undefined' && window.matchMedia)
  ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;


// RENDERING
// ═══════════════════════════════════════════════════════
const canvas = document.getElementById('game-canvas');
const ctx    = canvas.getContext('2d');
// FE-2 — devicePixelRatio-aware backing store. #game-canvas's CSS size is
// fully controlled by its own width/aspect-ratio rules (decoupled from the
// canvas width/height attributes by `aspect-ratio:1/1`), so scaling the
// backing store up by DPR only adds physical-pixel resolution — it never
// touches layout. Every draw call keeps using BOARD-unit logical coordinates
// (0–800); the ctx transform below maps those onto the higher-res bitmap, so
// nothing downstream of this line needs to know DPR exists.
// REGRESSION TRAP (FE-2): input mapping (the click/mousemove handlers) and
// menuDims() used to derive their CSS↔canvas scale from `canvas.width`, which
// was safe only because canvas.width === BOARD. Now that canvas.width is
// BOARD*DPR (physical), those must scale against BOARD (logical) instead —
// fixed at their call sites below.
const DPR = Math.max(1, window.devicePixelRatio || 1);
function sizeCanvasBackingStore() {
  const rect = canvas.getBoundingClientRect();
  const cssW = rect.width > 0 ? rect.width : BOARD;
  const px = Math.max(1, Math.round(cssW * DPR));
  if (canvas.width !== px) { canvas.width = px; canvas.height = px; }
  const s = px / BOARD;                 // logical 0..BOARD -> physical pixels
  ctx.setTransform(s, 0, 0, s, 0, 0);
}
sizeCanvasBackingStore();
window.addEventListener('resize', sizeCanvasBackingStore);
let   _t     = 0;
// FE-1 — display-contract fix: every per-frame accumulator below advances by
// real elapsed ms (_frameDt) or a 60Hz-equivalent tick count (_frameTicks),
// never a bare per-call constant, so gameplay speed no longer depends on the
// display's refresh rate. Set once per loop() call; clamped so a backgrounded
// tab's huge first-dt-after-return doesn't teleport sprites.
let _frameDt = MS_PER_TICK, _frameTicks = 1, _lastFrameTs = null;

function canvasCssScale() {
  const rect = canvas.getBoundingClientRect();
  return rect.width>0 ? rect.width/BOARD : 1;
}
// Same growth pattern as menuDims(), targeting a ~10 CSS px floor instead of
// a 44px touch target: grows the logical font size just enough that the
// on-screen text never drops below ~10 CSS px, and never shrinks a font
// that's already big enough (Math.max(1, ...) floor, same as menuDims()).
// TY-4 — second arg: the CSS-px floor for this text's tier. Dense canvas
// text (menu rows, cards, overlay prose) renders in the body face with a
// 13px floor to match the DOM's --fs-0; the pixel face survives on canvas
// only for banners (WIN/DRAW headlines), in-world unit glyphs, and FX
// floats. Default floor stays 10 for legacy callers.
const CANVAS_BODY = "'Space Grotesk',sans-serif";
function canvasFontPx(basePx, floorCss = 10) {
  return basePx * Math.max(1, floorCss/(basePx*canvasCssScale()));
}
// Glow behind text this small just smears the edges into mush. Only the
// UN-grown size matters: canvasFontPx() never grows a font past what's
// needed to clear the 10px floor, so if the base size doesn't already clear
// 14 CSS px at the current scale, the grown size won't either.

function roundRect(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

// ═══════════════════════════════════════════════════════
// BLOCH SPHERE
// ═══════════════════════════════════════════════════════
// PD-7 — the sphere renderer, factored out of drawBloch() so the duel HUD
// draws the SAME sphere the campaign panel does (design pillar 1: the sphere
// is the game state, so there must be exactly one of it). Geometry, colors
// and the x/y foreshortening projection are the original drawBloch code
// verbatim; drawBloch now calls this and is pixel-identical to before.
function drawMiniSphere(bx, cx, cy, R, bloch, vecCol, showLabels) {
  const bg=bx.createRadialGradient(cx-12,cy-12,2,cx,cy,R);
  bg.addColorStop(0,'#2a3358'); bg.addColorStop(1,'#0a0f22');
  bx.fillStyle=bg; bx.beginPath(); bx.arc(cx,cy,R,0,2*π); bx.fill();

  bx.strokeStyle='rgba(140,150,200,0.55)'; bx.lineWidth=1;
  bx.beginPath(); bx.arc(cx,cy,R,0,2*π); bx.stroke();
  bx.strokeStyle='rgba(140,150,200,0.30)'; bx.lineWidth=0.7;
  bx.beginPath(); bx.ellipse(cx,cy,R,R*0.27,0,0,2*π); bx.stroke();
  bx.beginPath(); bx.ellipse(cx,cy,R*0.27,R,0,0,2*π); bx.stroke();
  bx.strokeStyle='rgba(140,150,200,0.22)'; bx.lineWidth=0.6;
  bx.beginPath(); bx.moveTo(cx,cy-R+2); bx.lineTo(cx,cy+R-2); bx.stroke();
  bx.beginPath(); bx.moveTo(cx-R+2,cy); bx.lineTo(cx+R-2,cy); bx.stroke();

  if (showLabels !== false) {
    bx.fillStyle='rgba(207,214,238,0.85)'; bx.font=`600 11px ${CANVAS_BODY}`;
    bx.fillText('|0⟩',cx+3,cy-R+10); bx.fillText('|1⟩',cx+3,cy+R-2);
    // X-basis poles (|+⟩ / |−⟩) — the basis a GUARD is measured in, where phase decides the crit.
    bx.fillStyle='rgba(123,213,196,0.9)';
    bx.fillText('|+⟩',cx+R*0.5,cy+10); bx.fillText('|−⟩',cx-R*0.5-18,cy+10);
    // |1⟩ pole glows red — that's full charge (strongest strike).
    bx.fillStyle='#ff5a72'; bx.shadowColor='#ff5a72'; bx.shadowBlur=7;
    bx.beginPath(); bx.arc(cx,cy+R,3,0,2*π); bx.fill(); bx.shadowBlur=0;
  }

  if (!bloch) return;
  // Read the open-system Bloch vector: a coherent state sits on the sphere
  // surface (|r|=1); a decohered (mixed) state contracts inward (|r|<1) — the
  // visible signature of Lindblad relaxation.
  const vx=bloch.x, vy=bloch.y, vz=bloch.z;
  const sx=cx+R*(vx*0.7+vy*0.3);
  const sy=cy-R*vz;

  bx.strokeStyle=vecCol; bx.lineWidth=2;
  bx.shadowColor=vecCol; bx.shadowBlur=10;
  bx.beginPath(); bx.moveTo(cx,cy); bx.lineTo(sx,sy); bx.stroke();
  bx.fillStyle=vecCol;
  bx.beginPath(); bx.arc(sx,sy,3.5,0,2*π); bx.fill();
  bx.shadowBlur=0;
  bx.fillStyle='rgba(255,255,255,0.4)';
  bx.beginPath(); bx.arc(cx,cy,2,0,2*π); bx.fill();
}

document.addEventListener('keydown', e => {
  if (MODE === 'duel') { DUEL.onKey(e, true); return; }
  if (e.key === 'Escape') { closeModal(); }

// The other half of the lifecycle, and it was missing. DUEL.onKey ends with
// `S.keys[k] = down`, but keydown was its ONLY caller — so `down` was
// structurally always true and nothing could ever write false. Hold W, let
// go, and the sim kept reading W as held: the ship accelerated forever.
document.addEventListener('keyup', e => {

window.addEventListener('blur', () => { DUEL.clearInput(); });

const DUEL = (() => {

  // spend the two bands on HUD instead of black bars.
