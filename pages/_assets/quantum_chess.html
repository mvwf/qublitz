  function drawBrief() {
    const M = DuelCore.DUEL_MISSIONS[S.mission];
    ctx.save();
    ctx.fillStyle = 'rgba(5,7,15,0.97)'; ctx.fillRect(0, BAND, BOARD, VIEW_H);
    const x0 = 70, w = BOARD - 140, cx = BOARD / 2; let y = BAND + 46;
    ctx.textAlign = 'center';
    ctx.font = `bold ${canvasFontPx(15, 15)}px 'Press Start 2P',monospace`; ctx.fillStyle = '#f5b73c';
    ctx.fillText(M ? `MISSION ${M.id + 1} · ${M.title}` : 'PHOTON DUEL · BEST OF 3', cx, y); y += 26;
    ctx.font = `600 ${Math.round(BOARD * 0.0175)}px ${CANVAS_BODY}`; ctx.fillStyle = '#2fe0d0';
    ctx.fillText(M ? `Concept: ${M.concept}` : 'Concept: rotations, the Born rule and decoherence', cx, y); y += 26;
    ctx.font = `500 ${Math.round(BOARD * 0.0165)}px ${CANVAS_BODY}`; ctx.fillStyle = '#cfd6ee';
    const body = M ? M.brief
      : 'Both ships carry one qubit, starting in |0⟩. Your beams are drive pulses that ROTATE Sage\'s qubit toward |1⟩. A MEASURE collapses it by the Born rule: it reads |1⟩ (you win the round) with probability P(1). Sage does the same to you, so YOUR qubit is your health: keep it near |0⟩.';
    y = wrapCenteredLines(body, cx, y, w - 40) + 10;
    const rows = M && M.steps ? M.steps.map((st, i) => `${i + 1}. ${st.text}`) : [
      'SHIFT (hold, aim, release): rotate SAGE. Longer hold = bigger angle θ = Ω·t',
      'F (hold, release): rotate YOURSELF. Lowers your risk, or puts you in superposition',
      'SPACE: MEASURE Sage. Wins with probability P(1). A miss resets it to |0⟩',
      'Hotspots: decay pulls a qubit to |0⟩ · E: entangle · ESC: pause / menu',
    ];
    ctx.textAlign = 'left'; ctx.font = `600 ${Math.round(BOARD * 0.016)}px ${CANVAS_BODY}`;
    for (const r of rows) { ctx.fillStyle = '#e8ecff'; y = wrapLeftLines(r, x0 + 30, y, w - 60) + 4; }
    ctx.textAlign = 'center';
    if (M) {
      ctx.font = `600 ${Math.round(BOARD * 0.015)}px ${CANVAS_BODY}`; ctx.fillStyle = '#8f9ac4';
      y += 8;
      ctx.fillText(`${M.drone ? 'Training drone: Sage flies but never shoots.' : 'Live opponent: Sage fights back.'}${M.par ? `   ★ clear · ★★ under ${M.par.s} s · ★★★ also ≤ ${M.par.shots} shots` : ''}`, cx, y);
    }
    ctx.font = `700 ${Math.round(BOARD * 0.02)}px ${CANVAS_BODY}`; ctx.fillStyle = '#ffd166';
    ctx.fillText('▶ SPACE / ENTER / click to start     ·     ESC back', cx, BAND + VIEW_H - 30);
    ctx.restore();
  }
  function wrapLines(txt, maxW) {
    const words = txt.split(' '), out = []; let line = '';
    for (const w of words) { const t = line ? line + ' ' + w : w;
      if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; }
    if (line) out.push(line); return out;
  }
  function wrapCenteredLines(txt, cx, y, maxW) {
    for (const l of wrapLines(txt, maxW)) { ctx.fillText(l, cx, y); y += Math.round(BOARD * 0.024); } return y;
  }
  function wrapLeftLines(txt, x, y, maxW) {
    for (const l of wrapLines(txt, maxW)) { ctx.fillText(l, x, y); y += Math.round(BOARD * 0.023); } return y;
  }

  // First-time concept cards: the physics of a mechanic, once, the moment
  // the player first meets it. Remembered across sessions; off with Coach.
  const LEARN_S = 8;
  const LEARN = {
    hit:     ['YOU ROTATED SAGE\'S QUBIT', 'A beam is a resonant drive pulse. Holding longer gives a bigger angle θ = Ω·t; from |0⟩, P(1) = sin²(θ/2), so a full π-pulse takes it all the way to |1⟩.'],
    self:    ['YOU ROTATED YOUR OWN QUBIT', 'A self-pulse is the same kind of rotation, aimed at you. Use it to bring your P(1) back down (less risk if Sage measures you), or to enter superposition before you entangle.'],
    hurt:    ['SAGE ROTATED YOUR QUBIT', 'Your qubit is your health. Sage\'s MEASURE on you would now hit with probability P(1). Self-pulse back toward |0⟩ or fly into a hotspot, where T₁ decay pulls you down.'],
    dud:     ['MEASURE READ |0⟩', 'The Born rule picked the other outcome. Measuring collapsed the qubit, so it is now exactly |0⟩: one full π-pulse puts it back at |1⟩.'],
    hotspot: ['YOU ENTERED A HOTSPOT', 'This patch of chip is noisy: T₁ = 4 s pulls a qubit toward |0⟩ (safer for you) and T₂ = 2 s scrambles its phase. It drains Sage too, if Sage is in one.'],
    shield:  ['EIGENSTATE: NO EFFECT', 'Sage sits on the axis of your beam. A rotation cannot move a vector that points along its own axis. Switch beam (1/2) or use a T-phase (3).'],
    pickup:  ['POWER-UP', ''],
    linked:  ['YOU ARE ENTANGLED', 'Neither qubit has a state of its own now: one MEASURE collapses both. Whether the outcomes MATCH or are OPPOSITE decides who a miss hurts.'],
  };
  let _seen = null;
  function seen() {
    if (_seen) return _seen;
    try { _seen = new Set(JSON.parse(localStorage.getItem('qb_seen_concepts') || '[]')); } catch (e) { _seen = new Set(); }
    return _seen;
  }
  function learn(id, extraText) {
    if (!GAME.coach || !S.learnQ) return;
    const key = id === 'pickup' ? 'pickup:' + extraText : id;
    if (seen().has(key)) return;
    seen().add(key);
    try { localStorage.setItem('qb_seen_concepts', JSON.stringify([...seen()])); } catch (e) {}
    const [title, text] = LEARN[id];
    const P = id === 'pickup' ? DuelCore.PICKUPS[extraText] : null;
    S.learnQ.push({ title: P ? `POWER-UP: ${P.name}` : title, text: P ? (P.physics || P.effect) : text, t: 0 });
  }
  function drawLearn() {
    const c = S.learnQ && S.learnQ[0]; if (!c || S.briefing || S.paused) return;
    const a = Math.min(1, c.t / 0.25, (LEARN_S - c.t) / 0.6); if (a <= 0) return;
    ctx.save(); ctx.globalAlpha = a;
    ctx.font = `500 ${Math.round(BOARD * 0.0145)}px ${CANVAS_BODY}`;
    const W = 330, lines = wrapLines(c.text, W - 24), H = 30 + lines.length * 17;
    const x0 = BOARD - 14 - W, y0 = BAND + VIEW_H - 42 - H;
    ctx.fillStyle = 'rgba(12,18,38,0.94)'; roundRect(x0, y0, W, H, 7); ctx.fill();
    ctx.strokeStyle = '#2fe0d0'; ctx.lineWidth = 1; roundRect(x0, y0, W, H, 7); ctx.stroke();
    ctx.font = `700 ${Math.round(BOARD * 0.015)}px ${CANVAS_BODY}`; ctx.fillStyle = '#2fe0d0';
    ctx.fillText('WHAT JUST HAPPENED · ' + c.title, x0 + 12, y0 + 18);
    ctx.font = `500 ${Math.round(BOARD * 0.0145)}px ${CANVAS_BODY}`; ctx.fillStyle = '#e8ecff';
    lines.forEach((l, i) => ctx.fillText(l, x0 + 12, y0 + 36 + i * 17));
    ctx.restore();
  }

  // Tiny word-wrapper for the mission brief (the one place duel HUD has prose).
  function wrapHud(txt, x, y, maxW, col) {
    ctx.font = `500 ${Math.round(BOARD * 0.0155)}px ${CANVAS_BODY}`;
    ctx.fillStyle = col;
    const words = txt.split(' ');
    let line = '', ly = y;
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) {
        ctx.fillText(line, x, ly); line = w; ly += Math.round(BOARD * 0.021);
      } else line = test;
    }
    if (line) ctx.fillText(line, x, ly);
  }

  function hudText(txt, x, y, col) {
    ctx.font = `600 ${Math.round(BOARD * 0.0163)}px ${CANVAS_BODY}`;
    ctx.fillStyle = col || '#aeb8e6';
    ctx.fillText(txt, x, y);
  }

  function drawAnnouncer() {
    if (S.briefing || S.paused) return;
    let label = '';
    if (S.introT > 0) {
      const beat = S.introT > 1.7 ? 'SYNC 3' : S.introT > 1.0 ? 'SYNC 2' : S.introT > 0.35 ? 'SYNC 1' : 'DUEL!';
      const mission = DuelCore.DUEL_MISSIONS[S.mission];
      label = mission ? `${beat} · MISSION ${mission.id + 1}` : `${beat} · PHOTON DUEL`;
    } else if (S.announceT > 0) label = S.announcer;
    if (!label) return;
    const alpha = S.introT > 0 ? 0.92 : Math.min(1, S.announceT * 1.5);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.fillStyle = 'rgba(5,7,15,.82)';
    const ay = BAND + 18 + stepsOffset();
    roundRect(190, ay, BOARD - 380, 42, 8); ctx.fill();
    ctx.strokeStyle = '#8b7dff'; ctx.lineWidth = 1;
    roundRect(190, ay, BOARD - 380, 42, 8); ctx.stroke();
    ctx.textAlign = 'center';
    ctx.font = `bold ${canvasFontPx(15, 15)}px 'Press Start 2P',monospace`;
    ctx.fillStyle = '#ffffff';
    ctx.fillText(label, BOARD / 2, ay + 27);
    ctx.restore();
  }

  // The debrief card: what won, the concept it demonstrates, one tip. Three
  // lines is the cap — this is a takeaway, not a report.
  function drawDebrief() {
    const won = S.round.winner === 0;
    const MM = DuelCore.DUEL_MISSIONS[S.mission];
    const over = matchOver();
    ctx.fillStyle = 'rgba(5,7,15,0.86)';
    ctx.fillRect(0, BAND, BOARD, VIEW_H);

    const cx = BOARD / 2, cw = BOARD - 150;
    const cy = BAND + 40;
    ctx.fillStyle = 'rgba(12,18,38,0.96)';
    roundRect(75, cy, cw, VIEW_H - 90, 8); ctx.fill();
    ctx.strokeStyle = won ? 'rgba(63,224,138,0.5)' : 'rgba(255,90,114,0.45)';
    ctx.lineWidth = 2;
    roundRect(75, cy, cw, VIEW_H - 90, 8); ctx.stroke();

    ctx.textAlign = 'center';
    ctx.font = `bold ${canvasFontPx(17, 17)}px 'Press Start 2P',monospace`;
    ctx.fillStyle = won ? '#3fe08a' : '#ff5a72';
    const title = MM ? (won ? 'MISSION CLEAR' : 'MISSION FAILED')
                     : (over ? (S.match.you > S.match.them ? 'MATCH WON' : 'MATCH LOST')
                             : (won ? 'ROUND WON' : 'ROUND LOST'));
    ctx.fillText(title, cx, cy + 42);
    if (MM && won && S.missionStars) {
      ctx.font = `bold ${canvasFontPx(22, 22)}px 'Space Grotesk',sans-serif`;
      const n = S.missionStars, sw = 30;
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = i < n ? '#ffd166' : '#3a4166';
        ctx.fillText('★', cx + (i - 1) * sw, cy + 74);
      }
    }

    // Best-of-3 pips
    if (!MM) {
      ctx.font = `600 ${Math.round(BOARD * 0.019)}px 'Rajdhani','Space Grotesk',sans-serif`;
      ctx.fillStyle = '#aeb8e6';
      ctx.fillText(`YOU ${S.match.you}  —  ${S.match.them} SAGE   ·   best of 3`, cx, cy + 72);
    }

    // Preserve the three-line learning takeaway; records/mastery are a
    // separate replay layer below it, never a replacement for the physics.
    const lines = MM && won ? [MM.win].concat((S.debrief || []).slice(1)) : (S.debrief || []);
    ctx.font = `500 ${Math.round(BOARD * 0.0175)}px ${CANVAS_BODY}`;
    lines.forEach((ln, i) => {
      ctx.fillStyle = i === 1 ? '#2fe0d0' : '#cfd6ee';
      wrapCentered(ln, cx, cy + 104 + i * 40, cw - 70);
    });

    const progress = S.progress || { newRecords:[], earnedBadges:[] };
    const earnedTitles = progress.earnedBadges.map(id =>
      (DuelProgress.BADGES.find(b => b.id === id) || {}).title).filter(Boolean);
    const nextBadge = DuelProgress.nextBadge(GAME.duelProfile);
    const mastered = GAME.duelProfile.badges.length;
    const conciseRecords = progress.newRecords.map(label => label.replace(/^MISSION \d+ /, ''));
    const recordLine = conciseRecords.length
      ? `NEW RECORD${conciseRecords.length > 1 ? 'S' : ''} · ${conciseRecords.join(' · ')}`
      : MM ? `MISSION RECORD · ${missionRecordText(S.mission)}`
           : `FREE DUEL · ${GAME.duelProfile.free.wins}W ${GAME.duelProfile.free.losses}L · STREAK ${GAME.duelProfile.free.streak}`;
    ctx.font = `700 ${Math.round(BOARD * 0.0145)}px ${CANVAS_BODY}`;
    ctx.fillStyle = progress.newRecords.length ? '#f5b73c' : '#8f9ac4';
    wrapCentered(recordLine, cx, cy + 242, cw - 72);
    ctx.fillStyle = earnedTitles.length ? '#c97bff' : '#8f9ac4';
    wrapCentered(earnedTitles.length
      ? `MASTERY EARNED · ${earnedTitles.join(' · ')}`
      : `QUANTUM MASTERY · ${mastered}/${DuelProgress.BADGES.length} BADGES`,
      cx, cy + 270, cw - 72);
    if (nextBadge) {
      ctx.font = `500 ${Math.round(BOARD * 0.014)}px ${CANVAS_BODY}`;
      ctx.fillStyle = '#aeb8e6';
      wrapCentered(`NEXT CHALLENGE · ${nextBadge.requirement}`, cx, cy + 298, cw - 90);
    }

    const nextMission = MM && won ? nextTrainingMission(S.mission) : null;
    const forward = (MM && won && nextMission != null) || !MM;
    ctx.font = `${forward ? 700 : 500} ${Math.round(BOARD * (forward ? 0.019 : 0.016))}px ${CANVAS_BODY}`;
    ctx.fillStyle = forward ? '#ffd166' : '#6f79a8';
    const action = MM
      ? (won && nextMission != null
          ? `▶ ENTER / A: NEXT MISSION ${nextMission + 1}  ·  R replay  ·  ESC training`
          : `${won ? 'ALL TRAINING CLEARED' : 'ENTER / A retry'}  ·  R / X replay  ·  ESC / MENU training`)
      : (over ? '▶ SPACE / A: REMATCH  ·  ESC menu' : `▶ SPACE / A: ROUND ${S.match.no + 1} OF 3  ·  ESC menu`);
    wrapCentered(action, cx, cy + VIEW_H - 122, cw - 38);
    ctx.textAlign = 'left';
  }

  function wrapCentered(txt, cx, y, maxW) {
    const words = txt.split(' ');
    let line = '', ly = y;
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx.measureText(test).width > maxW && line) {
        ctx.fillText(line, cx, ly); line = w; ly += Math.round(BOARD * 0.023);
      } else line = test;
    }
    if (line) ctx.fillText(line, cx, ly);
  }

  function banner(title, sub, sub2) {
    ctx.fillStyle = 'rgba(5,7,15,0.72)';
    ctx.fillRect(0, BAND, BOARD, VIEW_H);
    ctx.textAlign = 'center';
    ctx.font = `bold ${canvasFontPx(20, 17)}px 'Press Start 2P',monospace`;
    ctx.fillStyle = '#8b7dff';
    ctx.fillText(title, BOARD / 2, BOARD * 0.46);
    ctx.font = `600 ${Math.round(BOARD * 0.019)}px ${CANVAS_BODY}`;
    ctx.fillStyle = '#cfd6ee';
    ctx.fillText(sub, BOARD / 2, BOARD * 0.52);
    if (sub2) {
      ctx.font = `500 ${Math.round(BOARD * 0.017)}px ${CANVAS_BODY}`;
      ctx.fillStyle = '#8f9ac4';
      ctx.fillText(sub2, BOARD / 2, BOARD * 0.57);
    }
    ctx.textAlign = 'left';
  }

  // ── Input ────────────────────────────────────────────────────────────
  const BEAM_ORDER = ['X','Y','T'];
  let gamepadProvider = () => {
    try { return (typeof navigator !== 'undefined' && navigator.getGamepads) ? navigator.getGamepads() : []; }
    catch (e) { return []; }
  };

  function updateContinuousActions() {
    const kb = DUEL_CONTROLS.keyboard.keys;
    let mx = S.gamepad.move.x, my = S.gamepad.move.y;
    if (S.keys[kb.left]) mx -= 1;
    if (S.keys[kb.right]) mx += 1;
    if (S.keys[kb.up]) my -= 1;
    if (S.keys[kb.down]) my += 1;
    S.actions.move = {x:mx,y:my};

    let ax = 0, ay = 0;
    if (S.keys[kb.aimLeft]) ax -= 1;
    if (S.keys[kb.aimRight]) ax += 1;
    if (S.keys[kb.aimUp]) ay -= 1;
    if (S.keys[kb.aimDown]) ay += 1;
    if (ax || ay) {
      const m = Math.hypot(ax, ay);
      S.actions.aim = {x:ax/m,y:ay/m,active:true};
      S.inputDevice = 'KEYBOARD';
    } else if (S.gamepad.aim.active) {
      S.actions.aim = {x:S.gamepad.aim.x,y:S.gamepad.aim.y,active:true};
      S.inputDevice = 'GAMEPAD';
    } else S.actions.aim = {x:0,y:0,active:false};
  }

  function selectBeam(beam) {
    if (!DuelCore.BEAMS[beam]) return false;
    S.beam = beam;
    beep(520, 'triangle', 0.05, 0.10);
    return true;
  }
  function cycleBeam(delta) {
    const at = Math.max(0, BEAM_ORDER.indexOf(S.beam));
    selectBeam(BEAM_ORDER[(at + delta + BEAM_ORDER.length) % BEAM_ORDER.length]);
  }
  function beginCharge(kind, source) {
    if (MODE !== 'duel' || S.paused || S.over || S.hitStop > 0 || S.charging || !S.ships[0]) return false;
    ac();
    S.charging = true; S.chargeT = 0;
    S.selfAim = kind === 'self'; S.chargeSource = source;
    S.inputDevice = source.startsWith('gamepad') ? 'GAMEPAD' : source.startsWith('keyboard') ? 'KEYBOARD' : 'POINTER';
    return true;
  }
  function releaseCharge(source) {
    if (!S.charging || S.chargeSource !== source) return false;
    const theta = DuelCore.driveTheta(S.chargeT, S.ships[0] ? rabiMult(S.ships[0]) : 1);
    const self = S.selfAim;
    S.charging = false; S.chargeT = 0; S.selfAim = false; S.chargeSource = null;
    const me = S.ships[0];
    if (!S.paused && !S.over && !(S.hitStop > 0) && me && me.beamCd === 0) {
      if (self) selfPulse(me, theta, S.beam); else fireBeam(me, theta, S.beam);
      return true;
    }
    return false;
  }
  function cancelCharge() {
    S.charging = false; S.chargeT = 0; S.selfAim = false; S.chargeSource = null;
  }
  function beginMeasure() {
    if (S.paused || S.over) return false;
    const me = S.ships[0];
    if (S.hitStop > 0) return false;
    if (!me || me.measCd !== 0 || me.winding !== 0) return false;
    windMeasure(me);
    return true;
  }
  function launchEntangle() {
    if (S.paused || S.over) return false;
    const me = S.ships[0];
    if (S.hitStop > 0 || !me || S.bell || (me.entCd || 0) > 0) return false;
    const q = take(S.proj); if (!q) return false;
    q.live = true; q.kind = 'entangle'; q.owner = 0; q.ttl = 4;
    q.x = me.x + Math.cos(me.ang) * K.SHIP_R;
    q.y = me.y + Math.sin(me.ang) * K.SHIP_R;
    q.vx = Math.cos(me.ang) * 520; q.vy = Math.sin(me.ang) * 520;
    me.entCd = 12;
    sweep(300, 700, 0.2, 'sine', 0.14);
    return true;
  }
  function pauseOrExit() {
    if (S.over) { exitDuel(S.mission >= 0); return; }
    if (S.briefing) { exitDuel(S.mission >= 0); return; }
    S.paused = !S.paused;
    clearInput();
    announceA11y(S.paused ? 'Photon Duel paused.' : 'Photon Duel resumed.');
  }
  function replayRound() { if (S.over) start(S.seed, S.mission); }
  function quitToMenu() { S.paused = false; clearInput(); exitDuel(S.mission >= 0); }
  function restartFromPause() { S.paused = false; clearInput(); start(undefined, S.mission); }
  function beginFromBrief() { if (!S.briefing) return false; S.briefing = false; clearInput(); ac(); return true; }
  // Pause-menu buttons, in canvas coordinates (drawn by drawPauseMenu).
  const PAUSE_BTNS = [
    { id: 'resume',  label: 'RESUME',          key: 'ESC' },
    { id: 'restart', label: 'RESTART',         key: 'R' },
    { id: 'quit',    label: 'QUIT TO MENU',    key: 'Q' },
  ];
  const pauseBtnRect = i => ({ x: BOARD / 2 - 130, y: BOARD * 0.5 + i * 44, w: 260, h: 34 });
  function confirmDebrief() {
    if (!S.over) return;
    if (S.mission >= 0) {
      const next = S.round.winner === 0 ? nextTrainingMission(S.mission) : null;
      const nm = next == null ? S.mission : next;
      start(undefined, nm, false, { brief: nm !== S.mission });
    } else nextRound();
  }

  function onKey(e, down) {
    if (MODE !== 'duel') return;
    const k = e.key.toLowerCase();
    const kb = DUEL_CONTROLS.keyboard.keys;
    const wasDown = !!S.keys[k];
    S.keys[k] = down;
    const pressed = down && !wasDown;
    if (pressed) S.inputDevice = 'KEYBOARD';
    if (pressed && k === kb.pause) { pauseOrExit(); e.preventDefault(); return; }
    if (S.briefing) {
      if (pressed && (k === kb.measure || k === kb.confirm)) { beginFromBrief(); e.preventDefault(); }
      return;
    }
    if (S.paused && pressed) {
      if (k === 'q') { quitToMenu(); e.preventDefault(); return; }
      if (k === kb.replay) { restartFromPause(); e.preventDefault(); return; }
    }
    if (pressed && k === kb.replay && S.over) { replayRound(); e.preventDefault(); return; }
    if (pressed && (k === kb.measure || k === kb.confirm) && S.over) { confirmDebrief(); e.preventDefault(); return; }
    // Beam select — 1 X (attack), 2 Y (attack), 3 T (phase, scarce).
    if (pressed && (k === kb.beamX || k === kb.beamY || k === kb.beamT)) {
      selectBeam({ [kb.beamX]:'X', [kb.beamY]:'Y', [kb.beamT]:'T' }[k]); e.preventDefault(); return;
    }
    if (pressed && k === kb.entangle) { launchEntangle(); e.preventDefault(); return; }
    if (k === kb.measure) {
      if (pressed) beginMeasure();
      e.preventDefault(); return;
    }
    if (k === kb.attack) {
      if (pressed) beginCharge('attack', 'keyboard-attack');
      else if (!down) releaseCharge('keyboard-attack');
      e.preventDefault(); return;
    }
    if (k === kb.selfPulse) {
      if (pressed) beginCharge('self', 'keyboard-self');
      else if (!down) releaseCharge('keyboard-self');
      e.preventDefault(); return;
    }
    if ([kb.up,kb.left,kb.down,kb.right,kb.aimUp,kb.aimLeft,kb.aimDown,kb.aimRight].includes(k))
      e.preventDefault();
  }

  // Held action state must not outlive its device or focus. Cancellation is
  // deliberately not a synthetic release: blur/disconnect must never fire a
  // charged beam the player did not intentionally release.
  function clearInput() {
    for (const k in S.keys) S.keys[k] = false;
    S.gamepad.move = {x:0,y:0,active:false};
    S.gamepad.aim = {x:0,y:0,active:false};
    S.actions.move = {x:0,y:0}; S.actions.aim = {x:0,y:0,active:false};
    S.gamepad.buttons = null;
    cancelCharge();
  }

  function onGamepadConnected(pad) {
    if (!pad || pad.mapping !== 'standard') {
      announceA11y('A controller connected, but it does not expose the standard browser mapping.');
      return;
    }
    announceA11y('Standard controller connected. Left stick moves, right stick aims, triggers charge pulses.');
  }
  function onGamepadDisconnected(pad) {
    const idx = pad && Number.isInteger(pad.index) ? pad.index : S.gamepad.index;
    if (S.gamepad.index == null || idx === S.gamepad.index) {
      clearInput();
      S.gamepad.index = null; S.gamepad.id = '';
      announceA11y('Controller disconnected. Held controller actions were cleared.');
    }
  }
  function setGamepadProvider(provider) {
    gamepadProvider = typeof provider === 'function' ? provider : () => [];
    onGamepadDisconnected({ index:S.gamepad.index });
  }
  function pollGamepad() {
    let pads = [];
    try { pads = Array.from(gamepadProvider() || []); } catch (e) { pads = []; }
    const pad = pads.find(p => p && p.connected !== false && p.mapping === 'standard');
    if (!pad) {
      if (S.gamepad.index != null) onGamepadDisconnected({ index:S.gamepad.index });
      return;
    }
    const fresh = S.gamepad.index !== pad.index || !Array.isArray(S.gamepad.buttons);
    const f = DuelInput.gamepadFrame(pad, fresh ? null : S.gamepad.buttons);
    if (!f) return;
    S.gamepad.index = f.index; S.gamepad.id = f.id;
    S.gamepad.move = f.move; S.gamepad.aim = f.aim;
    if (fresh) {
      S.gamepad.buttons = f.buttons;
      onGamepadConnected(pad);
      return; // baseline held buttons: reconnect never replays an old action
    }
    if (f.anyActive || f.move.active || f.aim.active) S.inputDevice = 'GAMEPAD';
    if (S.briefing) {
      if (f.confirmPressed) beginFromBrief();
      else if (f.pausePressed) pauseOrExit();
    } else if (S.paused) {
      if (f.pausePressed || f.confirmPressed) pauseOrExit();
      else if (f.quitPressed) quitToMenu();
      else if (f.replayPressed) restartFromPause();
    } else if (S.over) {
      if (f.replayPressed) replayRound();
      else if (f.confirmPressed) confirmDebrief();
      else if (f.pausePressed) pauseOrExit();
    } else {
      if (f.pausePressed) pauseOrExit();
      if (f.beamDirect) selectBeam(f.beamDirect);
      else if (f.beamPrevPressed) cycleBeam(-1);
      else if (f.beamNextPressed) cycleBeam(1);
      if (f.measurePressed) beginMeasure();
      if (f.entanglePressed) launchEntangle();
      if (f.attackPressed) beginCharge('attack', 'gamepad-attack');
      if (f.attackReleased) releaseCharge('gamepad-attack');
      if (f.selfPressed) beginCharge('self', 'gamepad-self');
      if (f.selfReleased) releaseCharge('gamepad-self');
    }
    S.gamepad.buttons = f.buttons;
  }

  function onMouseMove(e) {
    if (MODE !== 'duel') return;
    const rect = canvas.getBoundingClientRect();
    const cx = (e.clientX - rect.left) * (BOARD / rect.width);
    const cy = (e.clientY - rect.top) * (BOARD / rect.height);
    S.aim.x = cx / SCALE;
    S.aim.y = (cy - BAND) / SCALE;
    S.actions.aim = {x:0,y:0,active:false};
    S.inputDevice = 'POINTER';
  }
  function onMouseDown(e) {
    if (MODE !== 'duel' || (e.button !== 0 && e.button !== 2)) return;
    if (S.briefing) { beginFromBrief(); e.preventDefault(); return; }
    if (S.paused && e.button === 0) {
      const r = canvas.getBoundingClientRect();
      const x = (e.clientX - r.left) * BOARD / r.width, y = (e.clientY - r.top) * BOARD / r.height;
      PAUSE_BTNS.forEach((b, i) => { const q = pauseBtnRect(i);
        if (x >= q.x && x <= q.x + q.w && y >= q.y && y <= q.y + q.h)
          (b.id === 'resume' ? pauseOrExit : b.id === 'restart' ? restartFromPause : quitToMenu)(); });
      e.preventDefault(); return;
    }
    beginCharge(e.button === 2 ? 'self' : 'attack', `pointer-${e.button}`);
    e.preventDefault();
  }
  function onMouseUp(e) {
    if (MODE !== 'duel') return;
    if (releaseCharge(`pointer-${e.button}`)) e.preventDefault();
  }

  return { start, stop, frame, onKey, clearKeys:clearInput, clearInput,
           onMouseMove, onMouseDown, onMouseUp, onGamepadConnected, onGamepadDisconnected,
           setGamepadProvider, pollGamepad,
           state: S, triggerFx, p95, coachHint, telemetry: () => S.tele.slice(),
           togglePerf: () => (S.showPerf = !S.showPerf) };
})();

// PD-1 — mode seams. Kept tiny and outside the DUEL closure so the D1
// landing screen (PD-26) can call them directly.
function startDuel(seed, mission, opts) {
  closeModal();
  MODE = 'duel';
  document.body.classList.add('duel-mode');
  sizeCanvasBackingStore();
  DUEL.start(seed, mission, false, opts);
}
function exitDuel(toMissions) {
  MODE = 'story';
  document.body.classList.remove('duel-mode');
  sizeCanvasBackingStore();
  DUEL.stop();
  if (toMissions) openDuelMissions(); else openMenu();
}

// The mission list — the campaign's TRAINING PROGRAMS screen, rebuilt for
// the duel. Each row names the concept its gate enforces, so a student can
// see the syllabus rather than infer it.
// ═══════════════════════════════════════════════════════
// HUB — the home screen
// ═══════════════════════════════════════════════════════
// QuBlitz is one focused duel game with two ways in: competitive free play
// and a seven-mission training path. Learning/export utilities support those
// experiences; they are deliberately not presented as additional games.
function closeModal() {
  const o = document.getElementById('modal-overlay');
  if (o) o.classList.remove('show');
}

function openMenu() {
  const cleared = (GAME.duelDone || []).length;
  const total = DuelCore.DUEL_MISSIONS.length;
  const next = nextTrainingMission();
  document.getElementById('modal-content').innerHTML = `
<h2>◈ QUBLITZ ◈</h2>
<p style="text-align:center;color:var(--dim);font-size:var(--fs-0);margin:-10px 0 16px">
  One arena. Real qubit physics. Choose your fight.</p>

<div class="mode-grid" aria-label="Choose how to play">
  <button class="mode-card" data-play-mode="photon-duel" onclick="startDuel(undefined, undefined, {brief:true})">
    <span class="mode-kicker">COMPETITIVE · BEST OF 3</span>
    <strong>⚡ PHOTON DUEL</strong>
    <span class="mode-copy">Rotate Sage's qubit toward |1⟩ with pulse beams, then MEASURE it before they measure you. The coach tells you the best shot and why.</span>
    <span class="mode-status">PLAY FREE DUEL →</span>
  </button>
  <button class="mode-card training" data-play-mode="duel-training" onclick="openDuelMissions()">
    <span class="mode-kicker">${cleared === 0 ? 'NEW? START HERE · ' : ''}GUIDED · ${total} CONCEPT MISSIONS</span>

function loop(ts) {
  // FE-1 — real elapsed time so every accumulator advances at wall-clock
  // rate regardless of display refresh rate.
  if (ts == null) ts = performance.now();
  if (_lastFrameTs == null) _lastFrameTs = ts;
  const rawDt = ts - _lastFrameTs;
  _lastFrameTs = ts;
  _frameDt = rawDt > 0 ? Math.min(50, rawDt) : MS_PER_TICK;
  _frameTicks = _frameDt / MS_PER_TICK;
  _t += _frameTicks;

  // A throw inside the duel used to take the rAF chain with it and freeze the
  // whole game. Log the first failure and keep the loop alive.
  try {
    if (MODE === 'duel') DUEL.frame(ts);
    else ctx.clearRect(0, 0, BOARD, BOARD);   // menus render over an empty board
  } catch (err) {
    if (!loop._warned) { loop._warned = true; console.error('[qublitz] frame error', err); }
  }

  requestAnimationFrame(loop);
}

// EV-2 — CONSENT-GATED TELEMETRY EXPORT
// ═══════════════════════════════════════════════════════
// A student-initiated local file download, never an automatic network
// transmission (there is no network call anywhere in this file — see
// docs/DATA_AND_CONSENT.md, GOV-2). Contains only gate-log counts,
// mission-outcome data, and anonymous personal-bests already stored in
// localStorage — no name, no email, no IP, nothing identifying. The
// student hands the resulting JSON file to their instructor themselves;
// this game never sees where it goes after the browser writes it to disk.
const GATE_LOG_EXPORT_SCHEMA_VERSION = 4;   // v4 adds per-mission records + mastery; v3 duel telemetry

function buildGateLogExport() {
  return {
    schemaVersion: GATE_LOG_EXPORT_SCHEMA_VERSION,
    exportedAt: new Date().toISOString(),
    // Per-gate application counts this session (resets on page reload —
    // GAME.gateCounts is in-memory only, never persisted).
    gateLog: { ...GAME.gateCounts },
    combat: {
      hitsLanded: GAME.hitsLanded || 0,
      critCount: GAME.critCount || 0,
      entanglCount: GAME.entanglCount || 0,
      guardAttacksFaced: GAME.guardStats ? GAME.guardStats.attacksOnGuarding : 0,
      guardCritsTaken: GAME.guardStats ? GAME.guardStats.critsOnGuarding : 0,
    },
    // Which duel concept-missions have been cleared on this device. Each carries the concept its gate
    // enforced, so the export says what was demonstrated, not just what was
    // finished — that is the North-Star evidence, per OVERHAUL_PLAN P6.5.
    missions: {
      clearedIndices: GAME.duelDone || [],
      clearedConcepts: (GAME.duelDone || [])
        .map(i => DuelCore.DUEL_MISSIONS[i] && DuelCore.DUEL_MISSIONS[i].concept)
        .filter(Boolean),
      totalMissions: DuelCore.DUEL_MISSIONS.length,
    },
    // EV-1's in-game 3-question transfer check, if the (off-by-default)
    // toggle was enabled and the student chose to answer. Empty array if
    // never enabled or always skipped -- never inferred, never required.
    evQuiz: GAME.evQuizResults || [],
    // PD-11 — Photon Duel funnel events (design doc §8 items 1-4:
    // duel_load, first_shot, first_sphere_read, round_end). Same local-only
    // path as everything else here: no third-party analytics, nothing sent
    // anywhere. Empty array if the duel was never opened this session.
    duelTelemetry: (typeof DUEL !== 'undefined') ? DUEL.telemetry() : [],
    // Anonymous local records and mastery — no identity, account, or network
    // leaderboard. Included so one student-initiated export remains complete.
    duelProfile: loadDuelProfile(),
  };
}

function exportGateLog() {
  const data = buildGateLogExport();
  const json = JSON.stringify(data, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `qublitz-gate-log-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  logEv('Gate log exported — check your downloads folder. Nothing was sent anywhere; this is a local file only.', 'system');
}

// ═══════════════════════════════════════════════════════
// BACKGROUND PARTICLE SYSTEM
// ═══════════════════════════════════════════════════════
const bgCanvas=document.getElementById('bg-canvas');
const bgCtx=bgCanvas.getContext('2d');
// A living pixel-street scene behind the board (Oravec-style): drifting glow
// blobs for depth, then NPC pedestrians and cars walking/driving across, plus a
// faint scrolling tile-grid "ground".
let bgParts=[];

const BG_HUES = ['139,125,255','47,224,208','255,77,157','245,183,60','120,150,255'];
const _r=(a,b)=>a+Math.random()*(b-a);

// BE-3 — pre-render each blob's radial gradient ONCE to a small offscreen
// canvas at full strength (alpha 1 at center -> 0 at edge); animateBg()
// then just drawImage()s it and modulates the per-frame pulsing brightness
// via ctx.globalAlpha. This replaces 5 createRadialGradient allocations
// per frame (a measured, permanent cost on every visitor's laptop) with 5
// drawImage calls — same visual result, since createRadialGradient's stops
// were always `rgba(col,o)`->`rgba(col,0)`, a pure per-frame alpha scale of
// this exact shape.
function makeBlobSprite(col, r) {
  const c = document.createElement('canvas');
  const size = Math.ceil(r*2);
  c.width = size; c.height = size;
  const bctx = c.getContext('2d');
  const g = bctx.createRadialGradient(r,r,0,r,r,r);
  g.addColorStop(0, `rgba(${col},1)`); g.addColorStop(1, `rgba(${col},0)`);
  bctx.fillStyle = g;
  bctx.beginPath(); bctx.arc(r,r,r,0,π*2); bctx.fill();
  return c;
}

function initBg() {
  // FE-2 — same DPR treatment as the game canvas: size the backing store in
  // physical pixels, keep every draw call in logical (window.innerWidth/
  // innerHeight) coordinates via the ctx transform. Setting .width/.height
  // resets the transform to identity, so setTransform must run after.
  const dpr = window.devicePixelRatio || 1;
  const W=window.innerWidth, H=window.innerHeight;
  bgCanvas.width  = Math.round(W*dpr);
  bgCanvas.height = Math.round(H*dpr);
  bgCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  bgParts=[];
  for (let i=0;i<5;i++) {
    const r = _r(160,320), col = BG_HUES[i%BG_HUES.length];
    bgParts.push({
      x:_r(0,W), y:_r(0,H), r,
      vx:_r(-0.06,0.06), vy:_r(-0.06,0.06),
      phase:_r(0,π*2), freq:_r(0.0006,0.0016),
      col, op:_r(0.04,0.08), sprite: makeBlobSprite(col, r),
    });
  }
}

// BE-3 — the base linear gradient was also being rebuilt every frame even
// though it only ever depends on viewport height, which changes on resize,
// not per-frame. Cached and invalidated by initBg() (called on resize).
let _bgBaseGradient = null, _bgBaseH = 0;
function bgBaseGradient(H) {
  if (_bgBaseGradient && _bgBaseH === H) return _bgBaseGradient;
  _bgBaseH = H;
  const g = bgCtx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#070a16'); g.addColorStop(0.5,'#0a0f22'); g.addColorStop(1,'#070a16');
  _bgBaseGradient = g;
  return g;
}

// BE-3 — true while this backdrop is fully hidden behind the boot screen or
// a modal: the board isn't visible either way, so the per-frame draw work
// (gradient fill + 5 blobs + ~330 lattice rects) is pure waste until then.
function bgCovered() {
  return !_bootFinished || document.getElementById('modal-overlay')?.classList.contains('show');
}

let _bgLastTs = null;
function animateBg(ts) {
  // BE-3 — a hidden tab still receives throttled rAF callbacks in most
  // browsers rather than none at all; drop the chain entirely instead of
  // just skipping the draw, so a backgrounded tab costs strictly 0, not
  // "0 work at ~1fps." Resumed by the visibilitychange listener below.
  if (document.hidden) return;

  if (!bgCovered()) {
    // FE-1 — same fix as the main loop: the blob drift below (p.vx/p.vy) was a
    // bare per-frame constant, so it drifted twice as fast at 120Hz. The
    // sine/cosine wobble already used wall-clock time (t) and didn't need this.
    if (ts == null) ts = performance.now();
    if (_bgLastTs == null) _bgLastTs = ts;
    const rawDt = ts - _bgLastTs;
    _bgLastTs = ts;
    const ticks = (rawDt > 0 ? Math.min(50, rawDt) : MS_PER_TICK) / MS_PER_TICK;

    const W=window.innerWidth, H=window.innerHeight;  // logical — see initBg's DPR note
    bgCtx.clearRect(0,0,W,H);
    const t=Date.now()*0.001;

    // Quantum-field ambiance: a deep navy base with drifting glow blobs and a
    // faint lattice — the atmospheric backdrop for the arena (no RPG biome art).
    bgCtx.fillStyle=bgBaseGradient(H); bgCtx.fillRect(0,0,W,H);

    // Soft drifting glow blobs for depth.
    bgParts.forEach(p=>{
      p.x+=(p.vx+Math.sin(t*p.freq*2+p.phase)*0.15)*ticks;
      p.y+=(p.vy+Math.cos(t*p.freq*1.7+p.phase)*0.15)*ticks;
      if(p.x<-p.r)p.x=W+p.r; if(p.x>W+p.r)p.x=-p.r;
      if(p.y<-p.r)p.y=H+p.r; if(p.y>H+p.r)p.y=-p.r;
      const o=p.op*(0.7+0.3*Math.sin(t*p.freq*4+p.phase));
      bgCtx.globalAlpha = o;
      bgCtx.drawImage(p.sprite, p.x-p.r, p.y-p.r);
      bgCtx.globalAlpha = 1;
    });

    // Faint far lattice — a slowly drifting grid of dim nodes, evoking a qubit array.
    const sp=64, off=(t*4)%sp;
    bgCtx.fillStyle='rgba(124,140,230,0.05)';
    for (let x=-sp+off; x<W+sp; x+=sp) for (let y=-sp+off; y<H+sp; y+=sp) {
      bgCtx.fillRect(x, y, 1.4, 1.4);
    }
  }

  // BE-3 — reduced motion means exactly one frame, ever; never reschedule.
  if (REDUCE_MOTION) return;
  requestAnimationFrame(animateBg);
}

// BE-3 — tab hidden -> animateBg's next call sees document.hidden and drops
// the chain (above); tab visible again -> restart it here. _bgLastTs is
// reset so the dt calc doesn't treat the hidden interval as one giant
// simulated jump (falls back to MS_PER_TICK for exactly one frame instead).
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !REDUCE_MOTION) {
    _bgLastTs = null;
    requestAnimationFrame(animateBg);
  }
});

window.addEventListener('resize',()=>{
  initBg();
  _sageBarHCache = 0;  // SM-2 — canvasCssScale changed; menuPos re-measures
  // Under reduced motion there's no running rAF chain (animateBg returns
  // after its one frame and never reschedules) — redraw once at the new
  // size directly. Otherwise the already-running chain picks up the new
  // size on its own very next frame; calling animateBg() here too would
  // start a second, parallel self-perpetuating rAF chain.
  if (REDUCE_MOTION) animateBg();
});

// ═══════════════════════════════════════════════════════
// BOOT SEQUENCE
// ═══════════════════════════════════════════════════════
let _bootTimeout=null;
let _bootFinished=false;

function finishBoot() {
  if (_bootFinished) return;
  _bootFinished=true;
  clearTimeout(_bootTimeout);
  const boot=document.getElementById('boot');
  boot.classList.add('fade-out');
  setTimeout(()=>{ boot.style.display='none'; },700);
  loop();
  // The duel is the product now: ?mode=duel drops straight into a free duel,
  // anything else opens the hub.
  let _wantDuel = false;
  try { _wantDuel = new URLSearchParams(location.search).get('mode') === 'duel'; } catch (e) {}
  if (_wantDuel) startDuel(); else setTimeout(openMenu, 200);
  // IN-3 — iframe focus affordance: hotkeys silently do nothing until this
  // document actually has keyboard focus (common in an embedded iframe).
  // The duel's own keycap strip is permanently on screen (P3.6), so the old
  // dismissible "click the board" ribbon is gone with the board.
}

// PED-3 — notation ramp: shows a one-line explainer the FIRST time a given
// symbol is encountered this session (sessionStorage, same "fresh tab resets
// it" reasoning as FE-9/FE-13), then never again for that key. Deliberately
// one shared chip, not a chip-per-symbol pile-up — only one can be relevant
// at a time since they're each tied to a specific screen transition.
function explainOnFirstUse(key, html) {
  let seen;
  try { seen = sessionStorage.getItem(`qb_notation_seen_${key}`) === '1'; } catch (e) { seen = false; }
  if (seen) return;
  try { sessionStorage.setItem(`qb_notation_seen_${key}`, '1'); } catch (e) {}
  const chip = document.getElementById('notation-chip');
  if (!chip) return;
  chip.innerHTML = `${html}<button onclick="dismissNotationChip()" title="Dismiss">✕</button>`;
  chip.classList.add('show');
  clearTimeout(_notationChipTimer);
  _notationChipTimer = setTimeout(dismissNotationChip, 9000);
}
let _notationChipTimer = null;
function dismissNotationChip() {
  const chip = document.getElementById('notation-chip');
  if (chip) chip.classList.remove('show');
  clearTimeout(_notationChipTimer);
}

function runBoot() {
  const logo =document.getElementById('boot-logo');
  const sub  =document.getElementById('boot-sub');
  const lines=document.getElementById('boot-lines');
  const start=document.getElementById('boot-start');

  const title='QUBLITZ';
  let i=0;

  const typeTimer=setInterval(()=>{
    logo.textContent+=title[i];
    sfxBootBeep(440+i*38);
    i++;
    if (i>=title.length) {
      clearInterval(typeTimer);
      setTimeout(()=>{
        sub.textContent='Qubit Battle Arena';
        const bootLines=[
          '  Cooling the qubit array to millikelvin...',
          '  Deploying quantum units to the field...',
          '  Calibrating control pulses (H X Y Z S T)...',
          '  Arming measurement strike systems...',
          '  Entanglement couplers online...',
          '  Charge. Close in. Collapse the enemy.',
        ];
        let li=0;
        const lt=setInterval(()=>{
          if (li<bootLines.length) {
            lines.textContent+=bootLines[li]+'\n';
            sfxBootBeep(li===bootLines.length-1?494:330);
            li++;
          } else {
            clearInterval(lt);
            start.textContent='▶ PRESS ANY KEY TO BEGIN ◀';
            _bootTimeout=setTimeout(finishBoot,2200);
          }
        },180);
      },350);
    }
  },110);

  // Skip on any key or click
  const skip=()=>{ finishBoot(); };
  document.getElementById('boot').addEventListener('click',skip,{once:true});
  document.addEventListener('keydown',skip,{once:true});
}

// Restored with the Physics Lab (it lived in the board's RENDERING block):
// this chart is the lab's whole point — it fits the engine's OWN generated
// decay against exponential and linear models and shows which one wins.
function drawDecoherenceDiagram(decoRate) {
  const cv = document.getElementById('diag-canvas'); if (!cv) return;
  const g = cv.getContext('2d'); const W = cv.width, H = cv.height;
  const rep = QPhysics.diagnose({ decoRate, turns: 24 });
  const data = rep.charge_by_turn, N = data.length - 1;
  const PADL = 30, PADB = 22, PADT = 12, PADR = 8;
  const x = t => PADL + (W - PADL - PADR) * (t / N);
  const y = q => PADT + (H - PADT - PADB) * (1 - q);
  g.clearRect(0, 0, W, H);
  // axes + gridlines
  g.strokeStyle = 'rgba(140,150,200,0.25)'; g.lineWidth = 1; g.font = `600 11px ${CANVAS_BODY}`;
  g.fillStyle = 'rgba(207,214,238,0.65)';
  for (let q = 0; q <= 1; q += 0.25) { g.beginPath(); g.moveTo(PADL, y(q)); g.lineTo(W - PADR, y(q)); g.stroke(); g.fillText((q).toFixed(2), 2, y(q) + 3); }
  g.fillText('0', PADL - 2, H - PADB + 12); g.fillText(String(N) + ' turns', W - PADR - 42, H - PADB + 12);
  g.fillText('charge', 2, PADT - 3);
  // linear best-fit line (for contrast — visibly wrong)
  const n = data.length; let mx = 0, my = 0; for (let i = 0; i < n; i++) { mx += i; my += data[i]; } mx /= n; my /= n;
  let sxy = 0, sxx = 0; for (let i = 0; i < n; i++) { sxy += (i - mx) * (data[i] - my); sxx += (i - mx) * (i - mx); }
  const slope = sxx ? sxy / sxx : 0, intc = my - slope * mx;
  g.strokeStyle = '#ff5a72'; g.setLineDash([4, 3]); g.lineWidth = 1.5; g.beginPath();
  g.moveTo(x(0), y(Math.max(0, Math.min(1, intc)))); g.lineTo(x(N), y(Math.max(0, Math.min(1, slope * N + intc)))); g.stroke(); g.setLineDash([]);
  // exponential (physical) decay curve
  g.strokeStyle = '#2fe0d0'; g.lineWidth = 2; g.beginPath();
  data.forEach((q, t) => { t === 0 ? g.moveTo(x(t), y(q)) : g.lineTo(x(t), y(q)); }); g.stroke();
  // data points
  g.fillStyle = '#8b7dff'; data.forEach((q, t) => { g.beginPath(); g.arc(x(t), y(q), 2, 0, 2 * Math.PI); g.fill(); });
  const ro = document.getElementById('diag-readout');
  if (ro) ro.innerHTML = `<b style="color:#2fe0d0">exponential R² = ${rep.R2_exponential.toFixed(4)}</b> &nbsp;≫&nbsp; <b style="color:#ff5a72">linear R² = ${rep.R2_linear.toFixed(4)}</b> &nbsp;·&nbsp; fitted T₁ = ${rep.T1_recovered.toFixed(1)} (input ${rep.T1_input.toFixed(1)}) &nbsp;·&nbsp; <b style="color:var(--gold)">${rep.verdict}</b>`;
}

// INIT
// ═══════════════════════════════════════════════════════
// BR-1 — T1 import from the simulator (deep link). ?t1=<ns> in the URL sets
// this game's decoherence rate from the Qubit Simulator page's own T1
// (nanoseconds — a real qubit parameter, normally hidden by default on that
// page behind a "show hidden simulator parameters" toggle since it's not
// meant to be guessed at). This does NOT treat nanoseconds as game turns
// directly (a literal passthrough would either flatline every real T1 to
// the same clamped minimum, or need the game to model real time — neither
// is honest); instead it rescales relative to a documented reference point
// (200ns — the simulator's own example secrets value) so a qubit with 2×
// the reference T1 decays 2× slower in-game too. That ratio is the real,
// disclosed physics link; the absolute turn count is a game-balance choice,
// same as GAME.decoRate always was.
function importSimulatorParams() {
  // Two sources, checked in order: window.QB_INITIAL_T1_NS (set by
  // QuBlitz_Arena.py's own <script> injection — the same pattern already
  // used for QB_SAGE_PROXY — for the REAL embedded case, since the game is
  // injected via srcdoc and its location.search is never the parent
  // Streamlit page's query string) and location.search directly (for the
  // standalone file:// / direct-URL case, e.g. this file opened on its own
  // with ?t1= appended).
  let t1ns = (typeof QB_INITIAL_T1_NS !== 'undefined') ? parseFloat(QB_INITIAL_T1_NS) : NaN;
  if (!isFinite(t1ns)) {
    let params;
    try { params = new URLSearchParams(location.search); } catch (e) { return; }
    t1ns = parseFloat(params.get('t1'));
  }
  if (!isFinite(t1ns) || t1ns <= 0) return;
  const REFERENCE_T1_NS = 200;
  const importedT1Turns = Math.max(1, Math.min(15, 5 * (t1ns / REFERENCE_T1_NS)));
  GAME.decoRate = 10 / importedT1Turns;
  GAME.importedT1Ns = t1ns;
}
