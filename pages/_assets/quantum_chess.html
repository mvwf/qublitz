  const VIEW_H = K.WORLD_H * SCALE;                // 500
  const BAND = (BOARD - VIEW_H) / 2;               // 150 top and bottom
  const w2sx = wx => wx * SCALE;
  const w2sy = wy => BAND + wy * SCALE;

  const S = {
    active: false, paused: false, over: false,
    t: 0, acc: 0, last: null,
    rand: null, seed: 0,
    ships: [], proj: [], parts: [], stars: [], zones: [], pickups: [],
    pickupTimer: 0, beam: 'X',
    keys: Object.create(null),
    aim: { x: K.WORLD_W / 2, y: 0 },
    charging: false, chargeT: 0, selfAim: false, chargeSource: null, selfPulses: 0,
    inputDevice: 'KEYBOARD + POINTER',
    gamepad: { index:null, id:'', buttons:null,
               move:{x:0,y:0,active:false}, aim:{x:0,y:0,active:false} },
    actions: { move:{x:0,y:0}, aim:{x:0,y:0,active:false} },
    round: { winner: null, method: null, p: 0, endedAt: 0 },
    tele: [], loadedAt: 0, firstShotSent: false, sphereReadSent: false,
    shotCount: 0, thetas: [], axisCounts: { X: 0, Y: 0, T: 0 }, measures: 0,
    floats: [], bell: null, mission: -1, ev: null, gateMsg: '', gateMsgT: 0,
    match: { you: 0, them: 0, no: 1 }, debrief: null,
    rstat: null,
    introT: 0, shake: 0, flash: 0, flashColor: '#ffffff',
    announcer: '', announceT: 0,
    frameMs: [], showPerf: false,
    // Measurement reveal: the Born-rule roll shown on screen, with a short
    // hit-stop (sim frozen, drawing continues). A winning collapse holds the
    // freeze a little longer, then ends the round.
    reveal: null, hitStop: 0, pendingEnd: null, pickupSeq: 0,
  };

  // ── Entity pools — preallocated; the sim never allocates (perf budget) ──
  function mkPool(n, shape) {
    const a = new Array(n);
    for (let i = 0; i < n; i++) a[i] = Object.assign({ live: false }, shape());
    return a;
  }
  function take(pool) {
    for (let i = 0; i < pool.length; i++) if (!pool[i].live) return pool[i];
    return null;                                   // pool full: drop, never grow
  }

  function initPools() {
    if (S.proj.length) return;
    S.proj = mkPool(64, () => ({ x:0, y:0, vx:0, vy:0, kind:'beam', beam:'X',
                                 theta:0, owner:0, ttl:0 }));
    S.parts = mkPool(400, () => ({ x:0, y:0, vx:0, vy:0, life:0, max:1,
                                   col:'#fff', r:2 }));
  }

  function spawnParts(n, x, y, col, spd, life) {
    if (REDUCE_MOTION) return;
    for (let i = 0; i < n; i++) {
      const p = take(S.parts); if (!p) return;
      // Visual randomness must never consume the seeded gameplay RNG.
      const a = Math.random() * Math.PI * 2, v = spd * (0.35 + Math.random());
      p.live = true; p.x = x; p.y = y;
      p.vx = Math.cos(a) * v; p.vy = Math.sin(a) * v;
      p.life = p.max = life; p.col = col; p.r = 1.5 + Math.random() * 2;
    }
  }

  // ── Audio — procedural, zero asset bytes (PD-9). Same WebAudio path the
  //    campaign's beep()/sfxDecohere() already use, extended with frequency
  //    sweeps and a noise burst. (The plan named jsfxr; a ~60-line synth on
  //    the existing audio path gets the same "no files, tiny" outcome without
  //    vendoring an unvetted library — richer presets can land with the D2
  //    asset pipeline if playtests ask for them.)
  function sweep(f0, f1, dur, type, vol) {
    const c = ac(); if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.connect(g); g.connect(c.destination);
    o.type = type; o.frequency.setValueAtTime(f0, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), c.currentTime + dur);
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.start(); o.stop(c.currentTime + dur);
  }
  function noise(dur, vol) {
    const c = ac(); if (!c) return;
    const buf = c.createBuffer(1, Math.max(1, (c.sampleRate * dur) | 0), c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
    const src = c.createBufferSource(), g = c.createGain();
    src.buffer = buf; src.connect(g); g.connect(c.destination);
    g.gain.setValueAtTime(vol, c.currentTime);
    src.start(); src.stop(c.currentTime + dur);
  }
  const sfxFire    = () => sweep(880, 180, 0.16, 'sawtooth', 0.16);
  const sfxHit     = () => noise(0.14, 0.22);
  const sfxShield  = () => sweep(300, 900, 0.16, 'sine', 0.13);
  const sfxWind    = (d) => sweep(220, 1400, d || DuelCore.K.MEASURE_WIND_S, 'sine', 0.10);
  const sfxCollapse= () => { noise(0.3, 0.3); sweep(400, 60, 0.5, 'sawtooth', 0.2); };
  const sfxDud     = () => sweep(240, 90, 0.3, 'triangle', 0.15);
  const sfxRoundWin= () => { sweep(280, 840, 0.24, 'triangle', 0.14); sweep(520, 1180, 0.34, 'sine', 0.10); };
  const sfxRoundLoss=() => sweep(360, 90, 0.45, 'sawtooth', 0.12);

  // Presentation-only impact channel. It never touches DuelCore state,
  // clocks, probabilities, cooldowns, or movement. Reduced-motion keeps the
  // readable announcer but removes particles, shake, and flash.
  function triggerFx(label, color = '#ffffff', intensity = 0.35) {
    S.announcer = label || '';
    S.announceT = label ? 1.15 : 0;
    if (!REDUCE_MOTION) {
      S.shake = Math.max(S.shake, intensity);
      S.flash = Math.max(S.flash, intensity * 0.55);
      S.flashColor = color;
    } else {
      S.shake = 0; S.flash = 0;
    }
    if (label) announceA11y(label);
  }

  // ── Telemetry (PD-11, design doc §8 items 1–4). Local only; rides the
  //    existing instructor gate-log export, no third-party anything.
  function tele(type, data) {
    S.tele.push(Object.assign({ type, tMs: Math.round(performance.now() - S.loadedAt) },
                              data || {}));
  }

  // ── Ships ────────────────────────────────────────────────────────────
  function mkShip(owner, x, y, col) {
    return { owner, x, y, vx: 0, vy: 0, ang: 0, col,
             bloch: { x: 0, y: 0, z: 1 },            // |0⟩
             arc: null,                              // {from,to,t} sphere animation
             beamCd: 0, measCd: 0, winding: 0, hitFlash: 0, shieldFlash: 0,
             // D1 mechanics
             fidelity: 0.55,      // sloppy pulses until you find calibration
             tCharges: 1,         // scarce non-Clifford resource
             bellIdx: -1,         // 0/1 while entangled, else -1
             zenoUntil: 0,        // Zeno lock expiry (S.t seconds)
             measStamps: [],      // recent MEASURE landings on THIS ship
             // free-duel power-ups (S.t expiry times; fastReadout is one-shot)
             driveUntil: 0, detuneUntil: 0, fastReadout: false, windTotal: 0,
             inHot: false };
  }

  function start(seed, mission, keepMatch, opts) {
    initPools();
    S.seed = seed || (Date.now() & 0xffffffff);
    S.rand = DuelCore.mulberry32(S.seed);
    S.ships = [ mkShip(0, K.WORLD_W * 0.22, K.WORLD_H * 0.5, '#2fe0d0'),
                mkShip(1, K.WORLD_W * 0.78, K.WORLD_H * 0.5, '#ff4d9d') ];
    S.proj.forEach(p => p.live = false);
    S.parts.forEach(p => p.live = false);
    // Decoherence hotspots — three fixed patches of noisy chip. Fixed, not
    // random: they are terrain to learn, not a lottery.
    S.zones = [
      { x: K.WORLD_W*0.5,  y: K.WORLD_H*0.28, r: 118, t1: DuelCore.ZONE.HOT_T1, t2: DuelCore.ZONE.HOT_T2 },
      { x: K.WORLD_W*0.22, y: K.WORLD_H*0.78, r:  96, t1: DuelCore.ZONE.HOT_T1, t2: DuelCore.ZONE.HOT_T2 },
      { x: K.WORLD_W*0.79, y: K.WORLD_H*0.74, r:  96, t1: DuelCore.ZONE.HOT_T1, t2: DuelCore.ZONE.HOT_T2 },
    ];
    S.pickups = []; S.pickupTimer = 4; S.beam = 'X'; S.bell = null;
    S.reveal = null; S.hitStop = 0; S.pendingEnd = null; S.pickupSeq = 0;
    S.pairNeg = 0; S.pairZZ = 0; S.botFlipT = 0;
    S.stars = [];
    for (let i = 0; i < 140; i++)
      S.stars.push({ x: S.rand() * K.WORLD_W, y: S.rand() * K.WORLD_H,
                     z: S.rand() < 0.5 ? 0.35 : 0.8, r: S.rand() * 1.6 + 0.4 });
    S.active = true; S.paused = false; S.over = false;
    S.t = 0; S.acc = 0; S.last = null;
    clearInput();
    S.charging = false; S.chargeT = 0; S.chargeSource = null;
    S.round = { winner: null, method: null, p: 0, endedAt: 0 };
    S.debrief = null; S.progress = null;
    S.introT = 2.4; S.shake = 0; S.flash = 0;
    // Brief card (Rabi Rider style): the goal, the steps and the physics,
    // before anything moves. Shown when a player starts from the menus.
    S.briefing = !!(opts && opts.brief);
    S.learnQ = [];
    S.announcer = ''; S.announceT = 0;
    S.rstat = { shieldedAgainstYou: 0, duds: 0, selfPulses: 0, hotspotTime: 0,
                hotspotDefenseTime: 0, lastTheta: null };
    if (!keepMatch) S.match = { you: 0, them: 0, no: 1 };
    S.tele = keepMatch ? S.tele : []; S.loadedAt = keepMatch ? S.loadedAt : performance.now();
    S.firstShotSent = false; S.sphereReadSent = false;
    S.shotCount = 0; S.thetas = []; S.axisCounts = { X:0, Y:0, T:0 }; S.measures = 0;
    S.floats = [];
    S.frameMs = [];
    _botT = 0; _botIntent = null; _botHold = 0; _botPrevOdds = 0;
    try { S.lossStreak = parseInt(localStorage.getItem('qb_loss_streak') || '0', 10) || 0; }
    catch (e) { S.lossStreak = 0; }
    // ── Mission setup (concept scenarios; -1 = free duel) ──────────────
    S.mission = (mission == null) ? -1 : mission;
    S.ev = { entangled:false, bellCollapse:false, usedT:false, tCampBroken:false,
             hotspotDefenseTime:0, superposedShot:false, zenoLocked:false,
             fidelity:0, elapsed:0, measuredIdx:-1,
             hits:0, maxFoeOdds:0, selfSuperposed:false, won:false };
    S.gateMsg = ''; S.gateMsgT = 0;
    const M = DuelCore.DUEL_MISSIONS[S.mission];
    if (M) {
      const foe = S.ships[1];
      if (M.id === 1) foe.bloch = { x:0, y:0, z:-1 };          // pre-charged, racing T1
      if (M.camper)  foe.bloch = { x:1, y:0, z:0 };            // parked at |+⟩
      if (M.lowFidelity != null) S.ships[0].fidelity = M.lowFidelity;
      if (M.id === 4) S.ships[0].tCharges = 1;                 // exactly one T to learn with
      if (M.shielded || M.camper) S.zones = S.zones.slice(0, 1);
    }
    tele('duel_load', { seed: S.seed, mission: S.mission,
                        concept: M ? M.concept : 'free-duel' });
  }
  function stop() { clearInput(); S.active = false; }

  // Best-of-3: keep the score, reset the arena. Match ends at 2.
  const matchOver = () => S.match.you >= 2 || S.match.them >= 2;
  function nextRound() {
    if (matchOver()) { S.match = { you: 0, them: 0, no: 1 }; start(undefined, S.mission); return; }
    S.match.no++;
    start(S.seed + S.match.no, S.mission, true);
  }

  // ── Firing ───────────────────────────────────────────────────────────
  function fireBeam(ship, theta, beamKey) {
    const spec = DuelCore.BEAMS[beamKey] || DuelCore.BEAMS.X;
    if (spec.scarce) {                                // T is a resource, not a button
      if (ship.tCharges <= 0) { sfxDud(); return; }
      ship.tCharges--;
    }
    const p = take(S.proj); if (!p) return;
    p.live = true; p.kind = 'beam'; p.beam = beamKey; p.theta = theta;
    p.owner = ship.owner; p.ttl = 4;
    p.x = ship.x + Math.cos(ship.ang) * K.SHIP_R;
    p.y = ship.y + Math.sin(ship.ang) * K.SHIP_R;
    p.vx = Math.cos(ship.ang) * K.BEAM_SPEED;
    p.vy = Math.sin(ship.ang) * K.BEAM_SPEED;
    ship.beamCd = K.BEAM_CD_S;
    if (ship.owner === 0 && S.ev) {
      if (spec.scarce) S.ev.usedT = true;
      // "Fired from superposition" = the shooter's own vector is off both
      // poles when the shot leaves — mission 3's concept, measured not claimed.
      if (!DuelCore.isEigenstate(ship.bloch, 'Z')) S.ev.superposedShot = true;
    }
    sfxFire();
    if (ship.owner === 0) {
      S.shotCount++; S.thetas.push(+(theta / Math.PI).toFixed(3));
      if (S.rstat) S.rstat.lastTheta = (theta / Math.PI).toFixed(2);
      S.axisCounts[beamKey] = (S.axisCounts[beamKey] || 0) + 1;
      if (!S.firstShotSent) {
        S.firstShotSent = true;
        tele('first_shot', { theta_over_pi: +(theta / Math.PI).toFixed(3) });
      }
    }
  }
  // Apply a pulse to your OWN qubit. Same θ, same axis, same cooldown as the
  // beam you'd have fired — you simply spend the shot on defence instead of
  // offence. This is what makes eigenstate parking playable: rotate yourself
  // onto ±the axis they keep firing and their beam becomes a literal no-op
  // (DuelCore.resolveBeam returns shielded). It is also the only way to
  // shed charge on purpose, i.e. to stop being worth measuring.
  function selfPulse(ship, theta, beamKey) {
    const spec = DuelCore.BEAMS[beamKey] || DuelCore.BEAMS.X;
    if (spec.scarce) {
      if (ship.tCharges <= 0) { sfxDud(); return; }
      ship.tCharges--;
    }
    const th = spec.fixedTheta != null ? spec.fixedTheta
      : DuelCore.applyFidelity(theta, ship.fidelity, S.rand);
    const before = ship.bloch;
    if (S.bell && ship.bellIdx >= 0) linkedPulse(ship, DuelCore.AXES[spec.axis], th, spec.color, false);
    else {
      ship.bloch = DuelCore.rotateBloch(before, DuelCore.AXES[spec.axis], th);
      ship.arc = { from: before, to: ship.bloch, t: 0 };
    }
    ship.beamCd = K.BEAM_CD_S;
    spawnParts(10, ship.x, ship.y, spec.color, 70, 0.45);
    if (ship.bellIdx < 0) floatTxt(ship, 'SELF ' + beamKey, spec.color);
    sweep(300, 620, 0.14, 'sine', 0.12);
    if (ship.owner === 0 && S.ev) {
      if (!DuelCore.isEigenstate(ship.bloch, 'Z')) S.ev.selfSuperposed = true;
      learn('self');
      S.selfPulses = (S.selfPulses || 0) + 1;
      if (S.rstat) S.rstat.selfPulses++;
      if (!DuelCore.isEigenstate(ship.bloch, 'Z')) S.ev.superposedShot = true;
    }
  }

  // ── Entangled link (S.bell holds a DuelCore.Pair density matrix) ──────
  // Ship k of the pair is qubit bellIdx; its .bloch is always its reduced
  // state, so every reader (odds, spheres, bot) sees the real marginal.
  const LINK_ENT_MIN = 0.05;          // negativity that counts as entangled (Bell = 0.5)
  const AIM_CONE = 0.6, AIM_TURN = 0.5;   // aim assist: ±35° cone, turn rate in rad/s
  function syncPair() {
    if (!S.bell) return;
    for (const sh of S.ships) if (sh.bellIdx >= 0) sh.bloch = DuelCore.Pair.reduced(S.bell, sh.bellIdx);
    S.pairNeg = DuelCore.Pair.negativity(S.bell);
    S.pairZZ = DuelCore.Pair.zz(S.bell);
    // Once the pair is (numerically) a product state, nothing is shared any
    // more and two Bloch vectors describe it exactly: drop the link.
    if (DuelCore.Pair.productGap(S.bell) < 2e-3) endLink();
  }
  function endLink() {
    for (const sh of S.ships) sh.bellIdx = -1;
    S.bell = null; S.pairNeg = 0; S.pairZZ = 0;
  }

  const rabiMult = ship => ship.driveUntil > S.t ? DuelCore.PICKUPS.drive.rabiMult : 1;
  const detuneOf = ship => ship.detuneUntil > S.t ? DuelCore.PICKUPS.detune.dOverO : 0;
  // Start a MEASURE wind-up; FAST READOUT shortens this one.
  function windMeasure(ship) {
    const w = ship.fastReadout ? DuelCore.PICKUPS.readout.windS : K.MEASURE_WIND_S;
    ship.fastReadout = false;
    ship.winding = ship.windTotal = w;
    sfxWind(w);
  }

  function fireMeasure(ship) {
    const p = take(S.proj); if (!p) return;
    p.live = true; p.kind = 'measure'; p.owner = ship.owner; p.ttl = 5;
    p.x = ship.x + Math.cos(ship.ang) * K.SHIP_R;
    p.y = ship.y + Math.sin(ship.ang) * K.SHIP_R;
    p.vx = Math.cos(ship.ang) * K.MEASURE_SPEED;
    p.vy = Math.sin(ship.ang) * K.MEASURE_SPEED;
    const MC = DuelCore.DUEL_MISSIONS[S.mission];
    ship.measCd = (ship.owner === 0 && MC && MC.measureCd) ? MC.measureCd : K.MEASURE_CD_S;
    if (ship.owner === 0) S.measures++;
  }

  // A landed beam: rotate the target's qubit. The 250ms arc animation IS the
  // damage number — the sphere swinging is the feedback (design pillar 2).
  function landBeam(p, target) {
    // Linked target: the pulse is a local unitary on the PAIR. It cannot
    // change the partner's marginal (no-signalling), but it can change the
    // correlations: an X or Y π-pulse turns "outcomes match" into "opposite".
    if (S.bell && target.bellIdx >= 0 && !(target.zenoUntil > S.t)) {
      const spec = DuelCore.BEAMS[p.beam] || DuelCore.BEAMS.X;
      const shooter = S.ships[p.owner];
      let axis = DuelCore.AXES[spec.axis];
      let th = spec.fixedTheta != null ? spec.fixedTheta
        : DuelCore.applyFidelity(p.theta, shooter.fidelity, S.rand);
      const d = spec.kind === 'attack' ? detuneOf(target) : 0;
      if (d) { axis = { x: axis.x, y: axis.y, z: axis.z + d }; th *= Math.sqrt(1 + d * d); }
      linkedPulse(target, axis, th, spec.color, true);
      if (p.owner === 0 && S.ev) S.ev.hits++;
      sfxHit();
      return;
    }
    const before = target.bloch;
    const wasCardinal = DuelCore.isCardinal(before);
    const shooter = S.ships[p.owner];
    const res = DuelCore.resolveBeam(before, p.beam, p.theta, {
      fidelity: shooter.fidelity, rand: S.rand,
      zenoUntil: target.zenoUntil, now: S.t,
      detune: detuneOf(target),
    });
    if (res.zenoBlocked) {
      target.shieldFlash = 0.4;
      spawnParts(8, p.x, p.y, '#8b7dff', 70, 0.4);
      floatTxt(target, 'ZENO-PINNED', '#8b7dff');
      sfxShield();
      return;
    }
    if (res.shielded) {
      target.shieldFlash = 0.4;
      spawnParts(10, p.x, p.y, '#9aa3cf', 90, 0.5);
      floatTxt(target, 'EIGENSTATE!', '#9aa3cf');
      if (p.owner === 0) learn('shield');
      if (p.owner === 0 && S.rstat) S.rstat.shieldedAgainstYou++;
      sfxShield();
      return;
    }
    target.bloch = res.bloch;
    if (p.owner === 0 && S.ev) S.ev.hits++;
    if (p.owner === 0) learn('hit');
    if (p.owner === 1 && DuelCore.odds(target.bloch) > 0.4) learn('hurt');
    if (p.owner === 0 && p.beam === 'T' && wasCardinal && !DuelCore.isCardinal(res.bloch) && S.ev)
      S.ev.tCampBroken = true;
    target.arc = { from: before, to: res.bloch, t: 0 };
    target.hitFlash = 0.35;
    const spec = DuelCore.BEAMS[p.beam] || DuelCore.BEAMS.X;
    spawnParts(14, p.x, p.y, spec.color, 130, 0.6);
    if (spec.kind === 'phase') floatTxt(target, 'PHASE ' + (p.beam === 'T' ? 'π/4' : ''), spec.color);
    else if (res.detuned) floatTxt(target, 'OFF-RESONANT', DuelCore.PICKUPS.detune.color);
    if (p.theta >= Math.PI * 0.75) triggerFx('MAX-CHARGE HIT', spec.color, 0.28);
    sfxHit();
    // §8 item 3 — the learning beat: the player's beam visibly moved the
    // opponent's state vector. Fired once, on a ≥15° swing.
    if (!S.sphereReadSent && p.owner === 0) {
      const a = before, b = res.bloch;
      const ma = Math.hypot(a.x,a.y,a.z), mb = Math.hypot(b.x,b.y,b.z);
      if (ma > 1e-6 && mb > 1e-6) {
        const cos = (a.x*b.x + a.y*b.y + a.z*b.z) / (ma*mb);
        const deg = Math.acos(Math.max(-1, Math.min(1, cos))) * 180 / Math.PI;
        if (deg >= 15) {
          S.sphereReadSent = true;
          tele('first_sphere_read', { swing_deg: +deg.toFixed(1) });
        }
      }
    }
  }

  function landMeasure(p, target) {
    if (S.pendingEnd) return;                      // round already decided this frame
    const other = S.ships[1 - (target.owner)];
    let res, method = 'measure';
    let partnerP1 = null, wasEntangled = false;
    if (S.bell && target.bellIdx >= 0) {
      // Linked: a Z measurement on one half of the real two-qubit state.
      // The target collapses by the Born rule on its marginal, and the
      // partner collapses to whatever the correlations leave it in (for
      // |Φ+⟩ the same outcome, for |Ψ+⟩ the opposite one).
      wasEntangled = (S.pairNeg || 0) > LINK_ENT_MIN;
      const r = DuelCore.Pair.measure(S.bell, target.bellIdx, S.rand);
      endLink();
      target.bloch = r.self;
      other.bloch = r.partner;
      partnerP1 = r.partnerP1;
      floatTxt(other, partnerP1 > 0.98 ? 'COLLAPSED → |1⟩' : partnerP1 < 0.02 ? 'COLLAPSED → |0⟩' : `P(1) NOW ${(partnerP1*100).toFixed(0)}%`, '#c97bff');
      res = { outcome: r.outcome, p: r.p, draw: r.draw };
      method = 'bell-measure';
      if (p.owner === 0 && S.ev && wasEntangled) S.ev.bellCollapse = true;
    } else {
      res = DuelCore.measureRoll(target.bloch, S.rand);
      target.bloch = res.bloch;
    }
    target.arc = null;
    S.reveal = { shooter: p.owner, p: res.p, draw: res.draw, outcome: res.outcome,
                 bell: method === 'bell-measure', partnerP1, blocked: false, t: 0 };

    // Zeno bookkeeping: NEEDED landings inside WINDOW pin the target.
    target.measStamps.push(S.t);
    target.measStamps = target.measStamps.filter(t => S.t - t <= DuelCore.ZENO.WINDOW);
    if (target.measStamps.length >= DuelCore.ZENO.NEEDED && res.outcome === 0) {
      target.zenoUntil = S.t + DuelCore.ZENO.HOLD;
      target.measStamps = [];
      floatTxt(target, 'ZENO LOCK', '#8b7dff');
      if (p.owner === 0 && S.ev) S.ev.zenoLocked = true;
      tele('zeno_lock', { by: p.owner === 0 ? 'player' : 'sage' });
    }

    if (res.outcome === 1) {
      // Mission gate: the campaign's shield rule, reborn. A collapse that
      // did not use the mission's concept does not count — and says why.
      if (p.owner === 0 && S.mission >= 0) {
        S.ev.fidelity = S.ships[0].fidelity;
        S.ev.elapsed = S.t;
        const g = DuelCore.missionGate(S.mission, S.ev);
        if (g.blocked) {
          S.gateMsg = g.reason; S.gateMsgT = 6;
          spawnParts(20, target.x, target.y, '#9aa3cf', 120, 0.7);
          floatTxt(target, 'SHIELDED', '#9aa3cf');
          sfxShield();
          tele('mission_gate_blocked', { mission: S.mission, reason: g.reason });
          S.reveal.blocked = true; S.hitStop = REVEAL_DUD_STOP_S;
          return;
        }
      }
      sfxCollapse();
      spawnParts(60, target.x, target.y, target.col, 260, 1.1);
      // Freeze on the reveal, then end the round (see frame()).
      S.hitStop = REVEAL_WIN_STOP_S;
      S.pendingEnd = [p.owner, method, res.p];
    } else {
      S.hitStop = REVEAL_DUD_STOP_S;
      sfxDud();
      spawnParts(18, target.x, target.y, '#9aa3cf', 110, 0.6);
      floatTxt(target, 'DUD — reset to |0⟩', '#9aa3cf');
      if (p.owner === 0) learn('dud');
      triggerFx('MEASURE → |0⟩ · NO WIN', '#9aa3cf', 0.12);
      if (p.owner === 0 && S.rstat) S.rstat.duds++;
    }
  }

  // A pulse on one half of a linked pair (a beam on them, or a self-pulse).
  function linkedPulse(ship, axis, theta, col, incoming) {
    const before = ship.bloch, zz0 = DuelCore.Pair.zz(S.bell);
    S.bell = DuelCore.Pair.rotate(S.bell, ship.bellIdx, axis, theta);
    syncPair();
    ship.arc = { from: before, to: ship.bloch, t: 0 };
    if (incoming) ship.hitFlash = 0.35;
    spawnParts(12, ship.x, ship.y, col, 100, 0.5);
    const zz1 = S.bell ? DuelCore.Pair.zz(S.bell) : 0;
    if (S.bell && zz0 > 0.3 && zz1 < -0.3) floatTxt(ship, 'NOW OPPOSITE', '#c97bff');
    else if (S.bell && zz0 < -0.3 && zz1 > 0.3) floatTxt(ship, 'NOW MATCHED', '#c97bff');
    else floatTxt(ship, 'PAIR PULSE', '#c97bff');
  }

  // Coupler beam: a CNOT on the real two-qubit state, shooter = control.
  //   your qubit at |0⟩ → nothing happens
  //   your qubit at |1⟩ → their qubit is flipped (X)
  //   your qubit in superposition → entanglement (|+⟩|0⟩ → |Φ+⟩)
  // and with a control in superposition the target's P(|1⟩) becomes 50%
  // whatever it was, which is why entangling is the comeback move.
  function landEntangle(p, target) {
    const shooter = S.ships[p.owner];
    if (S.bell) return;
    const Pr = DuelCore.Pair;
    const rho = Pr.cnot(Pr.fromBloch(shooter.bloch, target.bloch), 0);
    const neg = Pr.negativity(rho), gap = Pr.productGap(rho);
    const before = target.bloch;
    if (gap < 2e-3) {
      // Nothing shared: the CNOT acted as identity or as a plain X on them.
      target.bloch = Pr.reduced(rho, 1);
      target.arc = { from: before, to: target.bloch, t: 0 };
      const flipped = DuelCore.odds(target.bloch) - DuelCore.odds(before);
      floatTxt(target, Math.abs(flipped) > 0.05 ? 'CNOT FLIP' : 'CNOT: CONTROL AT |0⟩', '#c97bff');
      if (Math.abs(flipped) <= 0.05) floatTxt(shooter, 'NEED SUPERPOSITION', '#c97bff');
      sfxShield();
      return;
    }
    S.bell = rho;
    shooter.bellIdx = 0; target.bellIdx = 1;
    syncPair();
    shooter.arc = null; target.arc = { from: before, to: target.bloch, t: 0 };
    spawnParts(40, target.x, target.y, '#c97bff', 190, 1.0);
    floatTxt(target, neg > LINK_ENT_MIN ? `ENTANGLED · ${S.pairZZ >= 0 ? 'MATCH' : 'OPPOSITE'}` : 'CORRELATED (classical)', '#c97bff');
    if (p.owner === 0 && S.ev && neg > LINK_ENT_MIN) S.ev.entangled = true;
    if (neg > LINK_ENT_MIN) learn('linked');
    sfxShield();
    tele('entangled', { by: p.owner === 0 ? 'player' : 'sage', negativity: +neg.toFixed(3) });
  }

  const REVEAL_S = 2.2, REVEAL_WIN_STOP_S = 1.1, REVEAL_DUD_STOP_S = 0.35;

  // A ship collects a pickup. Works the same for you and for Sage.
  function applyPickup(sh, kind) {
    const P = DuelCore.PICKUPS[kind];
    if (kind === 'calib') {
      sh.fidelity = Math.min(1, sh.fidelity + 0.15);
      floatTxt(sh, `FIDELITY ${(sh.fidelity*100)|0}%`, P.color);
      if (sh.owner === 0) tele('pickup', { kind: 'calibration', fidelity: +sh.fidelity.toFixed(2) });
      return;
    }
    if (kind === 'tgate') {
      sh.tCharges = Math.min(3, sh.tCharges + 1);
      floatTxt(sh, `T-CHARGE ×${sh.tCharges}`, P.color);
      if (sh.owner === 0) tele('pickup', { kind: 't_charge', held: sh.tCharges });
      return;
    }
    if (kind === 'readout') {
      sh.measCd = 0;
      if (sh.winding > 0) sh.winding = Math.min(sh.winding, P.windS);   // already winding: hurry it
      else sh.fastReadout = true;
    } else if (kind === 'reset') {
      if (S.bell && sh.bellIdx >= 0) {
        // Resetting one half of a pair leaves the partner in its reduced
        // state: for |Φ+⟩ that is the maximally mixed I/2 (P(|1⟩) = 50%).
        const other = S.ships[1 - sh.owner];
        other.bloch = DuelCore.Pair.reduced(S.bell, other.bellIdx);
        endLink();
      }
      const before = sh.bloch;
      sh.bloch = { x: 0, y: 0, z: 1 };
      sh.arc = { from: before, to: sh.bloch, t: 0 };
      sh.zenoUntil = 0;
    } else if (kind === 'drive') {
      sh.driveUntil = S.t + P.durS;
    } else if (kind === 'detune') {
      sh.detuneUntil = S.t + P.durS;
    }
    floatTxt(sh, P.name, P.color);
    if (sh.owner === 0) { tele('pickup', { kind }); learn('pickup', kind); }
  }

  // Small world-space floater, reusing the campaign's float list shape.
  function floatTxt(ship, text, col) {
    // Stack above any fresh floater nearby (either ship) so labels never overprint.
    const x = w2sx(ship.x);
    let y = w2sy(ship.y) - 26;
    for (let pass = 0, moved = true; moved && pass < 8; pass++) {
      moved = false;
      for (const o of S.floats)
        if (o.life > 0.3 && Math.abs(o.x - x) < 130 && Math.abs(o.y - y) < 13) { y = o.y - 14; moved = true; }
    }
    const f = { text, x, y, vy: -0.5,
                life: 1.6, color: col, size: 8 };
    S.floats.push(f);
    if (S.floats.length > 24) S.floats.shift();
  }

  function endRound(winner, method, p) {
    if (S.over) return;
    S.over = true;
    if (winner === 0) S.match.you++; else S.match.them++;
    const won = winner === 0;
    const progress = recordDuelOutcome({
      mission:S.mission, won, method, seconds:S.t, shots:S.shotCount, p, stars:S.missionStars || null,
      matchFinished:S.mission < 0 && matchOver(),
      matchWon:S.match.you > S.match.them,
      evidence:{
        bellCollapse:!!(S.ev && S.ev.bellCollapse),
        tCampBroken:!!(S.ev && S.ev.tCampBroken),
        hotspotDefenseTime:S.ev ? S.ev.hotspotDefenseTime : 0,
      },
    });
    S.progress = progress;
    if (progress.newRecords.length) logEv(`New record: ${progress.newRecords.join(', ')}.`, 'quantum');
    if (progress.earnedBadges.length) {
      const titles = progress.earnedBadges.map(id => (DuelProgress.BADGES.find(b => b.id === id) || {}).title).filter(Boolean);
      logEv(`Quantum mastery earned: ${titles.join(', ')}.`, 'quantum');
    }
    S.debrief = DuelCore.debriefLines({
      won, method, p,
      theta: S.rstat ? S.rstat.lastTheta : null,
      shieldedAgainstYou: S.rstat ? S.rstat.shieldedAgainstYou : 0,
      duds: S.rstat ? S.rstat.duds : 0,
      selfPulses: S.rstat ? S.rstat.selfPulses : 0,
      hotspotTime: S.rstat ? S.rstat.hotspotTime : 0,
    });
    tele('debrief_shown', { lines: S.debrief.length, won,
      newRecords:progress.newRecords.slice(), earnedBadges:progress.earnedBadges.slice() });
    // EV-1's optional research instrument, off by default: offer it once a
    // concept mission is actually cleared, which is the only moment its
    // questions are about something the student just did.
    if (won && S.mission >= 0 && GAME.evQuizEnabled)
      setTimeout(() => { if (S.over) openEvQuiz(); }, 1200);
    S.lossStreak = winner === 1 ? (S.lossStreak || 0) + 1 : 0;
    try { localStorage.setItem('qb_loss_streak', String(S.lossStreak)); } catch (e) {}
    if (won && S.mission >= 0) {
      recordTrainingClear(S.mission);
      tele('mission_clear', { mission: S.mission,
        concept: (DuelCore.DUEL_MISSIONS[S.mission] || {}).concept });
    }
    S.round = { winner, method, p, endedAt: S.t };
    if (S.ev && winner === 0) S.ev.won = true;
    S.missionStars = (winner === 0 && S.mission >= 0) ? DuelCore.missionStars(S.mission, S.t, S.shotCount) : 0;
    triggerFx(winner === 0 ? 'ROUND WON · QUBIT COLLAPSED' : 'ROUND LOST · YOUR QUBIT COLLAPSED',
              winner === 0 ? '#3fe08a' : '#ff5a72', 0.75);
    if (winner === 0) sfxRoundWin(); else sfxRoundLoss();
    tele('round_end', {
      winner: winner === 0 ? 'player' : 'sage',
      method, P_at_measure: +p.toFixed(4),
      theta_histogram: S.thetas.slice(0, 200),
      axis_counts: Object.assign({}, S.axisCounts),
      shots: S.shotCount, measures: S.measures,
      duration_s: +S.t.toFixed(2),
    });
  }

  // ── Sim: one fixed 60Hz step ─────────────────────────────────────────
  function step(dt) {
    S.t += dt;
    const me = S.ships[0], foe = S.ships[1];

    // The simulation consumes semantic vectors only. Physical keyboard and
    // controller state is normalized by updateContinuousActions().
    updateContinuousActions();
    let ax = S.actions.move.x, ay = S.actions.move.y;
    if (ax || ay) {
      const m = Math.hypot(ax, ay);
      const accel = K.SHIP_ACCEL * (S.charging ? K.CHARGE_SLOW : 1);
      me.vx += (ax / m) * accel * dt;
      me.vy += (ay / m) * accel * dt;
    }
    const maxSpd = K.SHIP_MAX_SPD * (S.charging ? K.CHARGE_SLOW : 1);
    for (const sh of S.ships) {
      const f = Math.pow(K.SHIP_FRICTION, dt * 60);
      sh.vx *= f; sh.vy *= f;
      const sp = Math.hypot(sh.vx, sh.vy);
      const cap = sh === me ? maxSpd : K.SHIP_MAX_SPD;
      if (sp > cap) { sh.vx = sh.vx / sp * cap; sh.vy = sh.vy / sp * cap; }
      sh.x += sh.vx * dt; sh.y += sh.vy * dt;
      // Solid walls
      const r = K.SHIP_R;
      if (sh.x < r) { sh.x = r; sh.vx = Math.abs(sh.vx) * 0.4; }
      if (sh.x > K.WORLD_W - r) { sh.x = K.WORLD_W - r; sh.vx = -Math.abs(sh.vx) * 0.4; }
      if (sh.y < r) { sh.y = r; sh.vy = Math.abs(sh.vy) * 0.4; }
      if (sh.y > K.WORLD_H - r) { sh.y = K.WORLD_H - r; sh.vy = -Math.abs(sh.vy) * 0.4; }
      // Cooldowns / flashes
      sh.beamCd = Math.max(0, sh.beamCd - dt);
      sh.measCd = Math.max(0, sh.measCd - dt);
      sh.hitFlash = Math.max(0, sh.hitFlash - dt);
      sh.shieldFlash = Math.max(0, sh.shieldFlash - dt);
      // Decoherence — the same Lindblad step the campaign runs per turn,
      // but the LOCAL T1/T2 if this ship is standing in a hotspot.
      const zone = DuelCore.zoneAt(sh.x, sh.y, S.zones);
      const oddsBeforeDecay = DuelCore.odds(sh.bloch);
      if (zone && !sh.inHot && sh.owner === 0) learn('hotspot');
      sh.inHot = !!zone;
      // Linked: each qubit decays through its own channel on the pair's
      // density matrix (hotspots kill entanglement fast). syncPair() below.
      if (sh.bellIdx >= 0 && S.bell)
        S.bell = DuelCore.Pair.decay(S.bell, sh.bellIdx,
          { T1: (zone && zone.t1) || K.T1_S, T2: (zone && zone.t2) || K.T2_S, dt });
      else sh.bloch = DuelCore.decayStep(sh.bloch, dt, zone);
      if (sh.owner === 0 && zone && S.rstat) {
        S.rstat.hotspotTime += dt;
        if (sh.bellIdx < 0 && oddsBeforeDecay >= 0.35
            && DuelCore.odds(sh.bloch) < oddsBeforeDecay - 1e-9) {
          S.rstat.hotspotDefenseTime += dt;
          if (S.ev) S.ev.hotspotDefenseTime += dt;
        }
      }
      sh.entCd = Math.max(0, (sh.entCd || 0) - dt);
      // Mission 5's cage re-charges itself unless Zeno-pinned.
      const MM = DuelCore.DUEL_MISSIONS[S.mission];
      // A real resonant drive on Sage (rotation about x, π in 6 s), so it
      // climbs P(1) = sin²(Ωt/2) and, left alone, Rabi-oscillates back down.
      // Each dud MEASURE resets it to |0⟩, where the climb starts over slowly
      // (quadratically): measure often and it stays near |0⟩.
      if (MM && MM.regen && sh.owner === 1 && sh.zenoUntil <= S.t && sh.bellIdx < 0 && S.introT <= 0)
        sh.bloch = DuelCore.rotateBloch(sh.bloch, DuelCore.AXES.X, Math.PI / 6 * dt);
      if (sh.arc) { sh.arc.t += dt * 1000 / K.ARC_MS; if (sh.arc.t >= 1) sh.arc = null; }
      // MEASURE wind-up (telegraph), then launch.
      if (sh.winding > 0) {
        sh.winding = Math.max(0, sh.winding - dt);
        if (sh.winding === 0) fireMeasure(sh);
      }
    }
    syncPair();
    if (S.ev) {
      S.ev.maxFoeOdds = Math.max(S.ev.maxFoeOdds, DuelCore.odds(foe.bloch));
      S.ev.elapsed = S.t; S.ev.fidelity = me.fidelity;
    }
    if (S.gateMsgT > 0) S.gateMsgT = Math.max(0, S.gateMsgT - dt);
    if (S.actions.aim.active) {
      S.aim.x = me.x + S.actions.aim.x * K.WORLD_W;
      S.aim.y = me.y + S.actions.aim.y * K.WORLD_W;
    }
    me.ang = Math.atan2(S.aim.y - me.y, S.aim.x - me.x);
    if (S.charging) S.chargeT += dt;

    // PD-24 — the real opponent (see DuelBot). It parks on eigenstates,
    // spends T-charges to break YOUR camp, flees to a hotspot to dump a
    // dangerous charge, and entangles when it is losing.
    botThink(foe, me, dt);

    // Projectiles
    for (const p of S.proj) {
      if (!p.live) continue;
      // Aim assist (player only): a beam takes ~0.7 s to cross the arena and
      // Sage moves several ship-widths in that time, so unassisted shots at
      // where Sage IS almost always miss. Steer toward Sage inside a 60° cone.
      if (p.owner === 0 && GAME.aimAssist) {
        const tg = S.ships[1];
        const cur = Math.atan2(p.vy, p.vx);
        let da = Math.atan2(tg.y - p.y, tg.x - p.x) - cur;
        da = Math.atan2(Math.sin(da), Math.cos(da));
        if (Math.abs(da) < AIM_CONE) {
          const a = cur + Math.max(-AIM_TURN * dt, Math.min(AIM_TURN * dt, da));
          const sp = Math.hypot(p.vx, p.vy);
          p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp;
        }
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.ttl -= dt;
      if (p.ttl <= 0 || p.x < -40 || p.x > K.WORLD_W + 40 || p.y < -40 || p.y > K.WORLD_H + 40) {
        p.live = false; continue;
      }
      const target = S.ships[1 - p.owner];
      if (Math.hypot(p.x - target.x, p.y - target.y) <= K.SHIP_R) {
        p.live = false;
        if (p.kind === 'beam') landBeam(p, target);
        else if (p.kind === 'entangle') landEntangle(p, target);
        else landMeasure(p, target);
      }
    }
    // ── Pickups: calibration (fidelity) and T-charges ─────────────────
    // Fixed cadence, alternating type, never random-rewarded (P6 bans
    // variable-ratio gambling) — you can plan for them.
    S.pickupTimer -= dt;
    const freeDuel = S.mission < 0;
    if (S.pickupTimer <= 0 && S.pickups.length < (freeDuel ? 4 : 3)) {
      S.pickupTimer = freeDuel ? 6 : 9;
      // Duel Training keeps its original calib/T alternation (its missions
      // are tuned around it); the free duel walks the full fixed rotation.
      const kind = freeDuel
        ? DuelCore.PICKUP_CYCLE[(S.pickupSeq++) % DuelCore.PICKUP_CYCLE.length]
        : (S.pickups.length + S.shotCount) % 2 === 0 ? 'calib' : 'tgate';
      let px, py, tries = 0;
      do {
        px = 120 + S.rand() * (K.WORLD_W - 240);
        py = 100 + S.rand() * (K.WORLD_H - 200);
        tries++;
      } while (DuelCore.zoneAt(px, py, S.zones) && tries < 12);
      S.pickups.push({ x: px, y: py, kind, t: 0 });
    }
    for (let i = S.pickups.length - 1; i >= 0; i--) {
      const pk = S.pickups[i];
      pk.t += dt;
      for (const sh of S.ships) {
        if (Math.hypot(pk.x - sh.x, pk.y - sh.y) > K.SHIP_R + 14) continue;
        applyPickup(sh, pk.kind);
        beep(660, 'triangle', 0.07, 0.14);
        S.pickups.splice(i, 1);
        break;
      }
    }
    // Floaters
    for (let i = S.floats.length - 1; i >= 0; i--) {
      const f = S.floats[i];
      f.y += f.vy; f.life -= dt;
      if (f.life <= 0) S.floats.splice(i, 1);
    }
    // Particles
    for (const q of S.parts) {
      if (!q.live) continue;
      q.x += q.vx * dt; q.y += q.vy * dt;
      q.vx *= 0.94; q.vy *= 0.94;
      q.life -= dt;
      if (q.life <= 0) q.live = false;
    }
  }

  // ── The opponent (PD-24) ────────────────────────────────────────────
  // Builds the snapshot DuelBot.decide() wants, then executes the intent it
  // returns over the following frames. The bot itself stays pure; all the
  // timing, cooldown and charge-hold bookkeeping lives here.
  let _botT = 0, _botIntent = null, _botHold = 0, _botPrevOdds = 0;

  function botView(foe, me) {
    const eig = b => ({ X: DuelCore.isEigenstate(b, 'X'),
                        Y: DuelCore.isEigenstate(b, 'Y'),
                        Z: DuelCore.isEigenstate(b, 'Z') });
    let nearestZone = null, best = Infinity;
    for (const z of S.zones) {
      const d = Math.hypot(z.x - foe.x, z.y - foe.y);
      if (d < best) { best = d; nearestZone = z; }
    }
    const foeOdds = DuelCore.odds(me.bloch);     // odds on the PLAYER (reduced state if linked)
    return {
      me: { x: foe.x, y: foe.y, inHot: foe.inHot, tCharges: foe.tCharges,
            beamReady: foe.beamCd === 0, measReady: foe.measCd === 0 && foe.winding === 0,
            entReady: (foe.entCd || 0) <= 0 },
      foe: { x: me.x, y: me.y, measReady: me.measCd === 0 },
      foeOdds,                                   // what the bot can win with
      foeOddsFalling: foeOdds < _botPrevOdds - 1e-4,
      myOdds: DuelCore.odds(foe.bloch),
      myEigen: eig(foe.bloch), foeEigen: eig(me.bloch),
      myBloch: foe.bloch,
      foeAxisCounts: S.axisCounts,
      parkingAxis: (S.botParkingAxis &&
        !DuelCore.isEigenstate(foe.bloch, S.botParkingAxis)) ? S.botParkingAxis : null,
      myMeasStreak: (me.measStamps || []).length,
      nearestZone, bell: !!S.bell, t: S.t,
    };
  }

  function botThink(foe, me, dt) {
    if (S.over) return;
    const MD = DuelCore.DUEL_MISSIONS[S.mission];
    if (MD && MD.drone) {
      // Training drone: a slow, readable figure-eight across the right half.
      // Closer and slower in the Zeno mission, where MEASURE orbs must land often.
      const near = MD.measureCd ? 1 : 0;
      const tx = K.WORLD_W * ((near ? 0.55 : 0.68) + (near ? 0.06 : 0.14) * Math.sin(S.t * 0.35)),
            ty = K.WORLD_H * (0.5 + (near ? 0.15 : 0.28) * Math.sin(S.t * 0.7));
      foe.vx += (tx - foe.x) * dt * 1.2; foe.vy += (ty - foe.y) * dt * 1.2;
      foe.ang = Math.atan2(me.y - foe.y, me.x - foe.x);
      return;
    }
    const L = DuelBot.levelOf(GAME.difficulty);
    _botT -= dt;
    const view = botView(foe, me);
    // Do NOT re-decide mid-charge. A Duelist thinks every 0.6s but a full
    // pulse takes ~1.2s to charge, so an unconditional re-decide reset the
    // hold timer forever and the bot never released a single shot (caught by
    // counting projectiles in a live 12s idle test, not by the harness —
    // decide() was correct, the shell around it deadlocked). Being committed
    // while charging also mirrors the player, who is slowed mid-charge.
    const busy = _botIntent && (_botIntent.fire || _botIntent.selfPulse) && _botHold > 0;
    if (_botT <= 0 && !busy) {
      _botT = L.tick;
      _botIntent = DuelBot.decide(view, GAME.difficulty, S.rand, S.lossStreak || 0);
      // Hold the park commitment until it actually lands on the axis.
      S.botParkingAxis = _botIntent.parkingAxis || null;
      _botPrevOdds = view.foeOdds;
      if (_botIntent.reason) GAME.botLastReason = _botIntent.reason;
      _botHold = _botIntent.hold || 0;
    }
    const it = _botIntent;
    if (!it) return;

    // Steering
    const m = Math.hypot(it.moveX, it.moveY);
    if (m > 1e-6) {
      foe.vx += (it.moveX / m) * K.SHIP_ACCEL * dt * 0.85;
      foe.vy += (it.moveY / m) * K.SHIP_ACCEL * dt * 0.85;
    }
    foe.ang = it.aim;

    // Linked counterplay: when the player telegraphs a MEASURE while the
    // outcomes MATCH, a π self-pulse makes them OPPOSITE, so a dud leaves the
    // player at |1⟩. Duelist and up, after a human-ish reaction delay.
    if (S.bell && foe.bellIdx >= 0 && me.winding > 0 && (S.pairZZ || 0) > 0.3
        && L.useBell && foe.beamCd === 0) {
      S.botFlipT = (S.botFlipT || 0) + dt;
      if (S.botFlipT > 0.45) { selfPulse(foe, Math.PI, 'X'); S.botFlipT = 0; }
    } else S.botFlipT = 0;

    // One-shot actions, cleared so they fire once per decision.
    if (it.measure && foe.measCd === 0 && foe.winding === 0) {
      windMeasure(foe); it.measure = false;
    } else if (it.entangle && !S.bell && (foe.entCd || 0) <= 0
               && Math.abs(foe.bloch.z) > 0.7 && foe.beamCd === 0) {
      // A CNOT from a pole does nothing useful: get into superposition first.
      selfPulse(foe, Math.PI / 2, 'X');
      it.entangle = false;
    } else if (it.entangle && !S.bell && (foe.entCd || 0) <= 0) {
      const q = take(S.proj);
      if (q) {
        q.live = true; q.kind = 'entangle'; q.owner = 1; q.ttl = 4;
        q.x = foe.x + Math.cos(foe.ang) * K.SHIP_R;
        q.y = foe.y + Math.sin(foe.ang) * K.SHIP_R;
        q.vx = Math.cos(foe.ang) * 520; q.vy = Math.sin(foe.ang) * 520;
        foe.entCd = 12;
      }
      it.entangle = false;
    } else if ((it.fire || it.selfPulse) && foe.beamCd === 0) {
      // Charge for the requested hold, then release.
      _botHold -= dt;
      if (_botHold <= 0) {
        const theta = it.theta != null ? it.theta : DuelCore.driveTheta(it.hold || 0.6, rabiMult(foe));
        if (it.selfPulse) selfPulse(foe, theta, it.beam);
        else fireBeam(foe, theta, it.beam);
        it.fire = it.selfPulse = false;
      }
    }
  }

  // ── Frame: accumulate real time, sim in fixed steps, draw once ───────
  function frame(ts) {
    if (!S.active) return;
    if (S.last == null) S.last = ts;
    let dt = (ts - S.last) / 1000; S.last = ts;
    if (!(dt > 0)) dt = 1 / 60;
    dt = Math.min(dt, 0.25);                       // tab-return clamp
    const t0 = performance.now();
    if (!S.briefing) S.introT = Math.max(0, S.introT - dt);
    if (S.learnQ && S.learnQ.length && !S.paused && !S.briefing) {
      S.learnQ[0].t += dt; if (S.learnQ[0].t > LEARN_S) S.learnQ.shift();
    }
    S.announceT = Math.max(0, S.announceT - dt);
    S.shake = Math.max(0, S.shake - dt * 2.4);
    S.flash = Math.max(0, S.flash - dt * 2.8);
    pollGamepad();
    if (!S.paused && !S.over && !S.briefing) {
      if (S.hitStop > 0) {
        // Measurement reveal: the sim holds still while the roll is shown.
        S.hitStop = Math.max(0, S.hitStop - dt);
        if (S.hitStop === 0 && S.pendingEnd) {
          const pe = S.pendingEnd; S.pendingEnd = null;
          S.reveal = null;
          endRound(pe[0], pe[1], pe[2]);
        }
      } else {
        S.acc += dt;
        let guard = 0;
        while (S.acc >= 1 / 60 && !(S.hitStop > 0) && guard++ < 8) { step(1 / 60); S.acc -= 1 / 60; }
      }
    }
    if (S.reveal && !S.paused) {
      S.reveal.t += dt;
      if (S.reveal.t > REVEAL_S && !S.pendingEnd) S.reveal = null;
    }
    draw();
    const ms = performance.now() - t0;
    S.frameMs.push(ms); if (S.frameMs.length > 240) S.frameMs.shift();
  }

  function p95() {
    if (!S.frameMs.length) return 0;
    const a = S.frameMs.slice().sort((x, y) => x - y);
    return a[Math.min(a.length - 1, Math.floor(a.length * 0.95))];
  }

  // ── Draw ─────────────────────────────────────────────────────────────
  function draw() {
    ctx.clearRect(0, 0, BOARD, BOARD);
    // Letterbox bands (HUD lives here)
    ctx.fillStyle = '#05070f';
    ctx.fillRect(0, 0, BOARD, BAND);
    ctx.fillRect(0, BOARD - BAND, BOARD, BAND);
    ctx.save();
    ctx.beginPath(); ctx.rect(0, BAND, BOARD, VIEW_H); ctx.clip();
    if (!REDUCE_MOTION && S.shake > 0) {
      const amp = 8 * Math.min(1, S.shake);
      ctx.translate((Math.random() * 2 - 1) * amp, (Math.random() * 2 - 1) * amp);
    }

    drawStarfield();
    drawZones();
    drawPickups();

    // Projectiles
    for (const p of S.proj) {
      if (!p.live) continue;
      const x = w2sx(p.x), y = w2sy(p.y);
      if (p.kind === 'beam') {
        const len = 16 * SCALE * (0.6 + p.theta / Math.PI);
        const a = Math.atan2(p.vy, p.vx);
        ctx.strokeStyle = p.owner === 0 ? '#ff5a72' : '#ffa83c';
        ctx.lineWidth = Math.max(1.5, K.BEAM_W * SCALE * (0.5 + p.theta / Math.PI * 0.7));
        ctx.shadowColor = ctx.strokeStyle; ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(x - Math.cos(a) * len, y - Math.sin(a) * len);
        ctx.lineTo(x, y); ctx.stroke();
        ctx.shadowBlur = 0;
      } else {
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 14;
        ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(x, y, 9 + Math.sin(S.t * 20) * 2, 0, Math.PI * 2); ctx.stroke();
      }
    }
    // Particles
    for (const q of S.parts) {
      if (!q.live) continue;
      ctx.globalAlpha = Math.max(0, q.life / q.max);
      ctx.fillStyle = q.col;
      ctx.beginPath(); ctx.arc(w2sx(q.x), w2sy(q.y), q.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    S.ships.forEach(drawShip);
    drawEntangleLink();
    drawFloatsDuel();
    if (!REDUCE_MOTION && S.flash > 0) {
      ctx.globalAlpha = Math.min(0.2, S.flash);
      ctx.fillStyle = S.flashColor;
      ctx.fillRect(0, BAND, BOARD, VIEW_H);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    drawHud();
    drawCoach();
    drawLearn();
    drawReveal();
    drawAnnouncer();
    if (S.paused) drawPauseMenu();
    if (S.briefing) drawBrief();
    if (S.over) drawDebrief();
  }

  // Hotspots: a visibly noisy patch of chip. Read as terrain, not decoration.
  function drawZones() {
    for (const z of S.zones) {
      const x = w2sx(z.x), y = w2sy(z.y), r = z.r * SCALE;
      const g = ctx.createRadialGradient(x, y, r * 0.15, x, y, r);
      g.addColorStop(0, 'rgba(255,90,114,0.16)');
      g.addColorStop(0.7, 'rgba(255,90,114,0.07)');
      g.addColorStop(1, 'rgba(255,90,114,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = `rgba(255,90,114,${0.22 + 0.10 * Math.sin(S.t * 2)})`;
      ctx.lineWidth = 1.5; ctx.setLineDash([6, 6]);
      ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(255,140,155,0.55)';
      ctx.font = `700 ${Math.round(BOARD * 0.0138)}px ${CANVAS_BODY}`;
      ctx.textAlign = 'center';
      ctx.fillText('DECOHERENCE', x, y - 4);
      ctx.fillText('T₂ ' + DuelCore.ZONE.HOT_T2 + 's', x, y + 12);
      ctx.textAlign = 'left';
    }
  }

  function drawPickups() {
    for (const pk of S.pickups) {
      const x = w2sx(pk.x), y = w2sy(pk.y);
      const bob = Math.sin(pk.t * 3) * 3;
      const P = DuelCore.PICKUPS[pk.kind] || DuelCore.PICKUPS.calib;
      const col = P.color;
      ctx.save(); ctx.translate(x, y + bob);
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.shadowColor = col; ctx.shadowBlur = 12;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const a = (i / 6) * Math.PI * 2 + pk.t;
        const px = Math.cos(a) * 11, py = Math.sin(a) * 11;
        i ? ctx.lineTo(px, py) : ctx.moveTo(px, py);
      }
      ctx.closePath(); ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.fillStyle = col;
      ctx.font = `700 ${Math.round(BOARD * 0.014)}px ${CANVAS_BODY}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(P.glyph, 0, 0);
      ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      ctx.restore();
    }
  }

  function drawFloatsDuel() {
    ctx.textAlign = 'center';
    for (const f of S.floats) {
      ctx.globalAlpha = Math.min(1, f.life);
      ctx.fillStyle = f.color;
      ctx.font = `700 ${Math.round(BOARD * 0.0163)}px ${CANVAS_BODY}`;
      ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }

  function drawStarfield() {
    // PD-10 — two procedural parallax layers; real nebula tiles are D2.
    for (const st of S.stars) {
      const px = (st.x - S.t * 14 * st.z) % K.WORLD_W;
      const x = w2sx(px < 0 ? px + K.WORLD_W : px), y = w2sy(st.y);
      ctx.globalAlpha = st.z === 0.8 ? 0.85 : 0.4;
      ctx.fillStyle = st.z === 0.8 ? '#cfd6ee' : '#7c8ce6';
      ctx.fillRect(x, y, st.r, st.r);
    }
    ctx.globalAlpha = 1;
  }

  function drawEntangleLink() {
    if (!S.bell) return;
    const [a, b] = S.ships;
    const e = Math.min(1, 2 * (S.pairNeg || 0));            // 1 = Bell pair, 0 = none left
    ctx.strokeStyle = `rgba(201,123,255,${(0.2 + 0.6 * e) * (0.75 + 0.25 * Math.sin(S.t * 8))})`;
    ctx.lineWidth = 1 + 2.5 * e; ctx.setLineDash(e > 0.1 ? [8, 6] : [2, 8]);
    ctx.beginPath();
    ctx.moveTo(w2sx(a.x), w2sy(a.y)); ctx.lineTo(w2sx(b.x), w2sy(b.y));
    ctx.stroke(); ctx.setLineDash([]);
  }

  function drawShip(sh) {
    const x = w2sx(sh.x), y = w2sy(sh.y), R = K.SHIP_R * SCALE;
    // Charge aura: how close this qubit is to |1⟩ (its own vulnerability).
    const od = DuelCore.odds(sh.bloch);
    if (od > 0.02) {
      const g = ctx.createRadialGradient(x, y, R * 0.3, x, y, R * 2.4);
      g.addColorStop(0, `rgba(255,90,114,${0.30 * od})`);
      g.addColorStop(1, 'rgba(255,90,114,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, R * 2.4, 0, Math.PI * 2); ctx.fill();
    }
    if (sh.shieldFlash > 0) {
      ctx.strokeStyle = `rgba(154,163,207,${sh.shieldFlash * 2})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x, y, R * 1.5, 0, Math.PI * 2); ctx.stroke();
    }
    // P(|1⟩) ring: the qubit's state, drawn where the action is. A MEASURE
    // on this ship hits with exactly this probability.
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.beginPath(); ctx.arc(x, y, R * 1.35, 0, Math.PI * 2); ctx.stroke();
    if (od > 0.005) {
      ctx.strokeStyle = od > 0.75 ? '#3fe08a' : od > 0.4 ? '#f5b73c' : '#ff8fa0';
      ctx.beginPath(); ctx.arc(x, y, R * 1.35, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * od); ctx.stroke();
    }
    ctx.font = `700 ${Math.round(BOARD * 0.0138)}px ${CANVAS_BODY}`;
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(230,235,255,0.85)';
    ctx.fillText(`${sh.owner === 0 ? 'YOU' : 'SAGE'} ${Math.round(od * 100)}%`, x, y + R * 1.35 + 14);
    ctx.textAlign = 'left';
    ctx.save();
    ctx.translate(x, y); ctx.rotate(sh.ang);
    ctx.fillStyle = sh.hitFlash > 0 ? '#ffffff' : sh.col;
    ctx.shadowColor = sh.col; ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.moveTo(R, 0); ctx.lineTo(-R * 0.7, R * 0.75);
    ctx.lineTo(-R * 0.35, 0); ctx.lineTo(-R * 0.7, -R * 0.75);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
    // Charging tell: a ring that fills toward the π-pulse.
    if (sh === S.ships[0] && S.charging) {
      const frac = Math.min(1, S.chargeT / K.CHARGE_FULL_S);
      ctx.strokeStyle = S.selfAim ? '#2fe0d0' : '#f5b73c'; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(x, y, R * 1.7, -Math.PI / 2, -Math.PI / 2 + frac * Math.PI * 2);
      ctx.stroke();
    }
    if (sh.winding > 0) {
      const frac = 1 - sh.winding / (sh.windTotal || K.MEASURE_WIND_S);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.arc(x, y, R * 2.1 - frac * R, 0, Math.PI * 2); ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // Interpolate the sphere along the great-circle arc of the rotation that
  // just landed, so the swing reads as the rotation it physically was.
  function shownBloch(sh) {
    if (!sh.arc) return sh.bloch;
    const t = Math.min(1, sh.arc.t), a = sh.arc.from, b = sh.arc.to;
    const ax = a.x*(1-t)+b.x*t, ay = a.y*(1-t)+b.y*t, az = a.z*(1-t)+b.z*t;
    const ma = Math.hypot(a.x,a.y,a.z), mb = Math.hypot(b.x,b.y,b.z);
    const want = ma*(1-t)+mb*t, cur = Math.hypot(ax,ay,az) || 1;
    const k = want / cur;                          // renormalize: arc, not chord
    return { x: ax*k, y: ay*k, z: az*k };
  }

  function drawHud() {
    const me = S.ships[0], foe = S.ships[1];
    // Opponent — top-left, with the live win-odds readout (§5).
    drawMiniSphere(ctx, 62, 74, 42, shownBloch(foe), foe.col, true);
    const pvw = chargePreview(me, foe);
    if (pvw && !S.selfAim) drawGhostVector(62, 74, 42, pvw.bloch);
    const od = DuelCore.odds(foe.bloch);
    hudText('YOUR WIN CHANCE IF YOU MEASURE SAGE NOW', 118, 52, '#aeb8e6', 'var');
    ctx.font = `600 ${Math.round(BOARD * 0.045)}px 'Rajdhani','Space Grotesk',sans-serif`;
    ctx.fillStyle = od > 0.75 ? '#3fe08a' : od > 0.4 ? '#f5b73c' : '#ff5a72';
    ctx.textAlign = 'left';
    ctx.fillText(`${(od * 100).toFixed(0)}%`, 118, 92);
    const zz = S.pairZZ || 0, ent = (S.pairNeg || 0) > LINK_ENT_MIN;
    const corr = zz > 0.3 ? 'outcomes MATCH' : zz < -0.3 ? 'outcomes OPPOSITE' : 'outcomes uncorrelated';
    hudText(S.bell ? `${ent ? `ENTANGLED ${Math.round(S.pairNeg * 200)}%` : 'CORRELATED, no entanglement left'} · ${corr} (⟨ZZ⟩ ${zz >= 0 ? '+' : ''}${zz.toFixed(2)})`
                   : 'GOAL: rotate Sage\'s qubit to |1⟩, then MEASURE it · don\'t get measured at |1⟩ yourself',
            118, 112, S.bell ? '#c97bff' : '#cfd6ee');
    if (S.bell && Math.abs(zz) > 0.3)
      hudText(zz > 0 ? 'a dud MEASURE on them drops you to |0⟩ too · hotspots break the link'
                     : 'careful: a dud MEASURE on them leaves YOU at |1⟩ · π self-pulse to re-match',
              118, 130, zz > 0 ? '#c97bff' : '#f5b73c');
    else if (foe.zenoUntil > S.t) hudText('ZENO-PINNED — cannot be rotated', 118, 130, '#8b7dff');
    else if (!S.bell && foe.detuneUntil > S.t)
      hudText(`DETUNED ${(foe.detuneUntil - S.t).toFixed(0)}s — your X/Y beams are off-resonant (from |0⟩: ${Math.round(100 / (1 + DuelCore.PICKUPS.detune.dOverO ** 2))}% max)`,
              118, 130, DuelCore.PICKUPS.detune.color);
    else if (!S.bell && DuelCore.BEAMS[S.beam] && DuelCore.BEAMS[S.beam].kind === 'attack'
             && DuelCore.isEigenstate(foe.bloch, DuelCore.BEAMS[S.beam].axis))
      // Only when the camp actually blocks the beam you have SELECTED —
      // otherwise this fires on any cardinal state and reads as noise.
      hudText(`CAMPED against your ${S.beam}-beam — a T-phase (3) knocks them off`,
              118, 130, '#f5b73c');

    // Mission brief — the concept, stated once, where it is needed.
    const M = DuelCore.DUEL_MISSIONS[S.mission];
    if (M) {
      ctx.font = `700 ${Math.round(BOARD * 0.0175)}px ${CANVAS_BODY}`;
      ctx.fillStyle = '#f5b73c';
      ctx.fillText(`MISSION ${M.id + 1} · ${M.title}`, 118, 30);
      drawSteps(M);
      if (M.hurry) {
        const left = Math.max(0, M.hurry - S.t);
        ctx.textAlign = 'right';
        hudText(`T₁ WINDOW ${left.toFixed(1)}s`, BOARD - 16, 78,
                left < 6 ? '#ff5a72' : '#f5b73c');
        ctx.textAlign = 'left';
      }
    }
    // Gate feedback — why a collapse did not count.
    if (S.gateMsgT > 0 && S.gateMsg) {
      ctx.globalAlpha = Math.min(1, S.gateMsgT);
      const gy = BOARD - BAND - 54;
      ctx.fillStyle = 'rgba(5,7,15,0.88)';
      ctx.fillRect(60, gy - 20, BOARD - 120, 40);
      ctx.strokeStyle = '#9aa3cf'; ctx.lineWidth = 1;
      ctx.strokeRect(60, gy - 20, BOARD - 120, 40);
      ctx.textAlign = 'center';
      ctx.font = `700 ${Math.round(BOARD * 0.0163)}px ${CANVAS_BODY}`;
      ctx.fillStyle = '#cfd6ee';
      ctx.fillText(S.gateMsg.slice(0, 96), BOARD / 2, gy + 5);
      ctx.textAlign = 'left';
      ctx.globalAlpha = 1;
    }

    // Round pips — top-right (best-of-3 lands in D1; D0 shows one round).
    ctx.textAlign = 'right';
    hudText(M ? (M.par ? `PAR ${M.par.s}s · ${M.par.shots} shot${M.par.shots === 1 ? '' : 's'}` : '')
              : `ROUND ${S.match.no} OF 3 · YOU ${S.match.you} – ${S.match.them} SAGE`, BOARD - 16, 40, '#aeb8e6');
    hudText(`shots ${S.shotCount}   ${(S.t).toFixed(0)}s   ·   ESC pause / menu`, BOARD - 16, 60, '#6f79a8');
    if (S.showPerf) hudText(`p95 ${p95().toFixed(2)}ms`, BOARD - 16, 80, '#3fe08a');
    ctx.textAlign = 'left';

    // Player — bottom-left.
    const by = BOARD - BAND;
    drawMiniSphere(ctx, 62, by + 74, 42, shownBloch(me), me.col, true);
    if (pvw && S.selfAim) drawGhostVector(62, by + 74, 42, pvw.bloch);
    const myOdds = DuelCore.odds(me.bloch);
    hudText('YOUR QUBIT = YOUR HEALTH', 118, by + 34, '#aeb8e6');
    // Health bar: green while you sit near |0⟩, red as Sage pushes you to |1⟩.
    const hx = 300, hw = 170;
    ctx.fillStyle = 'rgba(255,255,255,0.10)'; roundRect(hx, by + 24, hw, 12, 3); ctx.fill();
    ctx.fillStyle = myOdds > 0.6 ? '#ff5a72' : myOdds > 0.3 ? '#f5b73c' : '#3fe08a';
    roundRect(hx, by + 24, hw * Math.max(0.03, 1 - myOdds), 12, 3); ctx.fill();
    hudText(`risk: Sage's MEASURE would hit you ${(myOdds * 100).toFixed(0)}% of the time`
            + (me.inHot ? ' · hotspot pulling you to |0⟩' : ''),
            118, by + 54, me.inHot ? '#3fe08a' : myOdds > 0.6 ? '#ff5a72' : '#8f9ac4');

    // Charge bar with π-fraction ticks — the player reads pulse AREA.
    const kx = BOARD - 292;                       // control strip column (right)
    const bx = 118, bw = kx - 20 - bx, bh = 14, byy = by + 74;
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    roundRect(bx, byy, bw, bh, 3); ctx.fill();
    const frac = S.charging ? Math.min(1, S.chargeT * rabiMult(me) / K.CHARGE_FULL_S) : 0;
    if (frac > 0) {
      ctx.fillStyle = frac >= 0.999 ? '#3fe08a' : '#f5b73c';
      roundRect(bx, byy, bw * frac, bh, 3); ctx.fill();
    }
    // Green mark: the best charge for the selected beam, from Sage's current state.
    const bp = (GAME.coach && !S.bell) ? DuelCore.bestPulse(foe.bloch, S.beam) : null;
    if (bp && bp.theta > 0.02 && bp.p1 > DuelCore.odds(foe.bloch) + 0.05) {
      const tx = bx + bw * (bp.theta / Math.PI);
      ctx.fillStyle = '#3fe08a';
      ctx.fillRect(tx - 2, byy - 3, 4, bh + 6);
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1;
    [[0.25,'π/4'],[0.5,'π/2'],[0.75,'3π/4'],[1,'π']].forEach(([f, lab]) => {
      const tx = bx + bw * f;
      ctx.beginPath(); ctx.moveTo(tx, byy); ctx.lineTo(tx, byy + bh); ctx.stroke();
      ctx.textAlign = 'center';
      hudText(lab, tx, byy + bh + 15, '#6f79a8');
    });
    ctx.textAlign = 'left';
    hudText(S.charging ? chargePreviewText(me, foe)
                       : `${DUEL_CONTROLS.keyboard.attack} / LEFT-HOLD attack  ·  ${DUEL_CONTROLS.keyboard.selfPulse} / RIGHT-HOLD self-pulse`,
            bx, byy - 6, S.charging ? (S.selfAim ? '#2fe0d0' : '#f5b73c') : '#6f79a8');

    // Resource row: fidelity + T-charges + selected beam.
    const rx = 118, ry = byy + bh + 34;
    hudText('PULSE FIDELITY', rx, ry, '#6f79a8');
    ctx.font = `600 ${Math.round(BOARD * 0.020)}px 'Rajdhani','Space Grotesk',sans-serif`;
    ctx.fillStyle = me.fidelity > 0.85 ? '#3fe08a' : me.fidelity > 0.6 ? '#f5b73c' : '#ff5a72';
    ctx.fillText(`${(me.fidelity * 100) | 0}%`, rx + 105, ry + 1);
    hudText(`±${(DuelCore.sigmaFor(me.fidelity) * 180 / Math.PI).toFixed(0)}° aim`, rx + 150, ry, '#6f79a8');
    hudText('T-CHARGES', rx + 230, ry, '#6f79a8');
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = i < me.tCharges ? '#f5b73c' : 'rgba(255,255,255,0.12)';
      ctx.beginPath(); ctx.arc(rx + 305 + i * 15, ry - 4, 5, 0, Math.PI * 2); ctx.fill();
    }

    // Active power-ups — one line under the resource row.
    const boosts = [];
    if (me.driveUntil > S.t) boosts.push([`DRIVE ×2 ${(me.driveUntil - S.t).toFixed(0)}s`, DuelCore.PICKUPS.drive.color]);
    if (me.detuneUntil > S.t) boosts.push([`DETUNED ${(me.detuneUntil - S.t).toFixed(0)}s`, DuelCore.PICKUPS.detune.color]);
    if (me.fastReadout) boosts.push(['FAST READOUT armed', DuelCore.PICKUPS.readout.color]);
    if (GAME.aimAssist) boosts.push(['AIM ASSIST on', '#6f79a8']);
    let bxx = rx;
    for (const [txt, col] of boosts) {
      hudText(txt, bxx, ry + 20, col);
      bxx += ctx.measureText(txt).width + 16;
    }

    // Control strip — one manifest feeds the live behavior and these labels.
    const beamName = (DuelCore.BEAMS[S.beam] || {}).label || 'X-BEAM';
    hudText(`ACTIVE INPUT · ${S.inputDevice}`, kx, by + 22, S.inputDevice === 'GAMEPAD' ? '#2fe0d0' : '#6f79a8');
    hudText(`${DUEL_CONTROLS.keyboard.move} move · ${DUEL_CONTROLS.keyboard.aim} aim`, kx, by + 42, '#6f79a8');
    hudText(`${DUEL_CONTROLS.keyboard.attack} attack · ${DUEL_CONTROLS.keyboard.selfPulse} self-pulse`, kx, by + 62, '#6f79a8');
    ctx.fillStyle = (DuelCore.BEAMS[S.beam] || {}).color || '#ff5a72';
    ctx.font = `700 ${Math.round(BOARD * 0.0163)}px ${CANVAS_BODY}`;
    ctx.fillText(`${DUEL_CONTROLS.keyboard.beams}  ${beamName}${S.beam === 'T' ? ' ×' + me.tCharges : ''}`, kx, by + 82);
    const measReady = me.measCd === 0 && me.winding === 0;
    const entReady = !S.bell && (me.entCd || 0) <= 0;
    const entTag = S.bell ? ' (linked)' : entReady ? '' : ` (${(me.entCd||0).toFixed(0)}s)`;
    hudText(`${DUEL_CONTROLS.keyboard.measure} measure ${measReady ? '(ready)' : '(' + me.measCd.toFixed(1) + 's)'} · ${DUEL_CONTROLS.keyboard.entangle} entangle${entTag}`,
            kx, by + 102, measReady ? '#3fe08a' : '#6f79a8');
    hudText(`${S.gamepad.index == null ? 'PAD' : 'PAD CONNECTED'} · LS/RS move/aim · RT/LT pulses`,
            kx, by + 122, S.gamepad.index == null ? '#6f79a8' : '#2fe0d0');
  }

  // Mission checklist (Qubit Copter / Rabi Rider style): every step of the
  // mission, done ✓, the current one highlighted with its live progress.
  // What releasing the charge right now would do, from the current states
  // (the exact rotation, before pulse-fidelity error and flight time).
  function chargePreview(me, foe) {
    if (!S.charging || S.bell) return null;
    const spec = DuelCore.BEAMS[S.beam] || DuelCore.BEAMS.X;
    const th = spec.fixedTheta != null ? spec.fixedTheta : DuelCore.driveTheta(S.chargeT, rabiMult(me));
    const who = S.selfAim ? me : foe;
    let after;
    if (!S.selfAim && spec.kind === 'attack' && detuneOf(foe))
      after = DuelCore.detunedRotate(foe.bloch, DuelCore.AXES[spec.axis], th, detuneOf(foe));
    else if (!S.selfAim && spec.kind === 'attack' && DuelCore.isEigenstate(foe.bloch, spec.axis))
      after = foe.bloch;
    else after = DuelCore.rotateBloch(who.bloch, DuelCore.AXES[spec.axis], th);
    return { who, before: DuelCore.odds(who.bloch), after: DuelCore.odds(after), bloch: after, th };
  }
  function chargePreviewText(me, foe) {
    const pv = chargePreview(me, foe);
    if (!pv) return S.selfAim ? 'RELEASE: pulse YOUR qubit' : 'RELEASE TO FIRE';
    const a = Math.round(pv.before * 100), b = Math.round(pv.after * 100), th = (pv.th / Math.PI).toFixed(2);
    return S.selfAim
      ? `RELEASE: ${th}π on YOU · your risk ${a}% → ${b}%${b < a - 2 ? ' (safer)' : b > a + 2 ? ' (riskier!)' : ''}`
      : `RELEASE: ${th}π on Sage · your win chance ${a}% → ${b}%`;
  }

  // Mission checklist height, so banners and the reveal can sit below it.
  const stepsOffset = () => {
    const M = DuelCore.DUEL_MISSIONS[S.mission];
    return M && M.steps ? 22 + M.steps.length * 20 + (M.drone ? 16 : 0) + 18 : 0;
  };
  function drawSteps(M) {
    if (S.briefing) return;
    if (!M.steps) { wrapHud(M.brief, 118, BAND + 22, BOARD - 150, '#8f9ac4'); return; }
    const me = S.ships[0], foe = S.ships[1];
    const v = { foeOdds: DuelCore.odds(foe.bloch), myOdds: DuelCore.odds(me.bloch), t: S.t, fidelity: me.fidelity };
    const done = M.steps.map(st => !!st.done(S.ev || {}, v));
    let cur = done.indexOf(false);
    const x0 = 14, y0 = BAND + 12, W = 330, H = 22 + M.steps.length * 20 + (M.drone ? 16 : 0);
    ctx.save();
    ctx.fillStyle = 'rgba(5,7,15,0.78)'; roundRect(x0, y0, W, H, 6); ctx.fill();
    ctx.strokeStyle = 'rgba(245,183,60,0.45)'; ctx.lineWidth = 1; roundRect(x0, y0, W, H, 6); ctx.stroke();
    ctx.font = `700 ${Math.round(BOARD * 0.0138)}px ${CANVAS_BODY}`; ctx.fillStyle = '#f5b73c';
    ctx.fillText(`MISSION ${M.id + 1} · ${done.filter(Boolean).length}/${M.steps.length} STEPS`, x0 + 10, y0 + 16);
    M.steps.forEach((st, i) => {
      const y = y0 + 36 + i * 20, ok = done[i], now = i === cur;
      ctx.font = `${now ? 700 : 500} ${Math.round(BOARD * 0.0138)}px ${CANVAS_BODY}`;
      ctx.fillStyle = ok ? '#3fe08a' : now ? '#ffffff' : '#6f79a8';
      let line = `${ok ? '✓' : now ? '▶' : '○'} ${st.text}`;
      while (ctx.measureText(line).width > W - 20 && line.length > 10) line = line.slice(0, -2);
      ctx.fillText(line, x0 + 10, y);
      if (now && st.progress) {
        ctx.textAlign = 'right'; ctx.fillStyle = '#f5b73c';
        ctx.fillText(st.progress(v), x0 + W + 170, y);   // outside the box, toward the arena centre
        ctx.textAlign = 'left';
      }
    });
    if (M.drone) { ctx.fillStyle = '#8f9ac4'; ctx.font = `500 ${Math.round(BOARD * 0.0128)}px ${CANVAS_BODY}`;
      ctx.fillText('Training drone: Sage flies but never shoots back', x0 + 10, y0 + H - 6); }
    ctx.restore();
  }

  // Coach: the single most useful next step, with the physics reason.
  // Pure function of state so it is cheap and testable in the browser.
  function coachHint() {
    const me = S.ships[0], foe = S.ships[1];
    if (!me || !foe || S.over) return null;
    const pf = DuelCore.odds(foe.bloch), pm = DuelCore.odds(me.bloch), pct = v => Math.round(v * 100);
    const kb = DUEL_CONTROLS.keyboard;
    const spec = DuelCore.BEAMS[S.beam] || DuelCore.BEAMS.X;
    if (S.charging) {
      const th = DuelCore.driveTheta(S.chargeT, rabiMult(me)) / Math.PI;
      return [`Release to ${S.selfAim ? 'pulse yourself' : 'fire'}: a ${th.toFixed(2)}π rotation${th > 0.97 ? ' (a π-pulse flips |0⟩ ↔ |1⟩)' : ''}`, '#f5b73c'];
    }
    if (foe.winding > 0) return ['Sage is winding up a MEASURE: dodge the white orb, or drop your odds first', '#ff5a72'];
    if (pm > 0.6 && !S.bell)
      return [`You are ${pct(pm)}% |1⟩, so a MEASURE on you likely hits. Self-pulse (${kb.selfPulse}) back toward |0⟩, or fly into a hotspot: decay pulls you to |0⟩`, '#ff5a72'];
    if (S.bell) {
      const zz = S.pairZZ || 0;
      if (zz < -0.3) return [`Linked, outcomes OPPOSITE: a dud would leave YOU at |1⟩. A π self-pulse (${kb.selfPulse}) makes them MATCH`, '#f5b73c'];
      return [`Linked, outcomes MATCH: MEASURE now (${kb.measure}) is a safe 50% shot. If it is a dud you both go to |0⟩`, '#c97bff'];
    }
    if (pf >= 0.7 && me.measCd === 0 && me.winding === 0)
      return [`Sage is ${pct(pf)}% |1⟩. MEASURE (${kb.measure}) now, and stop firing: another π-pulse would rotate them back toward |0⟩`, '#3fe08a'];
    if (pf >= 0.7)
      return [`Sage is ${pct(pf)}% |1⟩. Hold fire: rotations are cyclic, and a π-pulse from here undoes your work`, '#3fe08a'];
    if (spec.kind === 'attack' && DuelCore.isEigenstate(foe.bloch, spec.axis) && pf > 0.02)
      return [`Sage sits on the ${spec.axis} axis, where an ${spec.axis}-rotation does nothing. Switch beam (1/2) or use a T-phase (3)`, '#f5b73c'];
    const best = DuelCore.bestAttack(foe.bloch, S.beam === 'Y' ? 'Y' : 'X');
    const frac = (best.theta / Math.PI).toFixed(2);
    const sw = (S.beam !== best.beam) ? ` (switch with ${best.beam === 'X' ? '1' : '2'})` : '';
    const purity = Math.hypot(foe.bloch.x, foe.bloch.y, foe.bloch.z);
    if (purity < 0.5 && pf > 0.2)
      return [`Decoherence made Sage's qubit mixed: no rotation gets past ${pct((1 + purity) / 2)}%. MEASURE: a dud resets it to a clean |0⟩`, '#c97bff'];
    if (best.p1 < pf + 0.05)
      return [`Sage is ${pct(pf)}% |1⟩ and no single beam does much better. MEASURE (${kb.measure}) and trust the odds`, '#aeb8e6'];
    if (pf < 0.1 && best.theta > 0.9 * Math.PI)
      return [`Hold ${kb.attack} for a FULL charge and hit Sage: a π-pulse rotates their qubit from |0⟩ to |1⟩`, '#aeb8e6'];
    return [`Best shot: ${best.beam}-beam${sw} charged to ${frac}π (green mark on your charge bar) takes Sage from ${pct(pf)}% to ${pct(best.p1)}%`, '#aeb8e6'];
  }
  function drawCoach() {
    if (!GAME.coach || S.introT > 0 || S.briefing || S.paused) return;
    const h = coachHint(); if (!h) return;
    const y = BAND + VIEW_H - 14;
    ctx.save();
    let fs = Math.round(BOARD * 0.0163);
    ctx.font = `600 ${fs}px ${CANVAS_BODY}`;
    while (ctx.measureText(h[0]).width > BOARD - 64 && fs > 9) { fs--; ctx.font = `600 ${fs}px ${CANVAS_BODY}`; }
    const w = Math.min(BOARD - 40, ctx.measureText(h[0]).width + 24);
    ctx.fillStyle = 'rgba(5,7,15,0.78)';
    roundRect((BOARD - w) / 2, y - 15, w, 22, 6); ctx.fill();
    ctx.textAlign = 'center';
    ctx.fillStyle = h[1];
    ctx.fillText(h[0], BOARD / 2, y);
    ctx.restore();
  }

  // Measurement reveal: the Born rule, drawn. The bar is split at P(|1⟩); the
  // marker slides to the uniform draw, and the outcome is |1⟩ iff it stops
  // in the left (|1⟩) part. Entangled measures have no single draw to show,
  // so they show the 50/50 split and the correlated result.
  function drawReveal() {
    const R = S.reveal; if (!R) return;
    const fadeIn = Math.min(1, R.t / 0.12);
    const fadeOut = S.pendingEnd ? 1 : Math.min(1, (REVEAL_S - R.t) / 0.4);
    const a = Math.max(0, Math.min(fadeIn, fadeOut));
    if (a <= 0) return;
    const yours = R.shooter === 0;
    const W = 440, H = 82, x0 = (BOARD - W) / 2, y0 = BAND + 70 + stepsOffset();
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(5,7,15,.9)';
    roundRect(x0, y0, W, H, 8); ctx.fill();
    ctx.strokeStyle = yours ? '#2fe0d0' : '#ff4d9d'; ctx.lineWidth = 1;
    roundRect(x0, y0, W, H, 8); ctx.stroke();
    ctx.textAlign = 'center';
    hudText(yours ? 'YOUR MEASURE ON SAGE' : 'SAGE MEASURES YOUR QUBIT', BOARD / 2, y0 + 18,
            yours ? '#2fe0d0' : '#ff4d9d');
    // Bar: [0, p) is |1⟩ (hit), [p, 1) is |0⟩ (dud)
    const bx = x0 + 20, bw = W - 40, by = y0 + 28, bh = 16;
    ctx.fillStyle = 'rgba(255,255,255,0.10)';
    roundRect(bx, by, bw, bh, 3); ctx.fill();
    ctx.fillStyle = yours ? 'rgba(63,224,138,.75)' : 'rgba(255,90,114,.75)';
    if (R.p > 0) { roundRect(bx, by, bw * R.p, bh, 3); ctx.fill(); }
    ctx.font = `700 ${Math.round(BOARD * 0.0138)}px ${CANVAS_BODY}`;
    ctx.fillStyle = '#05070f';
    if (R.p > 0.16) { ctx.textAlign = 'left'; ctx.fillText(`|1⟩ ${(R.p * 100).toFixed(0)}%`, bx + 6, by + 12); }
    ctx.fillStyle = '#cfd6ee';
    if (R.p < 0.84) { ctx.textAlign = 'right'; ctx.fillText(`|0⟩ ${((1 - R.p) * 100).toFixed(0)}%`, bx + bw - 6, by + 12); }
    let line;
    if (R.draw != null) {
      const k = REDUCE_MOTION ? 1 : Math.min(1, R.t / 0.3), e = 1 - Math.pow(1 - k, 3);
      const mx = bx + bw * R.draw * e;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(mx - 1.5, by - 5, 3, bh + 10);
      ctx.beginPath(); ctx.moveTo(mx - 6, by - 9); ctx.lineTo(mx + 6, by - 9); ctx.lineTo(mx, by - 3); ctx.fill();
      line = `random draw ${R.draw.toFixed(2)} ${R.outcome ? '<' : '≥'} P(|1⟩) ${R.p.toFixed(2)}  →  |${R.outcome}⟩`;
      if (R.bell && R.partnerP1 != null) {
        const pp = R.partnerP1, who = yours ? 'you' : 'Sage';
        line += pp > 0.98 ? ` · ${who} → |1⟩` : pp < 0.02 ? ` · ${who} → |0⟩` : ` · ${who} now ${(pp * 100).toFixed(0)}%`;
      }
    } else {
      line = `entangled: P(|1⟩) = ${(R.p * 100).toFixed(0)}% and both qubits collapse to |${R.outcome}⟩`;
    }
    const verdict = R.blocked ? ' · SHIELDED'
      : R.outcome ? (yours ? ' · HIT' : ' · YOU ARE HIT') : ' · DUD';
    ctx.textAlign = 'center';
    hudText(line + verdict, BOARD / 2, y0 + 68,
            R.outcome && !R.blocked ? (yours ? '#3fe08a' : '#ff5a72') : '#aeb8e6');
    ctx.textAlign = 'left';
    ctx.restore();
  }

  // Dashed "after release" vector, same projection as drawMiniSphere.
  function drawGhostVector(cx, cy, R, b) {
    const sx = cx + R * (b.x * 0.7 + b.y * 0.3), sy = cy - R * b.z;
    ctx.save(); ctx.setLineDash([3, 3]); ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(sx, sy); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(sx, sy, 3, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }

  // ── Pause menu, brief card, first-time concept cards ─────────────────
  function drawPauseMenu() {
    ctx.save();
    ctx.fillStyle = 'rgba(5,7,15,0.92)'; ctx.fillRect(0, BAND, BOARD, VIEW_H);

    PAUSE_BTNS.forEach((b, i) => {

      ctx.strokeStyle = i === 0 ? '#3fe08a' : 'rgba(174,184,230,0.5)'; ctx.lineWidth = 1;
      roundRect(q.x, q.y, q.w, q.h, 6); ctx.stroke();
      ctx.font = `700 ${Math.round(BOARD * 0.018)}px ${CANVAS_BODY}`;
      ctx.fillStyle = '#e8ecff'; ctx.fillText(`${b.label}  ·  ${b.key}`, BOARD / 2, q.y + 22);
    });

    ctx.fillText('Gamepad: MENU or A resume · X restart · B quit · click a button with the mouse', BOARD / 2, BOARD * 0.5 + 3 * 44 + 18);
    ctx.restore();
